<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1f2d45; }
      @font-face { font-family: "Black Han Sans"; src: url("fonts/BlackHanSans.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Jua"; src: url("fonts/Jua.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Apple SD Gothic Neo"; src: local("Apple SD Gothic Neo"); }
      body { font-family: "Jua", "Apple SD Gothic Neo", sans-serif; color: #26221c; }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      #s1 { z-index: 10; } #s2 { z-index: 20; } #s3 { z-index: 30; } #s4 { z-index: 40; }
      #s5 { z-index: 50; } #s6 { z-index: 60; } #s7 { z-index: 70; }
      .stage { position: absolute; inset: 0; }
      .char { position: absolute; }
      .char .bob { width: 100%; height: 100%; }
      .char.flip .bob { transform: scaleX(-1); }
      .prop { position: absolute; }

      .stamp {
        position: absolute; font-family: "Black Han Sans"; text-align: center;
        border: 9px solid; border-radius: 20px; padding: 14px 40px; line-height: 1.1;
        background: rgba(246, 239, 227, 0.94); visibility: hidden;
      }
      .stamp small { display: block; font-size: 34px; color: #1f2d45; font-family: "Jua", sans-serif; }

      .num-pop {
        position: absolute; font-family: "Black Han Sans"; color: #f6efe3;
        line-height: 0.9; visibility: hidden; text-shadow: 0 8px 0 rgba(15, 20, 30, 0.28);
      }
      .num-pop em { font-style: normal; color: #e8b74a; }
      .num-pop small { display: block; font-size: 38px; font-family: "Jua", sans-serif; color: #f6efe3; line-height: 1.5; }

      /* scene backdrops */
      #s1 .stage, #s3 .stage, #s6 .stage { background: #8ec9e8; }
      #s2 .stage { background: #7b8fa6; }
      #s4 .stage { background: #c9b48f; }   /* 세피아 — '옛 교과서 삽화'(지어낸 이야기) 신호 */
      #s5 .stage { background: #6b7a8c; }
      #s7 .stage { background: #f6efe3; }

      /* s1 — 불탔다?(붉은, 물음표) → 5.49s 현존 반전 */
      .s1-stamp  { top: 165px; left: 55px; color: #d94f37; border-color: #d94f37; font-size: 62px; white-space: nowrap; transform: rotate(-4deg); }
      .s1-reveal { top: 360px; left: 55px; color: #2e7d46; border-color: #2e7d46; font-size: 72px; white-space: nowrap; transform: rotate(3deg); }
      /* s2 — 생몰/신분 미상 */
      .s2-name  { top: 175px; left: 55px; color: #1f2d45; border-color: #1f2d45; font-size: 58px; white-space: nowrap; transform: rotate(-3deg); }
      .s2-num   { top: 360px; left: 70px; font-size: 130px; text-align: left; }
      /* s3 — 6.7m·22첩 */
      .s3-num-a { top: 470px; right: 78px; font-size: 120px; text-align: right; }
      .s3-num-b { top: 210px; right: 78px; font-size: 118px; text-align: right; }
      /* s4 — 3번·8번 (교과서 삽화 톤) */
      .s4-num-a { top: 200px; right: 80px; font-size: 128px; text-align: right; }
      .s4-num-b { top: 430px; right: 96px; font-size: 108px; text-align: right; }
      /* s5 — 1925 + 실록 무기록 */
      .s5-num    { top: 175px; right: 78px; font-size: 132px; text-align: right; }
      .s5-stamp  { top: 430px; left: 55px; color: #1f2d45; border-color: #1f2d45; font-size: 50px; white-space: nowrap; transform: rotate(-3deg); }
      .s5-stamp2 { top: 560px; left: 55px; color: #d94f37; border-color: #d94f37; font-size: 58px; white-space: nowrap; transform: rotate(3deg); }
      /* s6 펀치라인 — 11장 보물 */
      .s6-num   { top: 185px; right: 82px; font-size: 168px; text-align: right; }
      .s6-stamp { top: 430px; left: 55px; color: #b8860b; border-color: #e8b74a; font-size: 60px; white-space: nowrap; transform: rotate(-3deg); }

      /* outro */
      .logo-big {
        position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-family: "Black Han Sans"; font-size: 190px; color: #1f2d45; line-height: 1.02; letter-spacing: -0.03em;
      }
      .logo-big em { font-style: normal; color: #d94f37; }
      .s7-sub { position: absolute; top: 760px; left: 0; right: 0; text-align: center; font-size: 52px; color: #26221c; }
      .subscribe {
        position: absolute; top: 900px; right: 80px; width: max-content;
        background: #d94f37; color: #f6efe3; font-family: "Black Han Sans"; font-size: 84px;
        padding: 26px 90px; border-radius: 999px; box-shadow: 10px 10px 0 #1f2d45;
      }

      /* overlay */
      #overlay { z-index: 100; }
      .brand-badge {
        position: absolute; top: 60px; left: 60px;
        background: #1f2d45; color: #f6efe3; font-family: "Black Han Sans";
        font-size: 44px; padding: 14px 34px; border-radius: 14px; box-shadow: 6px 6px 0 rgba(38,34,28,0.25);
      }
      .brand-badge em { font-style: normal; color: #e8b74a; }
      .cap-wrap { position: absolute; left: 0; right: 0; bottom: 380px; text-align: center; }
      .cap-group { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0; visibility: hidden; }
      .cap-group .pill {
        display: inline-block; background: rgba(31, 45, 69, 0.9);
        padding: 22px 52px; border-radius: 26px; font-size: 74px; color: #f6efe3; line-height: 1.22; max-width: 900px;
        word-break: keep-all;
      }
      .cap-group .hi { color: #e8b74a; font-family: "Black Han Sans"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60.1" data-width="1080" data-height="1920">

      <!-- ===================== Scene 1 · 훅 — 목판 불탔다? → 박물관에 현존 ===================== -->
      <div id="s1" class="clip scene" data-start="0" data-duration="7.95" data-track-index="0">
        <div class="stage">
          <!-- 환경: 하늘 구름 + 연기 -->
          <svg class="prop" data-adj="s1-cloud-a" style="top:130px; left:360px; width:250px; height:118px;" viewBox="0 0 140 65">
            <g data-obj="s1-cloud-a-body"><path d="M 10 50 Q 0 24 27 20 Q 34 4 55 10 Q 72 -4 90 10 Q 118 4 118 26 Q 136 32 124 48 Q 128 58 108 58 L 24 58 Q 2 58 10 50 Z" fill="#f6efe3"/></g>
          </svg>
          <svg class="prop" data-adj="s1-cloud-b" style="top:300px; left:80px; width:210px; height:98px;" viewBox="0 0 140 65">
            <g data-obj="s1-cloud-b-body"><path d="M 10 50 Q 0 24 27 20 Q 34 4 55 10 Q 72 -4 90 10 Q 118 4 118 26 Q 136 32 124 48 Q 128 58 108 58 L 24 58 Q 2 58 10 50 Z" fill="#eef4f8"/></g>
          </svg>
          <!-- 보조: 연기 뭉게(불에서 오르는) -->
          <svg class="prop" data-adj="s1-smoke" style="left:250px; bottom:1130px; width:360px; height:320px;" viewBox="0 0 240 220">
            <g data-obj="s1-smoke-puffs" fill="#8794a3" opacity="0.72">
              <circle cx="120" cy="160" r="42"/><circle cx="80" cy="120" r="34"/><circle cx="150" cy="110" r="38"/>
              <circle cx="110" cy="72" r="30"/><circle cx="160" cy="60" r="24"/><circle cx="86" cy="52" r="20"/>
            </g>
          </svg>
          <!-- 주 소품(앵커): 대동여지도 목판 — 두꺼운 나무 판 + 양끝 마구리(끝단목) = 인쇄 목판 시그니처, 새김면에 실물 지도 -->
          <div class="prop" data-adj="s1-mokpan" style="left:130px; bottom:620px; width:560px; height:470px;">
            <svg data-obj="s1-mokpan-wood" width="560" height="470" viewBox="0 0 560 470" style="position:absolute; inset:0; display:block;">
              <!-- 판 두께(깊은 3D 면) -->
              <polygon points="56,398 504,398 530,442 82,442" fill="#6b4d24"/>
              <polygon points="504,80 530,110 530,442 504,398" fill="#5c4120"/>
              <!-- 판 앞면 -->
              <rect x="56" y="60" width="448" height="338" fill="#a9803f"/>
              <line x1="150" y1="66" x2="156" y2="392" stroke="#946d33" stroke-width="3" opacity="0.45"/>
              <line x1="280" y1="66" x2="276" y2="392" stroke="#946d33" stroke-width="3" opacity="0.45"/>
              <line x1="410" y1="66" x2="414" y2="392" stroke="#946d33" stroke-width="3" opacity="0.45"/>
              <!-- 마구리(양끝 끝단목) — 결이 수직이라 가로 그레인. 목판/책판 결정적 시그니처 -->
              <g data-obj="s1-mokpan-cleat-l">
                <rect x="52" y="52" width="52" height="354" fill="#8a6329"/>
                <rect x="52" y="52" width="52" height="354" fill="none" stroke="#5c4120" stroke-width="3"/>
                <line x1="58" y1="120" x2="98" y2="120" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
                <line x1="58" y1="200" x2="98" y2="200" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
                <line x1="58" y1="286" x2="98" y2="286" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
                <line x1="58" y1="352" x2="98" y2="352" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
              </g>
              <g data-obj="s1-mokpan-cleat-r">
                <rect x="456" y="52" width="52" height="354" fill="#8a6329"/>
                <rect x="456" y="52" width="52" height="354" fill="none" stroke="#5c4120" stroke-width="3"/>
                <line x1="462" y1="120" x2="502" y2="120" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
                <line x1="462" y1="200" x2="502" y2="200" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
                <line x1="462" y1="286" x2="502" y2="286" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
                <line x1="462" y1="352" x2="502" y2="352" stroke="#6b4d24" stroke-width="2" opacity="0.55"/>
              </g>
            </svg>
            <!-- 지도를 나무결에 스며들게(multiply) — '나무에 새겨/찍힌' 판독 유도 -->
            <img data-obj="s1-mokpan-map" src="assets/daedongyeojido.jpg" alt="" style="position:absolute; left:190px; top:86px; width:176px; height:292px; object-fit:contain; display:block; mix-blend-mode:multiply;">
          </div>
          <!-- 보조: 불꽃(밑에서 핥는) — 5.49s 반전에 꺼진다 -->
          <svg class="prop" data-adj="s1-flames" style="left:170px; bottom:600px; width:520px; height:240px;" viewBox="0 0 520 220">
            <g data-obj="s1-flames-outer" fill="#d94f37">
              <path d="M 60 220 Q 30 150 74 120 Q 60 170 96 150 Q 84 100 120 70 Q 112 140 150 118 Q 140 180 110 220 Z"/>
              <path d="M 210 220 Q 178 140 224 104 Q 210 168 250 140 Q 236 86 276 54 Q 268 132 306 108 Q 296 176 262 220 Z"/>
              <path d="M 380 220 Q 352 156 392 128 Q 380 174 416 154 Q 404 108 440 82 Q 432 146 468 126 Q 458 184 428 220 Z"/>
            </g>
            <g data-obj="s1-flames-inner" fill="#e8b74a">
              <path d="M 236 220 Q 214 160 246 132 Q 236 176 264 156 Q 254 118 282 96 Q 276 156 300 140 Q 292 186 268 220 Z"/>
              <path d="M 96 220 Q 78 168 104 146 Q 96 182 120 166 Q 112 132 136 112 Q 130 164 150 150 Q 144 190 124 220 Z"/>
            </g>
          </svg>
        </div>
        <div class="stamp s1-stamp">대원군이 불태웠다?</div>
        <div class="stamp s1-reveal">지금도 박물관에</div>
      </div>

      <!-- ===================== Scene 2 · 김정호 소개 — 생몰/신분 미상 ===================== -->
      <div id="s2" class="clip scene" data-start="7.50" data-duration="8.28" data-track-index="1">
        <div class="stage">
          <!-- 환경: 서재 창(세살 창호) — 인물 뒤 배경으로 중앙 여백 채움 -->
          <svg class="prop" data-adj="s2-window" style="top:420px; left:330px; width:440px; height:528px;" viewBox="0 0 200 240">
            <g data-obj="s2-window-frame"><rect x="6" y="6" width="188" height="228" fill="#5a4632"/><rect x="18" y="18" width="164" height="204" fill="#e9dcbf"/></g>
            <g data-obj="s2-window-lattice" stroke="#5a4632" stroke-width="4">
              <line x1="60" y1="18" x2="60" y2="222"/><line x1="100" y1="18" x2="100" y2="222"/><line x1="140" y1="18" x2="140" y2="222"/>
              <line x1="18" y1="70" x2="182" y2="70"/><line x1="18" y1="86" x2="182" y2="86"/><line x1="18" y1="102" x2="182" y2="102"/>
            </g>
          </svg>
          <!-- 보조: 책더미 -->
          <svg class="prop" data-adj="s2-books" style="left:70px; bottom:560px; width:230px; height:200px;" viewBox="0 0 230 200">
            <g data-obj="s2-books-stack">
              <rect x="20" y="150" width="190" height="40" rx="4" fill="#8a6d4b"/><rect x="20" y="150" width="190" height="10" fill="#a3855e"/>
              <rect x="34" y="108" width="164" height="42" rx="4" fill="#6f8a6a"/><rect x="34" y="108" width="164" height="10" fill="#88a181"/>
              <rect x="26" y="66" width="180" height="42" rx="4" fill="#9a5f4c"/><rect x="26" y="66" width="180" height="10" fill="#b57767"/>
              <rect x="150" y="24" width="60" height="82" rx="4" fill="#6b6f86" transform="rotate(8 180 65)"/>
            </g>
          </svg>
          <!-- 주 소품(앵커): 서안(낮은 좌식) + 그리는 중인 대동여지도 실물 -->
          <div class="prop" data-adj="s2-desk" style="left:300px; bottom:560px; width:520px; height:340px;">
            <svg data-obj="s2-desk-svg" width="520" height="340" viewBox="0 0 520 340" style="position:absolute; inset:0; display:block;">
              <!-- 지도 종이 -->
              <rect x="150" y="20" width="250" height="180" rx="6" fill="#f6efe3"/>
              <rect x="150" y="20" width="250" height="180" rx="6" fill="none" stroke="#d8c7a8" stroke-width="4"/>
              <!-- 서안 상판 + 다리(낮은 좌식) -->
              <g data-obj="s2-desk-body">
                <rect x="120" y="196" width="310" height="30" rx="6" fill="#6e4a2a"/>
                <rect x="120" y="196" width="310" height="10" fill="#8a6136"/>
                <rect x="140" y="226" width="26" height="70" fill="#5a3c22"/>
                <rect x="384" y="226" width="26" height="70" fill="#5a3c22"/>
                <rect x="132" y="290" width="286" height="12" rx="4" fill="#4a3018"/>
              </g>
              <!-- 붓(종이에 닿음) -->
              <g data-obj="s2-desk-brush">
                <rect x="336" y="150" width="86" height="9" rx="4" fill="#b98a4a" transform="rotate(24 336 154)"/>
                <path d="M 328 172 Q 306 176 318 188 Q 328 196 342 184 Q 350 174 328 172 Z" fill="#26221c"/>
              </g>
            </svg>
            <img data-obj="s2-desk-map" src="assets/daedongyeojido.jpg" alt="" style="position:absolute; left:196px; top:26px; width:104px; height:168px; object-fit:contain; display:block;">
          </div>
        </div>
        <div class="stamp s2-name">고산자 김정호</div>
        <div class="num-pop s2-num"><em>?</em>~<em>?</em><small>생몰년 · 신분 미상</small></div>
      </div>

      <!-- ===================== Scene 3 · 대동여지도 — 6.7m·22첩·목판 인쇄 복제 ===================== -->
      <div id="s3" class="clip scene" data-start="15.33" data-duration="12.70" data-track-index="0">
        <div class="stage">
          <!-- 환경: 하늘 구름 -->
          <svg class="prop" data-adj="s3-cloud" style="top:120px; left:120px; width:230px; height:108px;" viewBox="0 0 140 65">
            <g data-obj="s3-cloud-body"><path d="M 10 50 Q 0 24 27 20 Q 34 4 55 10 Q 72 -4 90 10 Q 118 4 118 26 Q 136 32 124 48 Q 128 58 108 58 L 24 58 Q 2 58 10 50 Z" fill="#f6efe3"/></g>
          </svg>
          <!-- 보조: 목판으로 찍혀 나온 지도 사본 여러 장(복제) — 부채꼴 스택, 앞장에 실물 지도 -->
          <div class="prop" data-adj="s3-copies" style="left:560px; bottom:560px; width:410px; height:640px;">
            <div data-obj="s3-copies-3" style="position:absolute; left:118px; top:70px; width:250px; height:500px; background:#e2d8c1; border-radius:8px; transform:rotate(9deg); transform-origin:50% 100%; box-shadow:6px 6px 0 rgba(38,34,28,0.12);"></div>
            <div data-obj="s3-copies-2" style="position:absolute; left:78px; top:50px; width:250px; height:500px; background:#ece3cd; border-radius:8px; transform:rotate(4.5deg); transform-origin:50% 100%; box-shadow:6px 6px 0 rgba(38,34,28,0.12);"></div>
            <div data-obj="s3-copies-1" style="position:absolute; left:36px; top:34px; width:250px; height:500px; background:#f6efe3; border-radius:8px; box-shadow:6px 6px 0 rgba(38,34,28,0.14);">
              <img src="assets/daedongyeojido.jpg" alt="" style="position:absolute; left:16px; top:16px; width:218px; height:360px; object-fit:contain; display:block;">
            </div>
          </div>
          <!-- 주 소품(앵커): 대동여지도 실물(국립중앙박물관, 22첩 전체) — 컷아웃 액자 안에 마운트.
               절첩식 지도판이므로 족자(축)가 아닌 평면 액자로(지뢰 #29 형식 오류 회피). -->
          <div class="prop" data-adj="s3-map" style="left:110px; bottom:560px; width:440px; height:701px;">
            <div data-obj="s3-map-frame" style="position:absolute; inset:0; background:#6e4a2a; border-radius:12px;"></div>
            <div data-obj="s3-map-mat" style="position:absolute; left:14px; top:14px; right:14px; bottom:14px; background:#efe7d2; border-radius:4px;"></div>
            <img data-obj="s3-map-relic" src="assets/daedongyeojido.jpg" alt=""
                 style="position:absolute; left:20px; top:20px; width:400px; height:661px; object-fit:contain; display:block;">
          </div>
          <!-- 6.7m 세로 치수 화살표 -->
          <svg class="prop" data-adj="s3-dim" style="left:62px; bottom:560px; width:44px; height:701px;" viewBox="0 0 44 701">
            <g data-obj="s3-dim-arrow" stroke="#1f2d45" stroke-width="6" fill="none">
              <line x1="22" y1="18" x2="22" y2="683"/>
              <polyline points="10,38 22,14 34,38"/><polyline points="10,663 22,687 34,663"/>
            </g>
          </svg>
        </div>
        <div class="num-pop s3-num-a"><em>6.7</em><small>미터 · 세로</small></div>
        <div class="num-pop s3-num-b"><em>22</em>첩<small>목판 인쇄</small></div>
      </div>

      <!-- ===================== Scene 4 · 배운 이야기(신화) — 8번·3번·옥사 [교과서 삽화 톤] ===================== -->
      <div id="s4" class="clip scene" data-start="27.58" data-duration="8.70" data-track-index="1">
        <div class="stage">
          <!-- 환경: 세피아 하늘 구름 + 원경 능선 -->
          <svg class="prop" data-adj="s4-ridge" style="left:0; bottom:1090px; width:1080px; height:150px;" viewBox="0 0 1080 150">
            <g data-obj="s4-ridge-body"><path d="M 0 150 L 0 92 Q 220 40 430 78 Q 640 116 860 60 Q 980 34 1080 66 L 1080 150 Z" fill="#a99169"/><path d="M 0 150 L 0 120 Q 300 96 620 118 Q 900 136 1080 110 L 1080 150 Z" fill="#8f784f"/></g>
          </svg>
          <svg class="prop" data-adj="s4-cloud" style="top:150px; left:120px; width:210px; height:98px;" viewBox="0 0 140 65">
            <g data-obj="s4-cloud-body"><path d="M 10 50 Q 0 24 27 20 Q 34 4 55 10 Q 72 -4 90 10 Q 118 4 118 26 Q 136 32 124 48 Q 128 58 108 58 L 24 58 Q 2 58 10 50 Z" fill="#efe6d2"/></g>
          </svg>
          <!-- 주 소품(앵커): 백두산 — 눈 덮인 봉우리 + 천지 (우측 배치: 김정호 머리와 안 겹치게) -->
          <svg class="prop" data-adj="s4-mtn" style="left:250px; bottom:560px; width:540px; height:620px;" viewBox="0 0 560 640">

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var T = TRANSITION;

      // ---------- mount characters from SCENES ----------
      function setExprDirect(root, name) {
        var e = EXPRESSIONS[name];
        EYE_CLASSES.forEach(function (c) { root.querySelector("." + c).setAttribute("visibility", c === e.eye ? "visible" : "hidden"); });
        MOUTH_CLASSES.forEach(function (c) { root.querySelector("." + c).setAttribute("visibility", c === e.mouth ? "visible" : "hidden"); });
        gsap.set(root.querySelector(".brow-l"), { y: e.browY, rotation: e.browRotL, svgOrigin: "82 64" });
        gsap.set(root.querySelector(".brow-r"), { y: e.browY, rotation: e.browRotR, svgOrigin: "118 64" });
      }
      function setPoseDirect(root, name) {
        var p = POSES[name];
        gsap.set(root.querySelector(".arm-l"), { rotation: p.l, svgOrigin: "60 152" });
        gsap.set(root.querySelector(".arm-r"), { rotation: p.r, svgOrigin: "140 152" });
      }

      var charEls = {};
      SCENES.forEach(function (scene) {
        var stage = document.querySelector("#" + scene.id + " .stage");
        scene.chars.forEach(function (c) {
          var div = document.createElement("div");
          div.className = "char char-" + c.id + (c.flip ? " flip" : "");
          div.setAttribute("data-adj", c.id);
          div.style.left = "calc(" + c.x + "% - " + c.w / 2 + "px)";
          div.style.bottom = c.bottom + "px";
          div.style.width = c.w + "px";
          div.style.height = c.w * 1.2 + "px";
          var bob = document.createElement("div");
          bob.className = "bob";
          bob.innerHTML = makeCharacter(c);
          div.appendChild(bob);
          stage.appendChild(div);
          setExprDirect(div, c.expr);
          setPoseDirect(div, c.pose);
          charEls[c.id] = div;
        });
      });

      // ---------- expression / pose changes ----------
      function tlExpr(sel, name, at) {
        var e = EXPRESSIONS[name];
        EYE_CLASSES.forEach(function (c) { tl.set(sel + " ." + c, { attr: { visibility: c === e.eye ? "visible" : "hidden" } }, at); });
        MOUTH_CLASSES.forEach(function (c) { if (c === "m-open") return; tl.set(sel + " ." + c, { attr: { visibility: c === e.mouth ? "visible" : "hidden" } }, at); });
        tl.to(sel + " .brow-l", { y: e.browY, rotation: e.browRotL, svgOrigin: "82 64", duration: 0.18, ease: "power2.out" }, at);
        tl.to(sel + " .brow-r", { y: e.browY, rotation: e.browRotR, svgOrigin: "118 64", duration: 0.18, ease: "power2.out" }, at);
      }
      function tlPose(sel, name, at) {
        var p = POSES[name];
        tl.to(sel + " .arm-l", { rotation: p.l, svgOrigin: "60 152", duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(sel + " .arm-r", { rotation: p.r, svgOrigin: "140 152", duration: 0.3, ease: "back.out(2)" }, at);
      }
      SCENES.forEach(function (scene) {
        (scene.changes || []).forEach(function (ch) {
          var sel = ".char-" + ch.char;
          if (ch.expr) tlExpr(sel, ch.expr, ch.at);
          if (ch.pose) tlPose(sel, ch.pose, ch.at);
        });
      });

      // ---------- lip flaps ----------
      SCENES.forEach(function (scene) {
        var talkerCfg = scene.chars.filter(function (c) { return c.id === scene.talker; })[0];
        if (!talkerCfg) return;
        var sel = ".char-" + scene.talker;
        var visFrom = scene.start, visTo = scene.start + scene.dur;
        var idle = EXPRESSIONS[talkerCfg.expr].mouth;
        var changePoints = (scene.changes || []).filter(function (ch) { return ch.expr && ch.char === scene.talker; });
        function idleAt(t) { var m = idle; changePoints.forEach(function (ch) { if (ch.at <= t) m = EXPRESSIONS[ch.expr].mouth; }); return m; }
        WORDS.forEach(function (w) {
          if (w.start < visFrom || w.start > visTo) return;
          var open = false;
          for (var t = w.start; t < Math.min(w.end, visTo) - 0.04; t += 0.1) {
            open = !open;
            tl.set(sel + " .m-open", { attr: { visibility: open ? "visible" : "hidden" } }, t);
            tl.set(sel + " ." + idleAt(t), { attr: { visibility: open ? "hidden" : "visible" } }, t);
          }
          var tEnd = Math.min(w.end, visTo);
          tl.set(sel + " .m-open", { attr: { visibility: "hidden" } }, tEnd);
          tl.set(sel + " ." + idleAt(tEnd), { attr: { visibility: "visible" } }, tEnd);
        });
      });

      // ---------- blinks + idle bob ----------
      SCENES.forEach(function (scene) {
        scene.chars.forEach(function (c, ci) {
          var sel = ".char-" + c.id;
          if (EXPRESSIONS[c.expr].eye === "eye-open") {
            var t0 = scene.start + 1.1 + ci * 0.7;
            for (var t = t0; t < scene.start + scene.dur - 0.4; t += 2.6) {
              tl.set(sel + " .eye-open", { attr: { visibility: "hidden" } }, t);
              tl.set(sel + " .eye-closed", { attr: { visibility: "visible" } }, t);
              tl.set(sel + " .eye-open", { attr: { visibility: "visible" } }, t + 0.13);
              tl.set(sel + " .eye-closed", { attr: { visibility: "hidden" } }, t + 0.13);
            }
          }
          var bobCycles = Math.ceil(scene.dur / 0.55) - 1;
          tl.to(sel + " .bob", { y: -5, duration: 0.55, ease: "sine.inOut", repeat: bobCycles, yoyo: true }, scene.start);
        });
      });

      // ---------- S1: 목판 불탔다? → 현존 ----------
      tl.fromTo("#s1 .prop[data-adj='s1-cloud-a'], #s1 .prop[data-adj='s1-cloud-b']", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.1 }, 0.2);

      tl.fromTo("#s1 .prop[data-adj='s1-flames']", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.7);
      tl.to("#s1 .prop[data-adj='s1-flames'] [data-obj='s1-flames-inner'], #s1 .prop[data-adj='s1-flames'] [data-obj='s1-flames-outer']", { scaleY: 1.14, transformOrigin: "50% 100%", duration: 0.4, ease: "sine.inOut", repeat: 8, yoyo: true }, 1.0);
      tl.fromTo("#s1 .prop[data-adj='s1-smoke']", { y: 40, opacity: 0 }, { y: -10, opacity: 1, duration: 0.8, ease: "power1.out" }, 1.0);
      tl.fromTo("#s1 .char-s1-host", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, 0.5);
      tl.set("#s1 .s1-stamp", { visibility: "visible" }, 1.1);
      tl.fromTo("#s1 .s1-stamp", { scale: 0, opacity: 0, rotation: -4, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: -4, duration: 0.34, ease: "back.out(2.2)" }, 1.1);
      // 5.49s "박물관에" — 불꽃이 꺼지고 현존 스탬프가 슬램된다
      tl.to("#s1 .prop[data-adj='s1-flames'], #s1 .prop[data-adj='s1-smoke']", { opacity: 0, y: 30, duration: 0.5, ease: "power2.in" }, 5.2);

      // ---------- S2: 김정호 소개 ----------
      tl.fromTo("#s2 .stage", { x: 1080 }, { x: 0, duration: T, ease: "power3.out" }, 7.5);

      // ---------- layout overrides ----------
      var LAYOUT = (typeof window !== "undefined" && window.LAYOUT_OVERRIDES) || {};
      var ADDED = (typeof window !== "undefined" && window.ADDED_PROPS) || {};
      function injectAdded(key, rec) {
        if (document.querySelector('[data-adj="' + key + '"]')) return;
        var scene = document.getElementById(rec.scene); if (!scene) return;
        var stage = scene.querySelector(".stage") || scene;
        var box = document.createElement("div");
        box.className = "added-prop";
        box.setAttribute("data-adj", key);
        box.style.cssText = "position:absolute; left:" + rec.x + "px; top:" + rec.y + "px; width:" + rec.w + "px; height:" + rec.h + "px;";
        box.innerHTML = rec.html;
        stage.appendChild(box);
      }
      Object.keys(ADDED).forEach(function (k) { injectAdded(k, ADDED[k]); });
      function adjEl(key) { if (charEls[key]) return charEls[key]; return document.querySelector('[data-adj="' + key + '"]'); }
      function ensureAdjWrap(key) {
        var el = adjEl(key); if (!el) return null;
        var p = el.parentElement;
        if (p && p.classList.contains("adj-wrap")) return p;
        var wrap = document.createElement("div");
        wrap.className = "adj-wrap"; wrap.style.cssText = "position:absolute; inset:0;";
        p.insertBefore(wrap, el); wrap.appendChild(el); return wrap;
      }
      function applyAdjust(key, o) {
        var el = adjEl(key); if (!el) return;
        var wrap = ensureAdjWrap(key);
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s);
        if (o.ox != null && o.oy != null) wrap.style.transformOrigin = o.ox + "px " + o.oy + "px";
        wrap.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
        var sc = el.closest(".scene");
        if (sc && (s !== 1 || dx || dy)) sc.style.overflow = "visible";
      }
      Object.keys(LAYOUT).forEach(function (k) { applyAdjust(k, LAYOUT[k]); });

      var OBJ = (typeof window !== "undefined" && window.OBJECT_OVERRIDES) || {};
      function objEl(key) { return document.querySelector('[data-obj="' + key + '"]'); }
      function objCenter(key) {
        var g = objEl(key); if (!g) return null;
        try { var b = g.getBBox(); return { cx: b.x + b.width / 2, cy: b.y + b.height / 2 }; } catch (e) { return null; }
      }
      function applyObject(key, o) {
        var g = objEl(key); if (!g) return;
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s);
        var t = "translate(" + dx + " " + dy + ")";
        if (s !== 1) {
          var c = (o.cx != null) ? o : objCenter(key);
          if (c) t += " translate(" + c.cx + " " + c.cy + ") scale(" + s + ") translate(" + (-c.cx) + " " + (-c.cy) + ")";
          else t += " scale(" + s + ")";
        }
        g.setAttribute("transform", t);
      }
      Object.keys(OBJ).forEach(function (k) { applyObject(k, OBJ[k]); });

      window.__layout = {
        list: function () {
          var out = [];
          document.querySelectorAll("[data-adj]").forEach(function (el) {
            if (el.classList.contains("adj-wrap")) return;
            var scene = el.closest(".scene");
            out.push({ key: el.getAttribute("data-adj"), scene: scene ? scene.id : "" });
          });
          return out;
        },
        get: function () { return LAYOUT; },
        set: function (key, o) { LAYOUT[key] = o; applyAdjust(key, o); },
        rectOf: function (key) {
          var el = adjEl(key); if (!el) return null;
          var stage = el.closest(".stage"); if (!stage) return null;
          var er = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        measureOrigin: function (key) { var r = this.rectOf(key); if (!r) return null; return { ox: r.x + r.w / 2, oy: r.y + r.h / 2 }; },
        objectsOf: function (elKey) {
          var el = adjEl(elKey); if (!el) return [];
          return Array.prototype.map.call(el.querySelectorAll("[data-obj]"), function (g) { return g.getAttribute("data-obj"); });
        },
        getObjects: function () { return OBJ; },
        setObject: function (key, o) { OBJ[key] = o; applyObject(key, o); },
        objRectOf: function (key) {
          var g = objEl(key); if (!g) return null;
          var stage = g.closest(".stage"); if (!stage) return null;
          var er = g.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        objCenter: objCenter,
        objScreenToSvg: function (key, dxs, dys, outerScale) {
          var g = objEl(key); if (!g || !g.parentNode.getScreenCTM) return { dx: dxs, dy: dys };
          var m = g.parentNode.getScreenCTM(); if (!m) return { dx: dxs, dy: dys };
          var inv = m.inverse(), ix = dxs / outerScale, iy = dys / outerScale;
          return { dx: inv.a * ix + inv.c * iy, dy: inv.b * ix + inv.d * iy };
        },
        getAdded: function () { return ADDED; },
        addProp: function (sceneId, key, rec) { rec.scene = sceneId; ADDED[key] = rec; injectAdded(key, rec); },
        removeAdded: function (key) {
          if (!ADDED[key]) return;
          delete ADDED[key]; delete LAYOUT[key];
          var el = document.querySelector('[data-adj="' + key + '"]');
          if (el) { var w = el.parentElement; (w && w.classList.contains("adj-wrap") ? w : el).remove(); }
        }
      };
    </script>
