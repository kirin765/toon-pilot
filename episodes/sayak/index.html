<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #241a12; }
      @font-face { font-family: "Black Han Sans"; src: url("fonts/BlackHanSans.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Jua"; src: url("fonts/Jua.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Apple SD Gothic Neo"; src: local("Apple SD Gothic Neo"); }
      @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
      @font-face { font-family: "Songti SC"; src: local("Songti SC"); }
      body { font-family: "Jua", "Apple SD Gothic Neo", sans-serif; color: #26221c; }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      #s1 { z-index: 10; } #s2 { z-index: 20; } #s3 { z-index: 30; } #s4 { z-index: 40; }
      #s5 { z-index: 50; } #s6 { z-index: 60; } #s7 { z-index: 70; } #s8 { z-index: 80; }
      #s9 { z-index: 90; } #s10 { z-index: 100; } #s11 { z-index: 110; }
      .stage { position: absolute; inset: 0; }
      .char { position: absolute; }
      .char .bob { width: 100%; height: 100%; }
      .char.flip .bob { transform: scaleX(-1); }
      .prop { position: absolute; }

      .stamp {
        position: absolute; font-family: "Black Han Sans"; text-align: center;
        border: 9px solid; border-radius: 20px; padding: 14px 40px; line-height: 1.1;
        background: rgba(246, 239, 227, 0.94); visibility: hidden;
      }
      .stamp small { display: block; font-size: 30px; color: #1f2d45; font-family: "Jua", sans-serif; white-space: normal; max-width: 760px; }

      .chip {
        position: absolute; font-family: "Black Han Sans"; font-size: 46px; color: #f6efe3;
        background: #1f2d45; padding: 10px 30px; border-radius: 999px; visibility: hidden;
        box-shadow: 6px 6px 0 rgba(38, 34, 28, 0.25); white-space: nowrap;
      }
      .chip em { font-style: normal; color: #e8b74a; }

      .card {
        position: absolute; font-family: "Black Han Sans"; text-align: center;
        border-radius: 24px; padding: 26px 20px 18px; visibility: hidden;
        box-shadow: 8px 8px 0 rgba(20, 14, 8, 0.35);
      }
      .card .hanja { display: block; font-size: 120px; line-height: 1; }
      .card .sub { display: block; font-size: 32px; font-family: "Jua", sans-serif; margin-top: 10px; }
      .card.no  { background: #4a2b28; color: #f2b8a8; border: 6px solid #d94f37; }
      .card.yes { background: #2e6a6a; color: #f6efe3; border: 6px solid #e8b74a; }

      /* 한자 — 실제 글자만 사용, 손으로 그린 획 금지 */
      .hanja { font-family: "Apple SD Gothic Neo", "PingFang SC", "Songti SC", serif; font-weight: 600; }

      /* scene backdrops */
      #s1 .stage  { background: #2a2018; }   /* 처소 밤 — 훅(사극 통념) */
      #s2 .stage  { background: #2a2018; }   /* 처소 — 반전 시작 */
      #s3 .stage  { background: #7fa8c0; }   /* 궁중 낮 — 사=하사 뜻 */
      #s4 .stage  { background: #7fa8c0; }   /* 궁중 — 명예형+예기 */
      #s5 .stage  { background: #7fa8c0; }   /* 궁중 — 시신보존+대상 */
      #s6 .stage  { background: #241a12; }   /* 처소 — 집행 절차(앵커) */
      #s7 .stage  { background: #241a12; }   /* 처소 — 재료 불명 */
      #s8 .stage  { background: #241a12; }   /* 처소 — 반전 트위스트 */
      #s9 .stage  { background: #1c130d; }   /* 처소 — 아궁이+교살 */
      #s10 .stage { background: #3a2c22; }   /* 처소 저녁 — 펀치라인 */
      #s11 .stage { background: #f6efe3; }   /* 아웃트로 */

      .s1-chip     { top: 200px; left: 60px; }
      .s1-stamp    { top: 980px; left: 770px; width: 260px; color: #d94f37; border-color: #d94f37; font-size: 72px; padding: 14px 10px; transform: rotate(-6deg); }
      .s2-chip     { top: 200px; left: 60px; }
      .s2-mark     { top: 560px; left: 700px; width: 220px; height: 220px; }
      .s3-chip     { top: 200px; left: 60px; }
      .s3-card-no  { top: 560px; left: 90px; width: 380px; }
      .s3-card-yes { top: 560px; left: 610px; width: 380px; }
      .s4-chip     { top: 200px; left: 60px; }
      .s4-stamp    { top: 900px; left: 55px; width: 970px; color: #1f2d45; border-color: #7b4a86; font-size: 56px; transform: rotate(-1deg); }
      .s5-chip-top { top: 200px; left: 60px; }
      .s5-chip-bot { top: 1040px; left: 60px; }
      .s6-chip     { top: 200px; left: 60px; }
      .s7-chip     { top: 200px; left: 60px; }
      .s7-stamp    { top: 1100px; left: 55px; width: 970px; color: #f6efe3; border-color: #8a5a33; background: rgba(42,32,24,0.94); font-size: 52px; transform: rotate(-1deg); }
      .s7-stamp small { color: #e8b74a; }
      .s8-chip     { top: 200px; left: 60px; }
      .s9-chip-1   { top: 200px; left: 60px; }
      .s9-chip-2   { top: 200px; left: 60px; }
      .s10-stamp   { top: 760px; left: 55px; width: 970px; color: #f6efe3; border-color: #e8b74a; background: rgba(36,26,18,0.92); font-size: 52px; transform: rotate(-1deg); }
      .s10-stamp small { color: #e8b74a; }

      /* outro */
      .logo-big {
        position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-family: "Black Han Sans"; font-size: 190px; color: #1f2d45; line-height: 1.02; letter-spacing: -0.03em;
      }
      .logo-big em { font-style: normal; color: #d94f37; }
      .s11-sub { position: absolute; top: 760px; left: 0; right: 0; text-align: center; font-size: 52px; color: #26221c; }
      .subscribe {
        position: absolute; top: 900px; right: 80px; width: max-content;
        background: #d94f37; color: #f6efe3; font-family: "Black Han Sans"; font-size: 84px;
        padding: 26px 90px; border-radius: 999px; box-shadow: 10px 10px 0 #1f2d45;
      }

      /* overlay */
      #overlay { z-index: 120; }
      .brand-badge {
        position: absolute; top: 60px; left: 60px;
        background: #1f2d45; color: #f6efe3; font-family: "Black Han Sans";
        font-size: 44px; padding: 14px 34px; border-radius: 14px; box-shadow: 6px 6px 0 rgba(38,34,28,0.25);
      }
      .brand-badge em { font-style: normal; color: #e8b74a; }
      .cap-wrap { position: absolute; left: 0; right: 0; bottom: 380px; text-align: center; }
      .cap-group { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0; visibility: hidden; }
      .cap-group .pill {
        display: inline-block; background: rgba(31, 45, 69, 0.9);
        padding: 22px 52px; border-radius: 26px; font-size: 74px; color: #f6efe3; line-height: 1.22; max-width: 900px;
        word-break: keep-all;
      }
      .cap-group .hi { color: #e8b74a; font-family: "Black Han Sans"; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="80.3" data-width="1080" data-height="1920">

      <!-- ============ Scene 1 · 훅 — 사극 통념: "피 토하며 죽습니다" ============ -->
      <div id="s1" class="clip scene" data-start="0" data-duration="4.91" data-track-index="0">
        <div class="stage" data-room-bg="s1">
          <div class="chip s1-chip">사극에서는…</div>

          <div class="chip s3-chip">사약(<em>賜藥</em>)</div>

      </div>

      <!-- ============ Scene 4 · 명예형 + 예기 원칙 ============ -->
      <div id="s4" class="clip scene" data-start="15.76" data-duration="12.33" data-track-index="1">
        <div class="stage" data-court-bg="s4">

          <svg class="prop" data-adj="s4-desk" style="left:280px; bottom:560px; width:520px; height:420px;" viewBox="0 0 520 420">

          <div class="stamp s4-stamp">"선비는 죽일 수 있어도,<small>욕되게 할 수는 없다" — 『예기』</small></div>

        var el = adjEl(key); if (!el) return;
        var wrap = ensureAdjWrap(key);
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s);
        if (o.ox != null && o.oy != null) wrap.style.transformOrigin = o.ox + "px " + o.oy + "px";
        wrap.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + (o.r || 0) + "deg) scale(" + s + ")";
        var sc = el.closest(".scene");
        if (sc && (s !== 1 || dx || dy)) sc.style.overflow = "visible";
      }
      Object.keys(LAYOUT).forEach(function (k) { applyAdjust(k, LAYOUT[k]); });

      var OBJ = (typeof window !== "undefined" && window.OBJECT_OVERRIDES) || {};
      function objEl(key) { return document.querySelector('[data-obj="' + key + '"]'); }
      function objCenter(key) {
        var g = objEl(key); if (!g) return null;
        try { var b = g.getBBox(); return { cx: b.x + b.width / 2, cy: b.y + b.height / 2 }; } catch (e) { return null; }
      }
      function applyObject(key, o) {
        var g = objEl(key); if (!g) return;
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s), r = o.r || 0;
        var c = (o.cx != null) ? { cx: o.cx, cy: o.cy } : objCenter(key);
        var t = "translate(" + dx + " " + dy + ")";
        if (r) t += c ? (" rotate(" + r + " " + c.cx + " " + c.cy + ")") : (" rotate(" + r + ")");
        if (s !== 1) {
          if (c) t += " translate(" + c.cx + " " + c.cy + ") scale(" + s + ") translate(" + (-c.cx) + " " + (-c.cy) + ")";
          else t += " scale(" + s + ")";
        }
        g.setAttribute("transform", t);
      }
      Object.keys(OBJ).forEach(function (k) { applyObject(k, OBJ[k]); });

      window.__layout = {
        list: function () {
          var out = [];
          document.querySelectorAll("[data-adj]").forEach(function (el) {
            if (el.classList.contains("adj-wrap")) return;
            var scene = el.closest(".scene");
            out.push({ key: el.getAttribute("data-adj"), scene: scene ? scene.id : "" });
          });
          return out;
        },
        get: function () { return LAYOUT; },
        set: function (key, o) { LAYOUT[key] = o; applyAdjust(key, o); },
        rectOf: function (key) {
          var el = adjEl(key); if (!el) return null;
          var stage = el.closest(".stage"); if (!stage) return null;
          var er = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        measureOrigin: function (key) { var r = this.rectOf(key); if (!r) return null; return { ox: r.x + r.w / 2, oy: r.y + r.h / 2 }; },
        objectsOf: function (elKey) {
          var el = adjEl(elKey); if (!el) return [];
          return Array.prototype.map.call(el.querySelectorAll("[data-obj]"), function (g) { return g.getAttribute("data-obj"); });
        },
        getObjects: function () { return OBJ; },
        setObject: function (key, o) { OBJ[key] = o; applyObject(key, o); },
        objRectOf: function (key) {
          var g = objEl(key); if (!g) return null;
          var stage = g.closest(".stage"); if (!stage) return null;
          var er = g.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        objCenter: objCenter,
        objScreenToSvg: function (key, dxs, dys, outerScale) {
          var g = objEl(key); if (!g || !g.parentNode.getScreenCTM) return { dx: dxs, dy: dys };
          var m = g.parentNode.getScreenCTM(); if (!m) return { dx: dxs, dy: dys };
          var inv = m.inverse(), ix = dxs / outerScale, iy = dys / outerScale;
          return { dx: inv.a * ix + inv.c * iy, dy: inv.b * ix + inv.d * iy };
        },
        getAdded: function () { return ADDED; },
        addProp: function (sceneId, key, rec) { rec.scene = sceneId; ADDED[key] = rec; injectAdded(key, rec); },
        removeAdded: function (key) {
          if (!ADDED[key]) return;
          delete ADDED[key]; delete LAYOUT[key];
          var el = document.querySelector('[data-adj="' + key + '"]');
          if (el) { var w = el.parentElement; (w && w.classList.contains("adj-wrap") ? w : el).remove(); }
        }
      };
    </script>
  </body>
</html>
