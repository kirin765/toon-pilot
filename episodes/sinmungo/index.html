<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1f2d45; }
      @font-face { font-family: "Black Han Sans"; src: url("fonts/BlackHanSans.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Jua"; src: url("fonts/Jua.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Apple SD Gothic Neo"; src: local("Apple SD Gothic Neo"); }
      body { font-family: "Jua", "Apple SD Gothic Neo", sans-serif; color: #26221c; }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      #s1 { z-index: 10; } #s2 { z-index: 20; } #s3 { z-index: 30; } #s4 { z-index: 40; }
      #s5 { z-index: 50; } #s6 { z-index: 60; }
      .stage { position: absolute; inset: 0; }
      .char { position: absolute; }
      .char .bob { width: 100%; height: 100%; }
      .char.flip .bob { transform: scaleX(-1); }
      .prop { position: absolute; }

      .stamp {
        position: absolute; font-family: "Black Han Sans"; text-align: center;
        border: 9px solid; border-radius: 20px; padding: 14px 40px; line-height: 1.1;
        background: rgba(246, 239, 227, 0.94); visibility: hidden;
      }
      .stamp small { display: block; font-size: 30px; color: #1f2d45; font-family: "Jua", sans-serif; white-space: normal; max-width: 560px; }

      .step {
        position: absolute; font-family: "Black Han Sans"; text-align: center;
        border: 7px solid #1f2d45; border-radius: 16px; padding: 8px 26px; line-height: 1.05;
        background: rgba(246, 239, 227, 0.96); color: #1f2d45; font-size: 46px; white-space: nowrap; visibility: hidden;
      }
      .step small { display: block; font-size: 24px; color: #6b5d48; font-family: "Jua", sans-serif; white-space: normal; }
      .step.goal { border-color: #d94f37; color: #d94f37; }
      .step-arrow { position: absolute; font-family: "Black Han Sans"; font-size: 46px; color: #f6efe3; visibility: hidden; text-shadow: 0 3px 0 rgba(15,20,30,0.4); }

      .num-pop {
        position: absolute; font-family: "Black Han Sans"; color: #f6efe3;
        line-height: 0.9; visibility: hidden; text-shadow: 0 8px 0 rgba(15, 20, 30, 0.28);
      }
      .num-pop em { font-style: normal; color: #e8b74a; }
      .num-pop small { display: block; font-size: 38px; font-family: "Jua", sans-serif; color: #f6efe3; line-height: 1.5; }

      /* scene backdrops */
      #s1 .stage { background: #1e2438; }   /* 밤 대궐 문 — 신문고 훅 */
      #s2 .stage { background: #8fb3c9; }   /* 낮 관아 마당 */
      #s3 .stage { background: #9dbdd1; }   /* 낮 대궐 앞 */
      #s4 .stage { background: #47384c; }   /* 어전 — 역설 */
      #s5 .stage { background: #9c8f9e; }   /* 어스름 행차 길 */
      #s6 .stage { background: #f6efe3; }

      /* s1 — 申聞鼓 / 정말 아무나? */
      .s1-stamp  { top: 210px; left: 55px; color: #1f2d45; border-color: #e8b74a; font-size: 60px; white-space: nowrap; transform: rotate(-3deg); }
      .s1-stamp2 { top: 430px; right: 60px; color: #d94f37; border-color: #d94f37; font-size: 52px; white-space: nowrap; transform: rotate(3deg); }
      /* s2 — 3단계 관문 (외방 루트) */
      .s2-lead { top: 150px; left: 55px; color: #1f2d45; border-color: #1f2d45; font-size: 40px; white-space: nowrap; transform: rotate(-2deg); }
      .s2-step1 { top: 250px; left: 70px; }
      .s2-arrow1 { top: 336px; left: 130px; }
      .s2-step2 { top: 384px; left: 70px; }
      .s2-arrow2 { top: 470px; left: 130px; }
      .s2-step3 { top: 518px; left: 70px; }
      .s2-arrow3 { top: 604px; left: 130px; }
      .s2-step4 { top: 652px; left: 70px; }
      /* s3 — 奴婢·刑獄·財産 */
      .s3-stamp { top: 175px; left: 55px; color: #1f2d45; border-color: #8a5a33; font-size: 52px; white-space: nowrap; transform: rotate(-3deg); }
      /* s4 — 非其越訴, 乃許擊鼓 */
      .s4-stamp { top: 185px; left: 50px; color: #1f2d45; border-color: #d94f37; font-size: 48px; white-space: nowrap; transform: rotate(-3deg); }
      /* s5 — 擊錚 */
      .s5-stamp { top: 165px; left: 55px; color: #1f2d45; border-color: #3a7ca5; font-size: 56px; white-space: nowrap; transform: rotate(-2deg); }

      /* outro */
      .logo-big {
        position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-family: "Black Han Sans"; font-size: 190px; color: #1f2d45; line-height: 1.02; letter-spacing: -0.03em;
      }
      .logo-big em { font-style: normal; color: #d94f37; }
      .s6-sub { position: absolute; top: 760px; left: 0; right: 0; text-align: center; font-size: 52px; color: #26221c; }
      .subscribe {
        position: absolute; top: 900px; right: 80px; width: max-content;
        background: #d94f37; color: #f6efe3; font-family: "Black Han Sans"; font-size: 84px;
        padding: 26px 90px; border-radius: 999px; box-shadow: 10px 10px 0 #1f2d45;
      }

      /* overlay */
      #overlay { z-index: 100; }
      .brand-badge {
        position: absolute; top: 60px; left: 60px;
        background: #1f2d45; color: #f6efe3; font-family: "Black Han Sans";
        font-size: 44px; padding: 14px 34px; border-radius: 14px; box-shadow: 6px 6px 0 rgba(38,34,28,0.25);
      }
      .brand-badge em { font-style: normal; color: #e8b74a; }
      .cap-wrap { position: absolute; left: 0; right: 0; bottom: 380px; text-align: center; }
      .cap-group { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0; visibility: hidden; }
      .cap-group .pill {
        display: inline-block; background: rgba(31, 45, 69, 0.9);
        padding: 22px 52px; border-radius: 26px; font-size: 74px; color: #f6efe3; line-height: 1.22; max-width: 900px;
        word-break: keep-all;
      }
      .cap-group .hi { color: #e8b74a; font-family: "Black Han Sans"; }
    </style>
  </head>

      // ---------- mount characters from SCENES ----------
      function setExprDirect(root, name) {
        var e = EXPRESSIONS[name];
        EYE_CLASSES.forEach(function (c) { root.querySelector("." + c).setAttribute("visibility", c === e.eye ? "visible" : "hidden"); });
        MOUTH_CLASSES.forEach(function (c) { root.querySelector("." + c).setAttribute("visibility", c === e.mouth ? "visible" : "hidden"); });

      }
      function setPoseDirect(root, name) {
        var p = POSES[name];
        gsap.set(root.querySelector(".arm-l"), { rotation: p.l, svgOrigin: "60 152" });

          div.style.bottom = c.bottom + "px";
          div.style.width = c.w + "px";
          div.style.height = c.w * 1.2 + "px";

          bob.className = "bob";
          bob.innerHTML = makeCharacter(c);
          div.appendChild(bob);
          stage.appendChild(div);
          setExprDirect(div, c.expr);
          setPoseDirect(div, c.pose);
          charEls[c.id] = div;

      });

        MOUTH_CLASSES.forEach(function (c) { if (c === "m-open") return; tl.set(sel + " ." + c, { attr: { visibility: c === e.mouth ? "visible" : "hidden" } }, at); });

        tl.to(sel + " .brow-r", { y: e.browY, rotation: e.browRotR, svgOrigin: "118 64", duration: 0.18, ease: "power2.out" }, at);
      }
      function tlPose(sel, name, at) {
        var p = POSES[name];
        tl.to(sel + " .arm-l", { rotation: p.l, svgOrigin: "60 152", duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(sel + " .arm-r", { rotation: p.r, svgOrigin: "140 152", duration: 0.3, ease: "back.out(2)" }, at);
      }
      SCENES.forEach(function (scene) {
        (scene.changes || []).forEach(function (ch) {
          var sel = ".char-" + ch.char;

      // ---------- lip flaps ----------
      SCENES.forEach(function (scene) {
        if (!scene.talker) return;
        var talkerCfg = scene.chars.filter(function (c) { return c.id === scene.talker; })[0];
        if (!talkerCfg) return;
        var sel = ".char-" + scene.talker;
        var visFrom = scene.start, visTo = scene.start + scene.dur;
        var idle = EXPRESSIONS[talkerCfg.expr].mouth;
        var changePoints = (scene.changes || []).filter(function (ch) { return ch.expr && ch.char === scene.talker; });
        function idleAt(t) { var m = idle; changePoints.forEach(function (ch) { if (ch.at <= t) m = EXPRESSIONS[ch.expr].mouth; }); return m; }
        WORDS.forEach(function (w) {
          if (w.start < visFrom || w.start > visTo) return;
          var open = false;
          for (var t = w.start; t < Math.min(w.end, visTo) - 0.04; t += 0.1) {
            open = !open;
            tl.set(sel + " .m-open", { attr: { visibility: open ? "visible" : "hidden" } }, t);
            tl.set(sel + " ." + idleAt(t), { attr: { visibility: open ? "hidden" : "visible" } }, t);

      // ---------- blinks + idle bob ----------
      SCENES.forEach(function (scene) {

            var t0 = scene.start + 1.1 + ci * 0.7;
            for (var t = t0; t < scene.start + scene.dur - 0.4; t += 2.6) {
              tl.set(sel + " .eye-open", { attr: { visibility: "hidden" } }, t);
              tl.set(sel + " .eye-closed", { attr: { visibility: "visible" } }, t);
              tl.set(sel + " .eye-open", { attr: { visibility: "visible" } }, t + 0.13);
              tl.set(sel + " .eye-closed", { attr: { visibility: "hidden" } }, t + 0.13);
            }
          }
          var bobCycles = Math.ceil(scene.dur / 0.55) - 1;
          tl.to(sel + " .bob", { y: -5, duration: 0.55, ease: "sine.inOut", repeat: bobCycles, yoyo: true }, scene.start);

      // ---------- S1: 대궐 문 + 신문고 ----------
      tl.fromTo("#s1 .prop[data-adj='s1-stars'], #s1 .prop[data-adj='s1-moon'], #s1 .prop[data-adj='s1-wall'], #s1 .prop[data-adj='s1-glow']", { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.08 }, 0.15);

      // 2.9 "신문고" — 이름 스탬프

      tl.fromTo("#s2 .prop[data-adj='s2-office']", { y: 150, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.2)" }, 7.38);

      tl.set("#s2 .s2-lead", { visibility: "visible" }, 7.5);
      tl.fromTo("#s2 .s2-lead", { scale: 0, opacity: 0, rotation: -2, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: -2, duration: 0.32, ease: "back.out(2.2)" }, 7.5);
      [["s2-step1", "s2-arrow1", 7.8], ["s2-step2", "s2-arrow2", 8.6], ["s2-step3", "s2-arrow3", 9.7]].forEach(function (t) {
        tl.set("#s2 ." + t[0], { visibility: "visible" }, t[2]);

      // ---------- S3: 실상 (양반 + 신문고 + 문서) ----------

      // 18.8 "노비·재산" — 스탬프
      tl.set("#s3 .s3-stamp", { visibility: "visible" }, 18.8);
      tl.fromTo("#s3 .s3-stamp", { scale: 0, opacity: 0, rotation: -3, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: -3, duration: 0.38, ease: "back.out(2.2)" }, 18.8);

      // ---------- S4: 역설 (태종 + 교서 + 신문고) ----------
      tl.fromTo("#s4 .stage", { x: 1080 }, { x: 0, duration: T, ease: "power3.out" }, 21.26);

      tl.fromTo("#s4 .prop[data-adj='s4-edict']", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 21.75);
      // 26.2 "북 하나로 좁혀" — 스탬프 + king proud
      tl.set("#s4 .s4-stamp", { visibility: "visible" }, 26.2);
      tl.fromTo("#s4 .s4-stamp", { scale: 0, opacity: 0, rotation: -3, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: -3, duration: 0.38, ease: "back.out(2.2)" }, 26.2);

      // ---------- S5: 격쟁 (가마 + 백성 + 징) ----------
      tl.fromTo("#s5 .stage", { x: -1080 }, { x: 0, duration: T, ease: "power3.out" }, 28.00);
      tl.fromTo("#s5 .prop[data-adj='s5-cloud'], #s5 .prop[data-adj='s5-hills'], #s5 .prop[data-adj='s5-road']", { opacity: 0 }, { opacity: 1, duration: 0.45, stagger: 0.07 }, 28.20);
      tl.fromTo("#s5 .prop[data-adj='s5-gama']", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 28.3);
      tl.fromTo("#s5 .char-s5-min", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 28.4);
      tl.fromTo("#s5 .prop[data-adj='s5-gong'], #s5 .prop[data-adj='s5-mallet']", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 28.6);
      // 34.6 "징을 울렸다" — 징 타격(채 스윙) + 스탬프 + 진동
      tl.to("#s5 .prop[data-adj='s5-mallet']", { rotation: 8, x: -18, transformOrigin: "0% 50%", duration: 0.16, ease: "power3.in" }, 34.5);
      tl.to("#s5 .prop[data-adj='s5-mallet']", { rotation: 24, x: 0, duration: 0.3, ease: "power2.out" }, 34.66);
      tl.fromTo("#s5 .prop[data-adj='s5-gong']", { x: 0 }, { x: 6, duration: 0.05, repeat: 5, yoyo: true }, 34.66);
      tl.set("#s5 .prop[data-adj='s5-gong']", { x: 0 }, 34.96);
      tl.set("#s5 .s5-stamp", { visibility: "visible" }, 34.66);
      tl.fromTo("#s5 .s5-stamp", { scale: 0, opacity: 0, rotation: -2, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: -2, duration: 0.38, ease: "back.out(2.4)" }, 34.66);

      // ---------- S6: outro ----------
      tl.fromTo("#s6 .stage", { x: 1080 }, { x: 0, duration: T, ease: "power3.out" }, 35.96);
      tl.fromTo("#s6 .logo-big", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, 36.4);
      tl.fromTo("#s6 .s6-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 37.0);
      tl.fromTo("#s6 .char-s6-host", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 36.7);
      tl.fromTo("#s6 .subscribe", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 39.2);
      tl.to("#s6 .subscribe", { scale: 1.08, duration: 0.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 39.8);

      // ---------- overlay cleanup — 씬 전환 완료 후 스탬프 숨김 ----------
      [["#s1 .s1-stamp, #s1 .s1-stamp2", 7.56],
       ["#s2 .s2-lead, #s2 .s2-step1, #s2 .s2-step2, #s2 .s2-step3, #s2 .s2-step4, #s2 .s2-arrow1, #s2 .s2-arrow2, #s2 .s2-arrow3", 14.83],
       ["#s3 .s3-stamp", 21.71],
       ["#s4 .s4-stamp", 28.45],
       ["#s5 .s5-stamp", 36.41]].forEach(function (pair) {
        tl.set(pair[0], { visibility: "hidden" }, pair[1]);
      });

      // ---------- captions ----------
      var capWrap = document.querySelector(".cap-wrap");
      CAPTION_GROUPS.forEach(function (g, gi) {
        var el = document.createElement("div");
        el.className = "cap-group";
        el.id = "cg-" + gi;
        var pill = document.createElement("div");
        pill.className = "pill";
        g.text.split(" ").forEach(function (word, wi) {
          var span = document.createElement("span");
          span.textContent = (wi > 0 ? " " : "") + word;
          if (g.hi.indexOf(word) !== -1) span.className = "hi";
          pill.appendChild(span);
        });
        el.appendChild(pill);
        capWrap.appendChild(el);
        tl.fromTo(el, { opacity: 0, scale: 0.88, visibility: "visible", transformOrigin: "50% 100%" },
          { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(1.6)" }, g.start);
        tl.to(el, { opacity: 0, scale: 0.95, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
        tl.set(el, { opacity: 0, visibility: "hidden" }, g.end);
      });

      tl.fromTo(".brand-badge", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.4);

      window.__timelines["main"] = tl;

      // ---------- layout overrides ----------
      var LAYOUT = (typeof window !== "undefined" && window.LAYOUT_OVERRIDES) || {};
      var ADDED = (typeof window !== "undefined" && window.ADDED_PROPS) || {};
      function injectAdded(key, rec) {
        if (document.querySelector('[data-adj="' + key + '"]')) return;
        var scene = document.getElementById(rec.scene); if (!scene) return;
        var stage = scene.querySelector(".stage") || scene;
        var box = document.createElement("div");
        box.className = "added-prop";
        box.setAttribute("data-adj", key);
        box.style.cssText = "position:absolute; left:" + rec.x + "px; top:" + rec.y + "px; width:" + rec.w + "px; height:" + rec.h + "px;";
        box.innerHTML = rec.html;
        stage.appendChild(box);
      }
      Object.keys(ADDED).forEach(function (k) { injectAdded(k, ADDED[k]); });
      function adjEl(key) { if (charEls[key]) return charEls[key]; return document.querySelector('[data-adj="' + key + '"]'); }
      function ensureAdjWrap(key) {
        var el = adjEl(key); if (!el) return null;
        var p = el.parentElement;
        if (p && p.classList.contains("adj-wrap")) return p;
        var wrap = document.createElement("div");
        wrap.className = "adj-wrap"; wrap.style.cssText = "position:absolute; inset:0;";
        p.insertBefore(wrap, el); wrap.appendChild(el); return wrap;
      }
      function applyAdjust(key, o) {
        var el = adjEl(key); if (!el) return;
        var wrap = ensureAdjWrap(key);
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s);
        if (o.ox != null && o.oy != null) wrap.style.transformOrigin = o.ox + "px " + o.oy + "px";
        wrap.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
        var sc = el.closest(".scene");
        if (sc && (s !== 1 || dx || dy)) sc.style.overflow = "visible";
      }
      Object.keys(LAYOUT).forEach(function (k) { applyAdjust(k, LAYOUT[k]); });

      var OBJ = (typeof window !== "undefined" && window.OBJECT_OVERRIDES) || {};
      function objEl(key) { return document.querySelector('[data-obj="' + key + '"]'); }
      function objCenter(key) {
        var g = objEl(key); if (!g) return null;
        try { var b = g.getBBox(); return { cx: b.x + b.width / 2, cy: b.y + b.height / 2 }; } catch (e) { return null; }
      }
      function applyObject(key, o) {
        var g = objEl(key); if (!g) return;
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s);
        var t = "translate(" + dx + " " + dy + ")";
        if (s !== 1) {
          var c = (o.cx != null) ? o : objCenter(key);
          if (c) t += " translate(" + c.cx + " " + c.cy + ") scale(" + s + ") translate(" + (-c.cx) + " " + (-c.cy) + ")";
          else t += " scale(" + s + ")";
        }
        g.setAttribute("transform", t);
      }
      Object.keys(OBJ).forEach(function (k) { applyObject(k, OBJ[k]); });

      window.__layout = {
        list: function () {
          var out = [];
          document.querySelectorAll("[data-adj]").forEach(function (el) {
            if (el.classList.contains("adj-wrap")) return;
            var scene = el.closest(".scene");
            out.push({ key: el.getAttribute("data-adj"), scene: scene ? scene.id : "" });
          });
          return out;
        },
        get: function () { return LAYOUT; },
        set: function (key, o) { LAYOUT[key] = o; applyAdjust(key, o); },
        rectOf: function (key) {
          var el = adjEl(key); if (!el) return null;
          var stage = el.closest(".stage"); if (!stage) return null;
          var er = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        measureOrigin: function (key) { var r = this.rectOf(key); if (!r) return null; return { ox: r.x + r.w / 2, oy: r.y + r.h / 2 }; },
        objectsOf: function (elKey) {
          var el = adjEl(elKey); if (!el) return [];
          return Array.prototype.map.call(el.querySelectorAll("[data-obj]"), function (g) { return g.getAttribute("data-obj"); });
        },
        getObjects: function () { return OBJ; },
        setObject: function (key, o) { OBJ[key] = o; applyObject(key, o); },
        objRectOf: function (key) {
          var g = objEl(key); if (!g) return null;
          var stage = g.closest(".stage"); if (!stage) return null;
          var er = g.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        objCenter: objCenter,
        objScreenToSvg: function (key, dxs, dys, outerScale) {
          var g = objEl(key); if (!g || !g.parentNode.getScreenCTM) return { dx: dxs, dy: dys };
          var m = g.parentNode.getScreenCTM(); if (!m) return { dx: dxs, dy: dys };
          var inv = m.inverse(), ix = dxs / outerScale, iy = dys / outerScale;
          return { dx: inv.a * ix + inv.c * iy, dy: inv.b * ix + inv.d * iy };
        },
        getAdded: function () { return ADDED; },
        addProp: function (sceneId, key, rec) { rec.scene = sceneId; ADDED[key] = rec; injectAdded(key, rec); },
        removeAdded: function (key) {
          if (!ADDED[key]) return;
          delete ADDED[key]; delete LAYOUT[key];
          var el = document.querySelector('[data-adj="' + key + '"]');
          if (el) { var w = el.parentElement; (w && w.classList.contains("adj-wrap") ? w : el).remove(); }
        }
      };
    </script>
