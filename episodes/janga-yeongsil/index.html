      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1f2d45; }
      @font-face { font-family: "Black Han Sans"; src: url("fonts/BlackHanSans.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Jua"; src: url("fonts/Jua.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Apple SD Gothic Neo"; src: local("Apple SD Gothic Neo"); }
      body { font-family: "Jua", "Apple SD Gothic Neo", sans-serif; color: #26221c; }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      #s1 { z-index: 10; } #s2 { z-index: 20; } #s3 { z-index: 30; }
      #s4 { z-index: 40; } #s5 { z-index: 50; } #s6 { z-index: 60; } #s7 { z-index: 70; }
      .stage { position: absolute; inset: 0; }
      .char { position: absolute; }
      .char .bob { width: 100%; height: 100%; }
      .char.flip .bob { transform: scaleX(-1); }

      /* shared props */
      .ground { position: absolute; bottom: 0; left: 0; right: 0; height: 300px; background: #7db95c; }
      .hill { position: absolute; border-radius: 50%; background: #7db95c; }
      .cloud { position: absolute; border-radius: 60px; background: #f6efe3; }
      .star { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #f6efe3; opacity: 0.75; }
      .moon { position: absolute; border-radius: 50%; background: #f6efe3; }
      .label-pill { position: absolute; }
      .label-pill span { display: inline-block; background: #1f2d45; color: #f6efe3; font-size: 46px; padding: 14px 44px; border-radius: 999px; }
      .stamp {
        position: absolute; font-family: "Black Han Sans"; text-align: center;
        border: 9px solid; border-radius: 20px; padding: 14px 40px; line-height: 1.1;
        background: rgba(246, 239, 227, 0.94); visibility: hidden;
      }
      .stamp small { display: block; font-size: 46px; color: #1f2d45; }

      /* ---------- S1: hook (night) ---------- */
      #s1 .stage { background: #1f2d45; }
      .hook-title {
        position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-family: "Black Han Sans"; font-size: 150px; line-height: 1.08; color: #f6efe3; letter-spacing: -0.02em;
      }
      .hook-stamp {
        top: 720px; left: 0; right: 0; margin: 0 auto; width: 560px;
        color: #d94f37; border-color: #d94f37; font-size: 132px; transform: rotate(-7deg);
      }

      /* ---------- S2: 동래현 (day) ---------- */
      #s2 .stage { background: #8ec9e8; }
      .s2-label { top: 360px; left: 0; right: 0; text-align: center; }

      /* ---------- S3: palace (warm) ---------- */
      #s3 .stage { background: #d98f5a; }
      .s3-label { top: 360px; left: 0; right: 0; text-align: center; }

      /* ---------- S4: 자격루 hero (night interior) ---------- */
      #s4 .stage { background: #202a3c; }
      .clepsydra { position: absolute; left: 70px; bottom: 560px; width: 470px; }
      .drop { position: absolute; width: 14px; height: 20px; border-radius: 0 50% 50% 50%; background: #6fb7d8; transform: rotate(45deg); }
      .stamp-jagyeok { top: 470px; right: 70px; color: #e8b74a; border-color: #e8b74a; background: rgba(31,45,69,0.9); font-size: 96px; transform: rotate(5deg); }

      /* ---------- S5: peak (gold) ---------- */
      #s5 .stage { background: #e8b74a; }
      .ray { position: absolute; top: 0; left: 50%; width: 120px; height: 1100px; background: rgba(255,255,255,0.16); transform-origin: top center; }
      .stamp-rank { top: 470px; left: 0; right: 0; margin: 0 auto; width: 800px; color: #b0361f; border-color: #b0361f; font-size: 96px; transform: rotate(-3deg); }

      /* ---------- S6: downfall (dusk) ---------- */
      #s6 .stage { background: #2c3e5f; }
      .palanquin { position: absolute; right: 40px; bottom: 640px; width: 560px; }
      .stamp-flog { top: 460px; left: 60px; color: #d94f37; border-color: #d94f37; font-size: 100px; transform: rotate(-8deg); }
      .qmark { position: absolute; font-family: "Black Han Sans"; color: #f6efe3; opacity: 0; }

      /* ---------- S7: outro (cream) ---------- */
      #s7 .stage { background: #f6efe3; }
      .logo-big {
        position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-family: "Black Han Sans"; font-size: 190px; color: #1f2d45; line-height: 1.02; letter-spacing: -0.03em;
      }
      .logo-big em { font-style: normal; color: #d94f37; }
      .s7-sub { position: absolute; top: 760px; left: 0; right: 0; text-align: center; font-size: 52px; color: #26221c; }
      .subscribe {
        position: absolute; top: 900px; left: 0; right: 0; margin: 0 auto; width: max-content;
        background: #d94f37; color: #f6efe3; font-family: "Black Han Sans"; font-size: 84px;
        padding: 26px 90px; border-radius: 999px; box-shadow: 10px 10px 0 #1f2d45;
      }
      .confetti { position: absolute; top: -40px; width: 30px; height: 44px; }

      /* ---------- overlay: brand + captions ---------- */
      #overlay { z-index: 100; }
      .brand-badge {
        position: absolute; top: 60px; left: 60px;
        background: #1f2d45; color: #f6efe3; font-family: "Black Han Sans";

      .brand-badge em { font-style: normal; color: #e8b74a; }
      .cap-wrap { position: absolute; left: 0; right: 0; bottom: 420px; text-align: center; }
      .cap-group { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0; visibility: hidden; }
      .cap-group .pill {

      }
      .cap-group .hi { color: #e8b74a; font-family: "Black Han Sans"; }
    </style>

      window.__timelines = window.__timelines || {};

      // ---------- mount characters from SCENES ----------
      function setExprDirect(root, name) {
        var e = EXPRESSIONS[name];
        EYE_CLASSES.forEach(function (c) {
          root.querySelector("." + c).setAttribute("visibility", c === e.eye ? "visible" : "hidden");
        });
        MOUTH_CLASSES.forEach(function (c) {
          root.querySelector("." + c).setAttribute("visibility", c === e.mouth ? "visible" : "hidden");
        });
        var bl = root.querySelector(".brow-l"), br = root.querySelector(".brow-r");
        bl.style.transform = "translateY(" + e.browY + "px) rotate(" + e.browRotL + "deg)";
        br.style.transform = "translateY(" + e.browY + "px) rotate(" + e.browRotR + "deg)";
      }
      function setPoseDirect(root, name) {
        var p = POSES[name];
        gsap.set(root.querySelector(".arm-l"), { rotation: p.l, svgOrigin: "60 152" });
        gsap.set(root.querySelector(".arm-r"), { rotation: p.r, svgOrigin: "140 152" });
      }

      var charEls = {};
      SCENES.forEach(function (scene) {
        var stage = document.querySelector("#" + scene.id + " .stage");
        scene.chars.forEach(function (c) {
          var div = document.createElement("div");
          div.className = "char char-" + c.id + (c.flip ? " flip" : "");
          div.style.left = "calc(" + c.x + "% - " + c.w / 2 + "px)";
          div.style.bottom = c.bottom + "px";
          div.style.width = c.w + "px";
          div.style.height = c.w * 1.2 + "px";
          var bob = document.createElement("div");
          bob.className = "bob";
          bob.innerHTML = makeCharacter(c);
          div.appendChild(bob);
          stage.appendChild(div);
          setExprDirect(div, c.expr);
          setPoseDirect(div, c.pose);
          charEls[c.id] = div;
        });
      });

      // ---------- expression / pose changes ----------
      function tlExpr(sel, name, at) {
        var e = EXPRESSIONS[name];
        EYE_CLASSES.forEach(function (c) {
          tl.set(sel + " ." + c, { attr: { visibility: c === e.eye ? "visible" : "hidden" } }, at);
        });
        MOUTH_CLASSES.forEach(function (c) {
          if (c === "m-open") return;
          tl.set(sel + " ." + c, { attr: { visibility: c === e.mouth ? "visible" : "hidden" } }, at);
        });
        tl.to(sel + " .brow-l", { y: e.browY, rotation: e.browRotL, duration: 0.18, ease: "power2.out" }, at);
        tl.to(sel + " .brow-r", { y: e.browY, rotation: e.browRotR, duration: 0.18, ease: "power2.out" }, at);
      }
      function tlPose(sel, name, at) {
        var p = POSES[name];
        tl.to(sel + " .arm-l", { rotation: p.l, svgOrigin: "60 152", duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(sel + " .arm-r", { rotation: p.r, svgOrigin: "140 152", duration: 0.3, ease: "back.out(2)" }, at);
      }

      // ---------- lip flaps ----------
      SCENES.forEach(function (scene) {
        var talkerCfg = scene.chars.filter(function (c) { return c.id === scene.talker; })[0];
        if (!talkerCfg) return;
        var sel = ".char-" + scene.talker;
        var visFrom = scene.start, visTo = scene.start + scene.dur;
        var idle = EXPRESSIONS[talkerCfg.expr].mouth;
        var changePoints = (scene.changes || []).filter(function (ch) { return ch.expr && ch.char === scene.talker; });
        function idleAt(t) {
          var m = idle;
          changePoints.forEach(function (ch) { if (ch.at <= t) m = EXPRESSIONS[ch.expr].mouth; });
          return m;
        }
        WORDS.forEach(function (w) {
          if (w.start < visFrom || w.start > visTo) return;
          var open = false;
          for (var t = w.start; t < Math.min(w.end, visTo) - 0.04; t += 0.1) {
            open = !open;
            tl.set(sel + " .m-open", { attr: { visibility: open ? "visible" : "hidden" } }, t);
            tl.set(sel + " ." + idleAt(t), { attr: { visibility: open ? "hidden" : "visible" } }, t);
          }
          var tEnd = Math.min(w.end, visTo);
          tl.set(sel + " .m-open", { attr: { visibility: "hidden" } }, tEnd);
          tl.set(sel + " ." + idleAt(tEnd), { attr: { visibility: "visible" } }, tEnd);
        });
      });

      // ---------- blinks + idle bob ----------
      SCENES.forEach(function (scene) {
        scene.chars.forEach(function (c, ci) {
          var sel = ".char-" + c.id;
          if (EXPRESSIONS[c.expr].eye === "eye-open") {
            var t0 = scene.start + 1.1 + ci * 0.7;
            for (var t = t0; t < scene.start + scene.dur - 0.4; t += 2.6) {
              tl.set(sel + " .eye-open", { attr: { visibility: "hidden" } }, t);
              tl.set(sel + " .eye-closed", { attr: { visibility: "visible" } }, t);
              tl.set(sel + " .eye-open", { attr: { visibility: "visible" } }, t + 0.13);
              tl.set(sel + " .eye-closed", { attr: { visibility: "hidden" } }, t + 0.13);
            }
          }
          var bobCycles = Math.ceil(scene.dur / 0.55) - 1;
          tl.to(sel + " .bob", { y: -5, duration: 0.55, ease: "sine.inOut", repeat: bobCycles, yoyo: true }, scene.start);
        });
      });

      // ---------- S1: hook ----------
      tl.fromTo("#s1 .hook-title", { scale: 2.6, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power4.in" }, 0.15);
      tl.fromTo("#s1 .char-s1-host", { y: 300, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, 0.7);
      tl.fromTo("#s1 .moon", { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.7, ease: "elastic.out(1,0.6)" }, 0.4);
      tl.fromTo("#s1 .star", { opacity: 0 }, { opacity: 0.75, duration: 0.5, stagger: 0.1 }, 0.5);
      tl.set("#s1 .hook-stamp", { visibility: "visible" }, 2.1);
      tl.fromTo("#s1 .hook-stamp", { scale: 2.8, opacity: 0, rotation: -7 },
        { scale: 1, opacity: 1, rotation: -7, duration: 0.32, ease: "power4.in" }, 2.1);

      // ---------- S2: push-slide from right ----------
      tl.fromTo("#s2 .stage", { x: 1080 }, { x: 0, duration: T, ease: "power3.out" }, 4.55);
      tl.fromTo("#s2 .hanok-s2", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.0);
      tl.fromTo("#s2 .char-s2-ya", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 5.1);
      tl.fromTo("#s2 .cloud", { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "sine.out", stagger: 0.15 }, 4.9);
      tl.fromTo("#s2 .s2-label span", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.4);

      // ---------- S3: iris reveal ----------
      tl.fromTo("#s3 .stage", { clipPath: "circle(0% at 34% 60%)" },
        { clipPath: "circle(150% at 34% 60%)", duration: T + 0.15, ease: "power2.inOut" }, 10.34);
      tl.fromTo("#s3 .palace-s3", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 10.7);
      tl.fromTo("#s3 .char-s3-king", { y: 280, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 10.7);
      tl.fromTo("#s3 .char-s3-ya", { y: 280, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 10.9);
      tl.fromTo("#s3 .s3-label span", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 11.3);

      // ---------- S4: push up, 자격루 hero ----------
      tl.fromTo("#s4 .stage", { y: 1920 }, { y: 0, duration: T, ease: "power3.out" }, 14.76);
      tl.fromTo("#s4 .clepsydra", { scale: 0.4, opacity: 0, transformOrigin: "50% 100%" },
        { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, 15.15);
      tl.fromTo("#s4 .char-s4-ya", { y: 280, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 15.4);
      tl.fromTo("#s4 .moon", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "sine.out" }, 15.2);
      tl.fromTo("#s4 .star", { opacity: 0 }, { opacity: 0.75, duration: 0.5, stagger: 0.1 }, 15.5);
      tl.fromTo("#s4 .drop", { y: -30, opacity: 0 }, { y: 60, opacity: 1, duration: 1.0, ease: "power1.in", stagger: 0.5, repeat: 3 }, 16.2);
      tl.set("#s4 .stamp-jagyeok", { visibility: "visible" }, 18.83);
      tl.fromTo("#s4 .stamp-jagyeok", { scale: 0, opacity: 0, rotation: 5, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, rotation: 5, duration: 0.34, ease: "back.out(2.4)" }, 18.83);

      // ---------- S5: iris/scale peak ----------
      tl.fromTo("#s5 .stage", { clipPath: "circle(0% at 50% 55%)" },
        { clipPath: "circle(150% at 50% 55%)", duration: T + 0.1, ease: "power2.inOut" }, 20.88);
      tl.fromTo("#s5 .char-s5-off", { scale: 0.4, opacity: 0, transformOrigin: "50% 100%" },
        { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, 21.2);
      tl.fromTo("#s5 .ray", { opacity: 0, scaleY: 0.5, transformOrigin: "top center" },
        { opacity: 1, scaleY: 1, duration: 0.7, ease: "sine.out", stagger: 0.08 }, 21.0);
      tl.to("#s5 .ray", { rotation: "+=6", duration: 3.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 21.6);
      tl.set("#s5 .stamp-rank", { visibility: "visible" }, 22.7);
      tl.fromTo("#s5 .stamp-rank", { scale: 2.6, opacity: 0, rotation: -3 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.32, ease: "power4.in" }, 22.7);

      // ---------- S6: push down, downfall ----------
      tl.fromTo("#s6 .stage", { y: -1920 }, { y: 0, duration: T, ease: "power3.out" }, 25.27);
      tl.fromTo("#s6 .char-s6-off", { y: 280, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 25.7);
      tl.fromTo("#s6 .palanquin", { y: 160, opacity: 0, rotation: 4 }, { y: 0, opacity: 1, rotation: 0, duration: 0.55, ease: "power2.out" }, 25.8);
      tl.to("#s6 .palanquin", { y: 14, rotation: -3, duration: 0.14, ease: "power2.in", repeat: 5, yoyo: true }, 26.4);
      tl.set("#s6 .stamp-flog", { visibility: "visible" }, 27.9);
      tl.fromTo("#s6 .stamp-flog", { scale: 2.6, opacity: 0, rotation: -8 },
        { scale: 1, opacity: 1, rotation: -8, duration: 0.3, ease: "power4.in" }, 27.9);
      // mystery: character fades out, question marks rise (records vanish)
      tl.to("#s6 .char-s6-off", { opacity: 0, y: 30, duration: 0.8, ease: "power2.in" }, 30.6);
      tl.to("#s6 .palanquin", { opacity: 0.25, duration: 0.8, ease: "power2.in" }, 30.6);
      tl.to("#s6 .stamp-flog", { opacity: 0, duration: 0.5 }, 30.4);
      tl.fromTo("#s6 .qmark", { opacity: 0, y: 40, scale: 0.6 },
        { opacity: 0.9, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)", stagger: 0.25 }, 30.8);

      // ---------- S7: blur crossfade outro ----------
      tl.fromTo("#s7 .stage", { opacity: 0, filter: "blur(16px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "sine.inOut" }, 32.31);
      tl.fromTo("#s7 .logo-big", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 32.7);
      tl.fromTo("#s7 .s7-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 33.1);
      tl.fromTo("#s7 .char-s7-host", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 32.7);
      tl.fromTo("#s7 .subscribe", { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 34.6);
      tl.to("#s7 .subscribe", { scale: 1.08, duration: 0.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 35.2);
      (function () {
        function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        var rand = mulberry32(42);
        var colors = ["#d94f37", "#e8b74a", "#7db95c", "#3a7ca5", "#1f2d45"];
        var stage7 = document.querySelector("#s7 .stage");
        for (var i = 0; i < 16; i++) {
          var piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = Math.round(60 + rand() * 960) + "px";
          piece.style.background = colors[i % colors.length];
          stage7.appendChild(piece);
          tl.fromTo(piece, { y: -60, rotation: rand() * 180 - 90, opacity: 1 },
            { y: 2000, rotation: rand() * 540 - 270, opacity: 1, duration: 2.6 + rand() * 1.2, ease: "power1.in" }, 32.6 + rand() * 0.9);
        }
      })();

      // ---------- mid-scene direction ----------
      SCENES.forEach(function (scene) {
        (scene.changes || []).forEach(function (ch) {
          var sel = ".char-" + ch.char;
          if (ch.expr) tlExpr(sel, ch.expr, ch.at);
          if (ch.pose) tlPose(sel, ch.pose, ch.at);
        });
      });

      // ---------- captions ----------
      var capWrap = document.querySelector(".cap-wrap");
      CAPTION_GROUPS.forEach(function (g, gi) {
        var el = document.createElement("div");
        el.className = "cap-group";
        el.id = "cg-" + gi;
        var pill = document.createElement("div");
        pill.className = "pill";
        g.text.split(" ").forEach(function (word, wi) {
          var span = document.createElement("span");
          span.textContent = (wi > 0 ? " " : "") + word;
          if (g.hi.indexOf(word) !== -1) span.className = "hi";
          pill.appendChild(span);
        });
        el.appendChild(pill);
        capWrap.appendChild(el);
        tl.fromTo(el, { opacity: 0, scale: 0.88, visibility: "visible", transformOrigin: "50% 100%" },
          { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(1.6)" }, g.start);
        tl.to(el, { opacity: 0, scale: 0.95, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
        tl.set(el, { opacity: 0, visibility: "hidden" }, g.end);
      });

      tl.fromTo(".brand-badge", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
