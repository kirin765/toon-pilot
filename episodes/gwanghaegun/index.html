    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1f2d45; }
      @font-face { font-family: "Black Han Sans"; src: url("fonts/BlackHanSans.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Jua"; src: url("fonts/Jua.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Apple SD Gothic Neo"; src: local("Apple SD Gothic Neo"); }
      body { font-family: "Jua", "Apple SD Gothic Neo", sans-serif; color: #26221c; }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      #s1 { z-index: 10; } #s2 { z-index: 20; } #s3 { z-index: 30; } #s4 { z-index: 40; }
      #s5 { z-index: 50; } #s6 { z-index: 60; } #s7 { z-index: 70; } #s8 { z-index: 80; }
      .stage { position: absolute; inset: 0; }
      .char { position: absolute; }
      .char .bob { width: 100%; height: 100%; }
      .char.flip .bob { transform: scaleX(-1); }

      /* shared props (reused from pilot) */
      .ground { position: absolute; bottom: 0; left: 0; right: 0; height: 300px; background: #7db95c; }
      .hill { position: absolute; border-radius: 50%; background: #7db95c; }
      .cloud { position: absolute; border-radius: 60px; background: #f6efe3; }
      .star { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #f6efe3; opacity: 0.75; }
      .moon { position: absolute; border-radius: 50%; background: #f6efe3; }
      .label-pill { position: absolute; }
      .label-pill span { display: inline-block; white-space: nowrap; background: #1f2d45; color: #f6efe3; font-size: 44px; padding: 14px 44px; border-radius: 999px; }
      .stamp {
        position: absolute; font-family: "Black Han Sans"; text-align: center;
        border: 9px solid; border-radius: 20px; padding: 14px 40px; line-height: 1.1;
        background: rgba(246, 239, 227, 0.94); visibility: hidden;
      }
      .stamp small { display: block; font-size: 42px; color: #1f2d45; }

      /* big number typography (자막과 별개로 숫자를 크게 강조) */
      .num-pop {
        position: absolute; font-family: "Black Han Sans"; color: #f6efe3;
        line-height: 0.9; visibility: hidden; text-shadow: 0 8px 0 rgba(15, 20, 30, 0.22);
      }
      .num-pop em { font-style: normal; color: #e8b74a; }

      /* ---------- S1: hook (night camp) ---------- */
      #s1 .stage { background: #1f2d45; }
      .hook-title {
        position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-family: "Black Han Sans"; font-size: 118px; line-height: 1.18; color: #f6efe3; letter-spacing: -0.02em;
      }
      .hook-stamp {
        top: 720px; left: 0; right: 0; margin: 0 auto; width: 560px;
        color: #d94f37; border-color: #d94f37; font-size: 96px; white-space: nowrap; transform: rotate(-7deg);
      }

      /* ---------- S2: 진영, 밀명을 내리다 (dusk camp) ---------- */
      #s2 .stage { background: #1f2d45; }
      .s2-label { top: 300px; left: 0; right: 0; text-align: center; }

      /* ---------- S3: 궁궐, 다섯 번 거절당한 즉위 (night palace) ---------- */
      #s3 .stage { background: #12192c; }

      /* ---------- S4: 명과 후금 사이, 줄타기 외교 (dawn) ---------- */
      #s4 .stage { background: #a9d3e8; }
      .s4-label { top: 300px; left: 0; right: 0; text-align: center; }

      /* ---------- S5: 대비 유폐·동생 사사 (night, confinement) ---------- */
      #s5 .stage { background: #18213a; }

      /* ---------- S6: 제주도 유배 (dusk coast) ---------- */
      #s6 .stage { background: #cf7f4e; }
      .s6-label { top: 300px; left: 0; right: 0; text-align: center; }

      /* ---------- S7: 여운, 빈 용상 (dusk) ---------- */
      #s7 .stage { background: #5c4a68; }

      /* ---------- S8: outro (cream) ---------- */
      #s8 .stage { background: #f6efe3; }
      .logo-big {
        position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-family: "Black Han Sans"; font-size: 190px; color: #1f2d45; line-height: 1.02; letter-spacing: -0.03em;
      }
      .logo-big em { font-style: normal; color: #d94f37; }
      .s8-sub { position: absolute; top: 760px; left: 0; right: 0; text-align: center; font-size: 52px; color: #26221c; }
      .subscribe {
        position: absolute; top: 900px; left: 0; right: 0; margin: 0 auto; width: max-content;
        background: #d94f37; color: #f6efe3; font-family: "Black Han Sans"; font-size: 84px;
        padding: 26px 90px; border-radius: 999px; box-shadow: 10px 10px 0 #1f2d45;
      }
      .confetti { position: absolute; top: -40px; width: 30px; height: 44px; }

      /* ---------- overlay: brand + captions ---------- */
      #overlay { z-index: 100; }
      .brand-badge {
        position: absolute; top: 60px; left: 60px;
        background: #1f2d45; color: #f6efe3; font-family: "Black Han Sans";
        font-size: 44px; padding: 14px 34px; border-radius: 14px; box-shadow: 6px 6px 0 rgba(38,34,28,0.25);
      }
      .brand-badge em { font-style: normal; color: #e8b74a; }
      .cap-wrap { position: absolute; left: 0; right: 0; bottom: 380px; text-align: center; }
      .cap-group { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0; visibility: hidden; }
      .cap-group .pill {
        display: inline-block; background: rgba(31, 45, 69, 0.9);
        padding: 22px 52px; border-radius: 26px; font-size: 74px; color: #f6efe3; line-height: 1.22; max-width: 900px;
        word-break: keep-all;
      }
      .cap-group .hi { color: #e8b74a; font-family: "Black Han Sans"; }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var T = TRANSITION;

      // ---------- mount characters from SCENES ----------
      function setExprDirect(root, name) {
        var e = EXPRESSIONS[name];
        EYE_CLASSES.forEach(function (c) {
          root.querySelector("." + c).setAttribute("visibility", c === e.eye ? "visible" : "hidden");
        });
        MOUTH_CLASSES.forEach(function (c) {
          root.querySelector("." + c).setAttribute("visibility", c === e.mouth ? "visible" : "hidden");
        });
        gsap.set(root.querySelector(".brow-l"), { y: e.browY, rotation: e.browRotL, svgOrigin: "82 64" });
        gsap.set(root.querySelector(".brow-r"), { y: e.browY, rotation: e.browRotR, svgOrigin: "118 64" });
      }
      function setPoseDirect(root, name) {
        var p = POSES[name];
        gsap.set(root.querySelector(".arm-l"), { rotation: p.l, svgOrigin: "60 152" });
        gsap.set(root.querySelector(".arm-r"), { rotation: p.r, svgOrigin: "140 152" });
      }

      var charEls = {};
      SCENES.forEach(function (scene) {
        var stage = document.querySelector("#" + scene.id + " .stage");
        scene.chars.forEach(function (c) {
          var div = document.createElement("div");
          div.className = "char char-" + c.id + (c.flip ? " flip" : "");
          div.setAttribute("data-adj", c.id);
          div.style.left = "calc(" + c.x + "% - " + c.w / 2 + "px)";
          div.style.bottom = c.bottom + "px";
          div.style.width = c.w + "px";
          div.style.height = c.w * 1.2 + "px";
          var bob = document.createElement("div");
          bob.className = "bob";
          bob.innerHTML = makeCharacter(c);
          div.appendChild(bob);
          stage.appendChild(div);
          setExprDirect(div, c.expr);
          setPoseDirect(div, c.pose);
          charEls[c.id] = div;
        });
      });

      // ---------- expression / pose changes ----------
      function tlExpr(sel, name, at) {
        var e = EXPRESSIONS[name];
        EYE_CLASSES.forEach(function (c) {
          tl.set(sel + " ." + c, { attr: { visibility: c === e.eye ? "visible" : "hidden" } }, at);
        });
        MOUTH_CLASSES.forEach(function (c) {
          if (c === "m-open") return;
          tl.set(sel + " ." + c, { attr: { visibility: c === e.mouth ? "visible" : "hidden" } }, at);
        });
        tl.to(sel + " .brow-l", { y: e.browY, rotation: e.browRotL, svgOrigin: "82 64", duration: 0.18, ease: "power2.out" }, at);
        tl.to(sel + " .brow-r", { y: e.browY, rotation: e.browRotR, svgOrigin: "118 64", duration: 0.18, ease: "power2.out" }, at);
      }
      function tlPose(sel, name, at) {
        var p = POSES[name];
        tl.to(sel + " .arm-l", { rotation: p.l, svgOrigin: "60 152", duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(sel + " .arm-r", { rotation: p.r, svgOrigin: "140 152", duration: 0.3, ease: "back.out(2)" }, at);
      }

      // ---------- lip flaps ----------
      SCENES.forEach(function (scene) {
        var talkerCfg = scene.chars.filter(function (c) { return c.id === scene.talker; })[0];
        if (!talkerCfg) return;
        var sel = ".char-" + scene.talker;
        var visFrom = scene.start, visTo = scene.start + scene.dur;
        var idle = EXPRESSIONS[talkerCfg.expr].mouth;
        var changePoints = (scene.changes || []).filter(function (ch) { return ch.expr && ch.char === scene.talker; });
        function idleAt(t) {
          var m = idle;
          changePoints.forEach(function (ch) { if (ch.at <= t) m = EXPRESSIONS[ch.expr].mouth; });
          return m;
        }
        WORDS.forEach(function (w) {
          if (w.start < visFrom || w.start > visTo) return;
          var open = false;
          for (var t = w.start; t < Math.min(w.end, visTo) - 0.04; t += 0.1) {
            open = !open;
            tl.set(sel + " .m-open", { attr: { visibility: open ? "visible" : "hidden" } }, t);
            tl.set(sel + " ." + idleAt(t), { attr: { visibility: open ? "hidden" : "visible" } }, t);
          }
          var tEnd = Math.min(w.end, visTo);
          tl.set(sel + " .m-open", { attr: { visibility: "hidden" } }, tEnd);
          tl.set(sel + " ." + idleAt(tEnd), { attr: { visibility: "visible" } }, tEnd);
        });
      });

      // ---------- blinks + idle bob ----------
      SCENES.forEach(function (scene) {
        scene.chars.forEach(function (c, ci) {
          var sel = ".char-" + c.id;
          if (EXPRESSIONS[c.expr].eye === "eye-open") {
            var t0 = scene.start + 1.1 + ci * 0.7;
            for (var t = t0; t < scene.start + scene.dur - 0.4; t += 2.6) {
              tl.set(sel + " .eye-open", { attr: { visibility: "hidden" } }, t);
              tl.set(sel + " .eye-closed", { attr: { visibility: "visible" } }, t);
              tl.set(sel + " .eye-open", { attr: { visibility: "visible" } }, t + 0.13);
              tl.set(sel + " .eye-closed", { attr: { visibility: "hidden" } }, t + 0.13);
            }
          }
          var bobCycles = Math.ceil(scene.dur / 0.55) - 1;
          tl.to(sel + " .bob", { y: -5, duration: 0.55, ease: "sine.inOut", repeat: bobCycles, yoyo: true }, scene.start);
        });
      });

      // ---------- S1: hook ----------
      tl.fromTo("#s1 .hook-title", { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.15);
      tl.fromTo("#s1 .char-s1-host", { y: 300, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, 0.7);
      tl.fromTo("#s1 .moon", { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.7, ease: "elastic.out(1,0.6)" }, 0.4);
      tl.fromTo("#s1 .star", { opacity: 0 }, { opacity: 0.75, duration: 0.5, stagger: 0.1 }, 0.5);
      tl.fromTo("#s1 .prop[data-adj='s1-horse']", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.fromTo("#s1 .prop[data-adj='s1-weapon-rack']", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.6);
      tl.set("#s1 .hook-stamp", { visibility: "visible" }, 2.4);
      tl.fromTo("#s1 .hook-stamp", { scale: 0, opacity: 0, rotation: -7, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, rotation: -7, duration: 0.34, ease: "back.out(2.2)" }, 2.4);
      tl.set("#s1 .hook-stamp", { visibility: "hidden" }, 5.28);

      // ---------- S2: push-slide from right, 진영·밀명 ----------
      tl.fromTo("#s2 .stage", { x: 1080 }, { x: 0, duration: T, ease: "power3.out" }, 5.28);
      tl.fromTo("#s2 .char-s2-king", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 5.68);
      tl.fromTo("#s2 .char-s2-general", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 5.83);
      tl.fromTo("#s2 .s2-label span", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.95);
      tl.fromTo("#s2 .camp-tent", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 5.45);
      tl.fromTo("#s2 .camp-rack", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.6);

      // ---------- S3: iris reveal, 궁궐 -----------
      tl.fromTo("#s3 .stage", { clipPath: "circle(0% at 50% 55%)" },
        { clipPath: "circle(150% at 50% 55%)", duration: T + 0.15, ease: "power2.inOut" }, 10.19);
      tl.fromTo("#s3 .char-s3-king", { y: 280, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 10.54);
      tl.fromTo("#s3 .palace-s3", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 10.4);
      tl.fromTo("#s3 .star", { opacity: 0 }, { opacity: 0.75, duration: 0.5, stagger: 0.1 }, 10.3);

      // ---------- S4: push up, 줄타기 외교 ----------
      tl.fromTo("#s4 .stage", { y: 1920 }, { y: 0, duration: T, ease: "power3.out" }, 15.67);
      tl.fromTo("#s4 .prop[data-adj='s4-balance-rig']", { scaleY: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 16.05);
      tl.fromTo("#s4 .char-s4-king", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 16.45);
      tl.fromTo("#s4 .s4-label span", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 16.6);
      tl.to("#s4 .prop[data-obj] .balance-beam, #s4 [data-obj='balance-beam']", { rotation: 4, transformOrigin: "50% 50%", duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 16.6);

      // ---------- S5: iris reveal, 감금 ----------
      tl.fromTo("#s5 .stage", { clipPath: "circle(0% at 25% 40%)" },
        { clipPath: "circle(150% at 25% 40%)", duration: T + 0.1, ease: "power2.inOut" }, 21.39);
      tl.fromTo("#s5 .cage-window", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 21.74);
      tl.fromTo("#s5 .palace-silhouette", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 21.6);
      tl.fromTo("#s5 .char-s5-king", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 21.84);

      // ---------- S6: push up, 제주도 유배 ----------
      tl.fromTo("#s6 .stage", { y: 1920 }, { y: 0, duration: T, ease: "power3.out" }, 26.27);
      tl.to("#s6 .prop[data-adj='s6-sea'] [data-obj='sea-water']", { x: "-=40", duration: 2.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 26.7);
      tl.fromTo("#s6 .prop[data-adj='s6-hut']", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 26.7);
      tl.fromTo("#s6 .char-s6-exile", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 26.77);
      tl.fromTo("#s6 .s6-label span", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 26.95);

      // ---------- S7: iris reveal, 빈 용상 ----------
      tl.fromTo("#s7 .stage", { clipPath: "circle(0% at 30% 45%)" },
        { clipPath: "circle(150% at 30% 45%)", duration: T + 0.1, ease: "power2.inOut" }, 31.27);
      tl.fromTo("#s7 .s7-throne-screen", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 31.6);
      tl.fromTo("#s7 .s7-throne-dais", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 31.66);
      tl.fromTo("#s7 .char-s7-exile", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 31.72);

      // ---------- S8: blur crossfade outro ----------
      tl.fromTo("#s8 .stage", { opacity: 0, filter: "blur(16px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "sine.inOut" }, 36.38);
      tl.fromTo("#s8 .logo-big", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 36.78);
      tl.fromTo("#s8 .s8-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 37.18);
      tl.fromTo("#s8 .char-s8-host", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 36.78);
      tl.fromTo("#s8 .subscribe", { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 38.78);
      tl.to("#s8 .subscribe", { scale: 1.08, duration: 0.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 39.38);
      (function () {
        function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        var rand = mulberry32(42);
        var colors = ["#d94f37", "#e8b74a", "#7db95c", "#3a7ca5", "#1f2d45"];
        var stage8 = document.querySelector("#s8 .stage");
        for (var i = 0; i < 16; i++) {
          var piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = Math.round(60 + rand() * 960) + "px";
          piece.style.background = colors[i % colors.length];
          stage8.appendChild(piece);
          tl.fromTo(piece, { y: -60, rotation: rand() * 180 - 90, opacity: 1 },
            { y: 2000, rotation: rand() * 540 - 270, opacity: 1, duration: 2.6 + rand() * 1.2, ease: "power1.in" }, 36.68 + rand() * 0.9);
        }
      })();

      // ---------- mid-scene direction ----------
      SCENES.forEach(function (scene) {
        (scene.changes || []).forEach(function (ch) {
          var sel = ".char-" + ch.char;
          if (ch.expr) tlExpr(sel, ch.expr, ch.at);
          if (ch.pose) tlPose(sel, ch.pose, ch.at);
        });
      });

      // ---------- captions ----------
      var capWrap = document.querySelector(".cap-wrap");
      CAPTION_GROUPS.forEach(function (g, gi) {
        var el = document.createElement("div");
        el.className = "cap-group";
        el.id = "cg-" + gi;
        var pill = document.createElement("div");
        pill.className = "pill";
        g.text.split(" ").forEach(function (word, wi) {
          var span = document.createElement("span");
          span.textContent = (wi > 0 ? " " : "") + word;
          if (g.hi.indexOf(word) !== -1) span.className = "hi";
          pill.appendChild(span);
        });
        el.appendChild(pill);
        capWrap.appendChild(el);
        tl.fromTo(el, { opacity: 0, scale: 0.88, visibility: "visible", transformOrigin: "50% 100%" },
          { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(1.6)" }, g.start);
        tl.to(el, { opacity: 0, scale: 0.95, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
        tl.set(el, { opacity: 0, visibility: "hidden" }, g.end);
      });

      tl.fromTo(".brand-badge", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.4);

      window.__timelines["main"] = tl;

      // ---------- layout overrides (studio-layout.html이 layout-overrides.js 생성) ----------
      var LAYOUT = (typeof window !== "undefined" && window.LAYOUT_OVERRIDES) || {};
      function adjEl(key) {
        if (charEls[key]) return charEls[key];
        return document.querySelector('[data-adj="' + key + '"]');
      }
      function ensureAdjWrap(key) {
        var el = adjEl(key);
        if (!el) return null;
        var p = el.parentElement;
        if (p && p.classList.contains("adj-wrap")) return p;
        var wrap = document.createElement("div");
        wrap.className = "adj-wrap";
        wrap.style.cssText = "position:absolute; inset:0;";
        p.insertBefore(wrap, el);
        wrap.appendChild(el);
        return wrap;
      }
      function applyAdjust(key, o) {
        var el = adjEl(key);
        if (!el) return;
        var wrap = ensureAdjWrap(key);
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s);
        if (o.ox != null && o.oy != null) wrap.style.transformOrigin = o.ox + "px " + o.oy + "px";
        wrap.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
        var sc = el.closest(".scene");
        if (sc && (s !== 1 || dx || dy)) sc.style.overflow = "visible";
      }
      Object.keys(LAYOUT).forEach(function (k) { applyAdjust(k, LAYOUT[k]); });

      // ---------- 소품 내부 부위(data-obj) 오프셋 — SVG <g> transform으로 적용 ----------
      var OBJ = (typeof window !== "undefined" && window.OBJECT_OVERRIDES) || {};
      function objEl(key) { return document.querySelector('[data-obj="' + key + '"]'); }
      function objCenter(key) {
        var g = objEl(key); if (!g) return null;
        try { var b = g.getBBox(); return { cx: b.x + b.width / 2, cy: b.y + b.height / 2 }; } catch (e) { return null; }
      }
      function applyObject(key, o) {
        var g = objEl(key); if (!g) return;
        var dx = o.dx || 0, dy = o.dy || 0, s = (o.s == null ? 1 : o.s);
        var t = "translate(" + dx + " " + dy + ")";
        if (s !== 1) {
          var c = (o.cx != null) ? o : objCenter(key);
          if (c) t += " translate(" + c.cx + " " + c.cy + ") scale(" + s + ") translate(" + (-c.cx) + " " + (-c.cy) + ")";
          else t += " scale(" + s + ")";
        }
        g.setAttribute("transform", t);
      }
      Object.keys(OBJ).forEach(function (k) { applyObject(k, OBJ[k]); });

      // studio-layout.html이 사용하는 훅
      window.__layout = {
        list: function () {
          var out = [];
          document.querySelectorAll("[data-adj]").forEach(function (el) {
            if (el.classList.contains("adj-wrap")) return;
            var scene = el.closest(".scene");
            out.push({ key: el.getAttribute("data-adj"), scene: scene ? scene.id : "" });
          });
          return out;
        },
        get: function () { return LAYOUT; },
        set: function (key, o) { LAYOUT[key] = o; applyAdjust(key, o); },
        rectOf: function (key) {
          var el = adjEl(key); if (!el) return null;
          var stage = el.closest(".stage"); if (!stage) return null;
          var er = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        measureOrigin: function (key) {
          var r = this.rectOf(key); if (!r) return null;
          return { ox: r.x + r.w / 2, oy: r.y + r.h / 2 };
        },
        objectsOf: function (elKey) {
          var el = adjEl(elKey); if (!el) return [];
          return Array.prototype.map.call(el.querySelectorAll("[data-obj]"), function (g) { return g.getAttribute("data-obj"); });
        },
        getObjects: function () { return OBJ; },
        setObject: function (key, o) { OBJ[key] = o; applyObject(key, o); },
        objRectOf: function (key) {
          var g = objEl(key); if (!g) return null;
          var stage = g.closest(".stage"); if (!stage) return null;
          var er = g.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          return { x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height };
        },
        objCenter: objCenter,
        objScreenToSvg: function (key, dxs, dys, outerScale) {
          var g = objEl(key); if (!g || !g.parentNode.getScreenCTM) return { dx: dxs, dy: dys };
          var m = g.parentNode.getScreenCTM(); if (!m) return { dx: dxs, dy: dys };
          var inv = m.inverse(), ix = dxs / outerScale, iy = dys / outerScale;
          return { dx: inv.a * ix + inv.c * iy, dy: inv.b * ix + inv.d * iy };
        },
        overridesText: function () {
          return "// 레이아웃 오프셋(위치/크기) — studio-layout.html에서 생성. 비면 원본 그대로.\n" +
            "var LAYOUT_OVERRIDES = " + JSON.stringify(LAYOUT, null, 2) + ";\n" +
            "var OBJECT_OVERRIDES = " + JSON.stringify(OBJ, null, 2) + ";\n" +
            'if (typeof window !== "undefined") { window.LAYOUT_OVERRIDES = LAYOUT_OVERRIDES; window.OBJECT_OVERRIDES = OBJECT_OVERRIDES; }\n';
        }
      };
    </script>
  </body>
