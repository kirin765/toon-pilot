  <!-- ===== 캐릭터: 백의 죄인 (militia noHat, 소복) — 소반 앞, shocked 표정 ===== -->
  <div class="char" id="char-joein" data-adj="s-joein" style="left:70px; bottom:605px; width:380px; height:456px;"></div>

  <script src="../char-tuning.js"></script>
  <script src="../characters.js"></script>
  <script>
    function mount(sel, cfg, expr){
      var el = document.querySelector(sel);
      el.innerHTML = makeCharacter(cfg);
      var e = EXPRESSIONS[expr || "neutral"];
      EYE_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.eye?"visible":"hidden"); });
      MOUTH_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.mouth?"visible":"hidden"); });
    }
    mount("#char-joein", {variant:"militia", noHat:true, shirt:"#f6efe3", pants:"#d9d0be"}, "shocked");
    mount("#char-gwanwon", {variant:"admiral", shirt:"#2c3548", pants:"#1a2130"}, "neutral");
  </script>
