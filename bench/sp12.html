  <!-- ===== 캐릭터: 몰이 농부 (militia noHat) — 든 손에 고삐 끝 ===== -->

  <script src="../char-tuning.js"></script>
  <script src="../characters.js"></script>
  <script>
    function mount(id, cfg, expr, armSel, armRot) {
      var el = document.getElementById(id);
      el.innerHTML = makeCharacter(cfg);
      var e = EXPRESSIONS[expr];
      EYE_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.eye?"visible":"hidden"); });
      MOUTH_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.mouth?"visible":"hidden"); });
      if (armSel) el.querySelector(armSel).setAttribute("transform", armRot);
    }
    // 농부: 오른팔 들어 고삐 잡음 (손 중심 = 고삐 끝)
    mount("farmer", {variant:"militia", noHat:true, shirt:"#e3d8c0", pants:"#6f5c43"}, "neutral", ".arm-r", "rotate(-100 140 152)");
    // 가마꾼 A(앞): 오른팔 들어 가마채 잡음
    mount("bearer-a", {variant:"militia", shirt:"#d9c8a8", pants:"#6f5c43"}, "neutral", ".arm-r", "rotate(-95 140 152)");
