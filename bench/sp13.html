  <script>
    function mount(sel, cfg, expr){
      var el = document.querySelector(sel);
      el.innerHTML = makeCharacter(cfg);
      var e = EXPRESSIONS[expr || "neutral"];
      EYE_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.eye?"visible":"hidden"); });
      MOUTH_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.mouth?"visible":"hidden"); });
    }
    mount("#char-yangban", {variant:"militia", shirt:"#8fb0c9", pants:"#5c6e7e"}, "neutral");
    mount("#char-noin", {variant:"militia", shirt:"#9a948a", pants:"#6b665c"}, "happy");

    document.querySelector("#char-noin .arm-r").setAttribute("transform", "rotate(-50 140 152)");

    document.querySelector("#char-yangban .arm-l").setAttribute("transform", "rotate(12 60 152)");
