  <!-- 캐릭터: 왕 — 어좌 단 맨 위 단, 용상 오른쪽 옆에 서 있음 -->
  <div class="char" id="char-king" style="left:620px; bottom:902px; width:420px; height:504px; z-index:5;"></div>
  <!-- 캐릭터: 문신 — 단 아래 마루, 고개 숙인 자세(전신 기울임). 자막존(하단 580px) 위에 위치 -->
  <div class="char" id="char-min" style="left:70px; bottom:578px; width:340px; height:408px; transform:rotate(16deg); transform-origin:50% 100%; z-index:4;"></div>

  <script src="../char-tuning.js"></script>
  <script src="../characters.js"></script>
  <script>
    function mount(sel, cfg){ var el=document.querySelector(sel); el.innerHTML=makeCharacter(cfg);
      var e=EXPRESSIONS["neutral"];
      EYE_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.eye?"visible":"hidden"); });
      MOUTH_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.mouth?"visible":"hidden"); }); }
    mount("#char-king", {variant:"king", shirt:"#c0392b", pants:"#7c1d12"});
    mount("#char-min", {variant:"militia", shirt:"#3a4f6e", pants:"#1f2d45"});
  </script>
