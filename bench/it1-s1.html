    </g>
    <g data-obj="floor-pebbles">

  <!-- 보조 소품: 벽 거치대 (낫 + 칼) -->

  <!-- 주 소품: 화로(불) + 굴뚝 + 풀무 -->

  <!-- 주 소품 보완: 모루 (대장장이 앞) -->
  <svg class="prop" data-adj="s1-anvil" style="left:400px; bottom:600px; width:300px" viewBox="0 0 335 200">
    <g data-obj="anvil-stump">
      <path d="M 30 200 L 30 155 Q 30 140 50 140 L 250 140 Q 270 140 270 155 L 270 200 Z" fill="#5a3820"/>
      <path d="M 30 155 L 75 155 L 75 200 L 30 200 Z" fill="#4a2f19" opacity="0.6"/>
      <line x1="75" y1="155" x2="75" y2="195" stroke="#3a2513" stroke-width="5"/>
      <line x1="220" y1="155" x2="220" y2="195" stroke="#3a2513" stroke-width="5"/>
    </g>
    <g data-obj="anvil-body">
      <path d="M 40 140 L 260 140 L 260 108 Q 260 88 235 88 L 65 88 Q 40 88 40 108 Z" fill="#8a8172"/>
      <rect x="40" y="108" width="220" height="20" fill="#4a453c"/>

      <rect x="30" y="100" width="34" height="20" rx="3" fill="#4a453c"/>
    </g>
    <g data-obj="anvil-horn">
      <path d="M 258 132 L 330 96 L 330 84 L 258 112 Z" fill="#8a8172"/>
      <path d="M 258 132 L 330 96 L 330 106 L 258 122 Z" fill="#4a453c" opacity="0.75"/>
      <ellipse cx="328" cy="90" rx="9" ry="6" fill="#b3a996" opacity="0.9"/>
    </g>
  </svg>

  <!-- 캐릭터: 대장장이 (militia, noHat, 회갈색 옷) -->
  <div class="char" style="left:40px; bottom:580px; width:400px; height:480px;"></div>
  <script src="../char-tuning.js"></script>
  <script src="../characters.js"></script>
  <script>
    document.querySelectorAll(".char").forEach(function(el){
      el.innerHTML = makeCharacter({variant:"militia", noHat:true, shirt:"#7c7a6e", pants:"#45423a"});
      var e = EXPRESSIONS["neutral"];
      EYE_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.eye?"visible":"hidden"); });
      MOUTH_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.mouth?"visible":"hidden"); });
    });
  </script>

  <!-- 대장장이 손에 쥔 망치 (캐릭터 위에 겹쳐 그려 손에 든 것처럼, 자막존 위 어깨 높이) -->
  <svg class="prop" data-adj="s1-hammer" style="left:295px; bottom:830px; width:120px; transform:rotate(-15deg); transform-origin:50% 88%;" viewBox="0 0 100 150">
    <g data-obj="hammer-handle">
      <rect x="42" y="55" width="16" height="95" rx="6" fill="#8a5a33"/>
      <rect x="42" y="55" width="6" height="95" fill="#6d4526"/>
    </g>
    <g data-obj="hammer-head">
      <rect x="8" y="6" width="84" height="48" rx="6" fill="#3a3630"/>
      <rect x="8" y="6" width="84" height="14" fill="#5c574c" opacity="0.8"/>
    </g>
  </svg>
</body></html>
