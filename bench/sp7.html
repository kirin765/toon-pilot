  <script src="../char-tuning.js"></script>
  <script src="../characters.js"></script>
  <script>
    function mount(sel, cfg, expr){
      var el = document.querySelector(sel);
      el.innerHTML = makeCharacter(cfg);
      var e = EXPRESSIONS[expr || "neutral"];
      EYE_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.eye?"visible":"hidden"); });
      MOUTH_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.mouth?"visible":"hidden"); });
    }
    mount("#char-joein", {variant:"militia", noHat:true, shirt:"#f6efe3", pants:"#d9d0be"}, "shocked");
    mount("#char-najol", {variant:"admiral", shirt:"#4a5568", pants:"#262f3a"}, "angry");
    // 죄인: 팔 벌려 형틀 빔과 정렬 (정적 씬 — svg rotate, 회전축 = 어깨 피벗)
    document.querySelector("#char-joein .arm-l").setAttribute("transform", "rotate(135 60 152)");
    document.querySelector("#char-joein .arm-r").setAttribute("transform", "rotate(-135 140 152)");
    // 나졸: 오른팔 치켜듦 (곤장 그립 위치)
    document.querySelector("#char-najol .arm-r").setAttribute("transform", "rotate(-150 140 152)");
