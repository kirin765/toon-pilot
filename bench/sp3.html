  <script>
    document.querySelectorAll(".char").forEach(function(el){
      el.innerHTML = makeCharacter({variant:"militia", shirt:"#f6efe3", pants:"#d9d0be"});

      EYE_CLASSES.forEach(function(c){ el.querySelector("."+c).setAttribute("visibility", c===e.eye?"visible":"hidden"); });
