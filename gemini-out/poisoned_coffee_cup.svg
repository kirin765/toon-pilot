<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="poisoned_coffee_cup">
    <!-- 고종의 치명적인 커피 사랑과 독다 사건 -->
    
    <rect width="400" height="300" fill="#2c3e50"/>
    
    <!-- 왕의 서재 탁자 -->
    <ellipse cx="200" cy="220" rx="160" ry="60" fill="#34495e"/>
    
    <!-- 넘어진 서양식 커피잔 (대한제국 시절 수입된 모던한 찻잔) -->
    <g transform="translate(200, 210) rotate(-20)">
      <!-- 엎어진 흰색/금장 커피잔 -->
      <path d="M-40 0 C-40 -20 40 -20 40 0 C30 40 -30 40 -40 0 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      <path d="M-40 0 C-40 10 40 10 40 0" fill="none" stroke="#f1c40f" stroke-width="3"/> <!-- 금테두리 -->
      
      <!-- 찻잔 손잡이 -->
      <path d="M40 0 C60 0 60 20 35 25" fill="none" stroke="#ecf0f1" stroke-width="6" stroke-linecap="round"/>
      <path d="M40 0 C60 0 60 20 35 25" fill="none" stroke="#f1c40f" stroke-width="2" stroke-linecap="round"/>
      
      <!-- 흘러나온 새까만 커피 (가배차) -->
      <path d="M0 10 Q20 50 60 40 Q90 30 50 10 Z" fill="#3e2723"/>
      
      <!-- 커피 속에서 피어오르는 보라색/녹색의 기분 나쁜 연기 (독약/아편의 상징) -->
      <path d="M40 20 Q50 -10 30 -30 Q10 -50 40 -80" fill="none" stroke="#9b59b6" stroke-width="4" opacity="0.6"/>
      <path d="M45 25 Q70 0 40 -20 Q20 -40 50 -70" fill="none" stroke="#2ecc71" stroke-width="3" opacity="0.5"/>
      <circle cx="30" cy="-30" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="40" cy="-20" r="2" fill="#2ecc71" opacity="0.6"/>
    </g>
    
    <!-- 찻잔 받침 (소서) - 바닥에 뒹구는 모습 -->
    <g transform="translate(140, 240) rotate(10)">
      <ellipse cx="0" cy="0" rx="50" ry="15" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="30" ry="8" fill="none" stroke="#f1c40f" stroke-width="2"/>
      <!-- 약간 튄 커피 자국 -->
      <circle cx="20" cy="5" r="4" fill="#3e2723"/>
      <circle cx="30" cy="0" r="2" fill="#3e2723"/>
    </g>
    
    <!-- 황제를 상징하는 오얏꽃(이화) 무늬 장식품이 옆에 놓여있음 -->
    <g transform="translate(280, 250)">
      <path d="M0 -15 Q10 -20 15 -10 Q20 0 10 5 Q0 10 -10 5 Q-20 0 -15 -10 Q-10 -20 0 -15 Z" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
      <circle cx="0" cy="-5" r="3" fill="#e74c3c"/>
    </g>
    
  </g>
</svg>
