<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="shaman_bells_and_gold">
    <!-- 명성황후 진령군 굿판: 무당 방울과 국고 탕진을 상징하는 금괴 -->
    
    <rect width="400" height="300" fill="#1b2631"/>
    
    <!-- 굿판의 섬뜩하고 신비로운 붉은/푸른 연기 (신령의 기운) -->
    <path d="M50 300 Q100 200 150 250 T250 150 T350 200" fill="none" stroke="#e74c3c" stroke-width="15" opacity="0.2" filter="blur(5px)"/>
    <path d="M0 250 Q80 150 200 200 T400 100" fill="none" stroke="#8e44ad" stroke-width="20" opacity="0.2" filter="blur(8px)"/>
    
    <!-- 국고를 탕진한 금괴 무더기 -->
    <g transform="translate(100, 200)">
      <!-- 겹겹이 쌓인 조선시대 형태의 은정/금정(말굽 모양)과 금괴들 -->
      <path d="M0 0 C-30 -20 -20 -40 0 -30 C20 -40 30 -20 0 0 Z" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
      <path d="M40 10 C10 -10 20 -30 40 -20 C60 -30 70 -10 40 10 Z" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
      <path d="M-40 20 C-70 0 -60 -20 -40 -10 C-20 -20 -10 0 -40 20 Z" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
      
      <rect x="-10" y="20" width="60" height="25" rx="5" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
      <rect x="20" y="30" width="60" height="25" rx="5" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
      <rect x="-30" y="40" width="60" height="25" rx="5" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
    </g>
    
    <!-- 무당(진령군)이 흔들던 섬뜩한 놋쇠 방울 (칠성방울) -->
    <g transform="translate(230, 100) rotate(15)">
      <!-- 방울 손잡이 (오색 천이 감긴 나무 손잡이) -->
      <rect x="-10" y="-80" width="20" height="80" fill="#873600"/>
      <!-- 감긴 오색 천 (빨강, 노랑, 파랑, 하양) -->
      <path d="M-10 -70 L10 -60 M-10 -50 L10 -40 M-10 -30 L10 -20" stroke="#e74c3c" stroke-width="8"/>
      <path d="M-10 -60 L10 -50 M-10 -40 L10 -30 M-10 -20 L10 -10" stroke="#f1c40f" stroke-width="8"/>
      <path d="M-10 -50 L10 -40" stroke="#3498db" stroke-width="4"/>
      
      <!-- 방울을 엮은 둥근 쇠 링 -->
      <circle cx="0" cy="15" r="25" fill="none" stroke="#bdc3c7" stroke-width="4"/>
      
      <!-- 방울 1 -->
      <g transform="translate(-25, 20) rotate(30)">
        <circle cx="0" cy="15" r="12" fill="#d4ac0d"/>
        <path d="M-10 15 L10 15" stroke="#7e5109" stroke-width="2"/>
        <circle cx="0" cy="15" r="2" fill="#7e5109"/>
        <path d="M0 0 L0 5" stroke="#bdc3c7" stroke-width="2"/> <!-- 고리 연결부 -->
      </g>
      
      <!-- 방울 2 -->
      <g transform="translate(0, 40)">
        <circle cx="0" cy="15" r="12" fill="#d4ac0d"/>
        <path d="M-10 15 L10 15" stroke="#7e5109" stroke-width="2"/>
        <circle cx="0" cy="15" r="2" fill="#7e5109"/>
        <path d="M0 0 L0 5" stroke="#bdc3c7" stroke-width="2"/>
      </g>
      
      <!-- 방울 3 -->
      <g transform="translate(25, 20) rotate(-30)">
        <circle cx="0" cy="15" r="12" fill="#d4ac0d"/>
        <path d="M-10 15 L10 15" stroke="#7e5109" stroke-width="2"/>
        <circle cx="0" cy="15" r="2" fill="#7e5109"/>
        <path d="M0 0 L0 5" stroke="#bdc3c7" stroke-width="2"/>
      </g>
      
      <!-- 공중에 흩날리는 무속 부적 쪼가리들 -->
      <rect x="-80" y="20" width="20" height="50" fill="#f1c40f" opacity="0.8" transform="rotate(-45)"/>
      <path d="M-75 30 Q-70 45 -65 60" stroke="#e74c3c" stroke-width="3" fill="none" transform="rotate(-45)"/>
    </g>
    
  </g>
</svg>
