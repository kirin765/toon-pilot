<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="donguibogam_spell">
    <!-- 배경 그림자 -->
    <polygon points="60,60 340,60 350,250 50,250" fill="#2c3e50" opacity="0.3"/>
    
    <!-- 오래된 고서(한지) 질감의 책 펼쳐진 모습 -->
    <!-- 우측 페이지 -->
    <path d="M200 40 Q280 20 340 50 L330 240 Q280 220 200 250 Z" fill="#f5eec8"/>
    <path d="M200 40 Q280 20 340 50 L330 240 Q280 220 200 250 Z" fill="none" stroke="#d4c68d" stroke-width="2"/>
    
    <!-- 좌측 페이지 -->
    <path d="M200 40 Q120 20 60 50 L70 240 Q120 220 200 250 Z" fill="#f9f3d6"/>
    <path d="M200 40 Q120 20 60 50 L70 240 Q120 220 200 250 Z" fill="none" stroke="#d4c68d" stroke-width="2"/>
    
    <!-- 중앙 제본선 -->
    <line x1="200" y1="40" x2="200" y2="250" stroke="#8b4513" stroke-width="4"/>
    <line x1="195" y1="45" x2="205" y2="45" stroke="#5c2e0b" stroke-width="2"/>
    <line x1="195" y1="95" x2="205" y2="95" stroke="#5c2e0b" stroke-width="2"/>
    <line x1="195" y1="145" x2="205" y2="145" stroke="#5c2e0b" stroke-width="2"/>
    <line x1="195" y1="195" x2="205" y2="195" stroke="#5c2e0b" stroke-width="2"/>
    <line x1="195" y1="245" x2="205" y2="245" stroke="#5c2e0b" stroke-width="2"/>
    
    <!-- 우측 페이지 - 동의보감(東醫寶鑑) 잡방문 제목 및 글씨 -->
    <!-- 세로쓰기 붉은 테두리 (광곽) -->
    <rect x="215" y="60" width="105" height="160" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
    <line x1="250" y1="60" x2="250" y2="220" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
    <line x1="285" y1="60" x2="285" y2="220" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
    
    <!-- 큰 글씨 (추상화된 붓글씨) -->
    <path d="M295 70 Q300 80 295 90" fill="none" stroke="#17202a" stroke-width="5" stroke-linecap="round"/>
    <path d="M260 80 Q265 110 260 140" fill="none" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
    <path d="M225 90 Q230 140 220 180" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 좌측 페이지 - 은형법(투명인간 비술)을 상징하는 기괴한 부적이나 처방 그림 -->
    <rect x="80" y="60" width="105" height="160" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
    
    <!-- 투명해지는 사람의 실루엣 (점선이나 투명도로 표현) -->
    <g transform="translate(130, 140)">
      <!-- 머리 -->
      <circle cx="0" cy="-40" r="15" fill="none" stroke="#8b4513" stroke-width="3" stroke-dasharray="5 3"/>
      <!-- 몸통 -->
      <path d="M0 -25 C-20 -25 -25 10 -25 40 M0 -25 C20 -25 25 10 25 40" fill="none" stroke="#8b4513" stroke-width="3" stroke-dasharray="6 4"/>
      <!-- 눈에 바르는 약(백구담) 묘사 -->
      <circle cx="-5" cy="-42" r="3" fill="#e74c3c"/>
      <circle cx="5" cy="-42" r="3" fill="#e74c3c"/>
    </g>
    
    <!-- 은형법 한자 추상화 -->
    <path d="M90 70 Q105 70 95 90 Q110 100 85 110" fill="none" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
    <path d="M95 130 Q105 150 90 170" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 기이한 주술적 분위기를 내는 떠다니는 기운 -->
    <path d="M100 200 Q130 180 150 210 Q170 190 160 170" fill="none" stroke="#9b59b6" stroke-width="3" opacity="0.4"/>
  </g>
</svg>
