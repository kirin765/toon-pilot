<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="baekje_broken_shield">
    <!-- 처참한 전장의 흙바닥 (황산벌) -->
    <ellipse cx="200" cy="260" rx="160" ry="30" fill="#a67c52" opacity="0.4"/>
    <ellipse cx="200" cy="250" rx="120" ry="20" fill="#8b5a2b" opacity="0.5"/>
    
    <!-- 흙바닥에 박힌 신라군의 화살들 (방어전의 치열함을 상징) -->
    <line x1="80" y1="200" x2="60" y2="240" stroke="#2c3e50" stroke-width="4"/>
    <polygon points="65,230 60,240 55,230" fill="#7f8c8d"/>
    <path d="M78 198 L85 195 M80 203 L87 200" stroke="#e74c3c" stroke-width="2"/> <!-- 붉은 깃 -->
    
    <line x1="330" y1="220" x2="310" y2="260" stroke="#2c3e50" stroke-width="4"/>
    <polygon points="315,250 310,260 305,250" fill="#7f8c8d"/>
    
    <!-- 진흙에 반쯤 묻혀 부서진 백제군의 둥근 나무 방패 -->
    <!-- 방패 그림자 -->
    <ellipse cx="200" cy="235" rx="85" ry="35" fill="#5c3a21" opacity="0.8"/>
    
    <!-- 비스듬히 누워있는 둥근 나무 방패 -->
    <g transform="translate(200, 210) rotate(-15)">
      <!-- 둥근 형태 (일부가 깨져나감) -->
      <path d="M-70 -20 C-70 -60 70 -60 70 -20 C70 10 30 40 0 40 C-30 40 -70 10 -70 -20 Z" fill="#c0392b"/> <!-- 백제를 상징하는 붉은색 계열 칠 -->
      
      <!-- 칼에 베인 상처와 깨진 테두리 -->
      <path d="M30 -50 L40 -30 L50 -45" fill="#a67c52"/> <!-- 가장자리 부서진 흔적 -->
      <line x1="-40" y1="-30" x2="-10" y2="-10" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="-40" x2="25" y2="-10" stroke="#17202a" stroke-width="5" stroke-linecap="round"/>
      
      <!-- 방패 중앙의 철제 보스 (둥근 쇠장식) - 찌그러지고 녹슨 느낌 -->
      <ellipse cx="0" cy="-10" rx="20" ry="12" fill="#7f8c8d"/>
      <ellipse cx="-2" cy="-12" rx="15" ry="8" fill="#95a5a6"/>
      <!-- 철 장식에 박힌 화살 -->
      <line x1="-30" y1="-40" x2="0" y2="-10" stroke="#1a252f" stroke-width="3"/>
      <path d="M-30 -40 L-35 -45 M-25 -45 L-30 -40" stroke="#ecf0f1" stroke-width="2"/>
      
      <!-- 나무 널빤지 이음새 선 -->
      <line x1="-40" y1="-35" x2="-40" y2="15" stroke="#922b21" stroke-width="2"/>
      <line x1="-20" y1="-45" x2="-20" y2="30" stroke="#922b21" stroke-width="2"/>
      <line x1="20" y1="-45" x2="20" y2="30" stroke="#922b21" stroke-width="2"/>
      <line x1="40" y1="-35" x2="40" y2="15" stroke="#922b21" stroke-width="2"/>
    </g>
    
    <!-- 부러진 백제 장수의 창 (계백의 결사대) -->
    <!-- 창 자루 하단 (바닥에 눕혀짐) -->
    <line x1="250" y1="240" x2="350" y2="230" stroke="#5c2e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- 부러진 창 자루 상단 (땅에 비스듬히 박힘) -->
    <line x1="150" y1="120" x2="190" y2="240" stroke="#5c2e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- 부러진 단면 묘사 (삐죽삐죽한 나무창) -->
    <polygon points="190,240 185,245 195,250" fill="#f5cba7"/>
    <polygon points="250,240 245,235 240,245" fill="#f5cba7"/>
    
    <!-- 창의 쇠끝 (창날) -->
    <polygon points="130,60 155,120 145,125" fill="#7f8c8d"/>
    <polygon points="130,60 145,125 135,115" fill="#bdc3c7"/>
    <!-- 피 묻은 창끝 (처절한 항전) -->
    <path d="M130 60 Q140 80 145 100" fill="none" stroke="#922b21" stroke-width="3"/>
    
    <!-- 펄럭이는 찢어진 백제 깃발의 천조각 (바람에 휘날리다 창에 걸린 모습) -->
    <path d="M150 140 Q110 150 130 180 Q150 200 170 170 Z" fill="#f1c40f" opacity="0.9"/>
    <path d="M150 140 Q110 150 130 180 Q150 200 170 170 Z" fill="none" stroke="#d4ac0d" stroke-width="2"/>
    <!-- 천조각의 핏자국 -->
    <circle cx="140" cy="160" r="5" fill="#c0392b" opacity="0.8"/>
    <path d="M140 160 Q145 170 135 175" fill="none" stroke="#c0392b" stroke-width="4" opacity="0.7"/>
  </g>
</svg>
