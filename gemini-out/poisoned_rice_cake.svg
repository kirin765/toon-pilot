<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="poisoned_rice_cake">
    <!-- 인종 독살설: 문정왕후가 건넨 저주받은 인절미 -->
    
    <rect width="400" height="300" fill="#2c3e50"/>
    
    <!-- 어두운 조명 아래 화려하지만 서늘한 은쟁반 -->
    <ellipse cx="200" cy="200" rx="140" ry="70" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="4"/>
    <ellipse cx="200" cy="195" rx="130" ry="60" fill="#ecf0f1"/>
    
    <!-- 은쟁반에 새겨진 왕실 문양 (문정왕후의 위엄) -->
    <path d="M 170 170 C 190 150 210 150 230 170 C 210 160 190 160 170 170 Z" fill="none" stroke="#bdc3c7" stroke-width="2"/>
    <path d="M 180 220 C 190 230 210 230 220 220" fill="none" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- 먹음직스럽게 담긴 인절미(떡) 조각들 -->
    <!-- 떡 1 (베어 먹은 흔적) -->
    <g transform="translate(180, 180)">
      <path d="M-30 0 C-40 -10 -20 -30 0 -20 C10 -10 10 10 -10 15 Z" fill="#f5b041" stroke="#d68910" stroke-width="2"/>
      <!-- 베어 먹은 이빨 자국 -->
      <path d="M-10 15 C-5 10 -5 5 0 5 C5 5 5 10 10 15" fill="#2c3e50" stroke="#d68910" stroke-width="1"/>
      <!-- 고소한 콩고물 표현 -->
      <circle cx="-15" cy="-10" r="1" fill="#935116"/>
      <circle cx="-5" cy="-15" r="1.5" fill="#935116"/>
      <circle cx="0" cy="-5" r="1" fill="#935116"/>
    </g>
    <!-- 떡 2 -->
    <g transform="translate(230, 190)">
      <path d="M-20 -10 C-30 -30 0 -40 20 -20 C30 0 10 20 -10 10 Z" fill="#f5b041" stroke="#d68910" stroke-width="2"/>
      <circle cx="-5" cy="-15" r="1.5" fill="#935116"/>
      <circle cx="5" cy="-5" r="1" fill="#935116"/>
    </g>
    <!-- 떡 3 -->
    <g transform="translate(160, 210)">
      <path d="M-10 -10 C-20 10 0 30 20 10 C30 -10 10 -20 -10 -10 Z" fill="#f5b041" stroke="#d68910" stroke-width="2"/>
    </g>
    
    <!-- 떡에서 피어오르는 보랏빛 독기 (문정왕후의 은밀한 살의) -->
    <path d="M 180 170 Q 170 120 190 80 Q 210 40 180 10" fill="none" stroke="#9b59b6" stroke-width="6" opacity="0.4" filter="blur(2px)"/>
    <path d="M 230 180 Q 250 140 220 100 Q 190 60 230 30" fill="none" stroke="#9b59b6" stroke-width="4" opacity="0.3" filter="blur(2px)"/>
    
    <!-- 은비녀가 닿은 자리가 까맣게 변색된 모습 (독의 증거) -->
    <g transform="translate(250, 220) rotate(-45)">
      <!-- 은비녀 몸통 -->
      <rect x="-60" y="-3" width="80" height="6" fill="#ecf0f1" rx="3"/>
      <!-- 비녀 머리 장식 -->
      <circle cx="20" cy="0" r="10" fill="#bdc3c7"/>
      <circle cx="20" cy="0" r="5" fill="#f1c40f"/>
      <!-- 떡과 닿아 새까맣게 변색된 비녀 끝부분 -->
      <rect x="-60" y="-3" width="20" height="6" fill="#17202a" rx="3"/>
    </g>
    
  </g>
</svg>
