<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="bangpaeyeon_kite">
    <!-- 새해 액운을 날려 보내거나 전투용으로 쓰이던 방패연 (Traditional Korean Shield Kite) -->
    
    <!-- 맑고 푸른 가을/겨울 하늘 배경 -->
    <rect width="400" height="300" fill="#85c1e9"/>
    <!-- 뭉게구름 -->
    <path d="M50 100 Q70 80 100 100 Q120 90 130 110 L50 110 Z" fill="#fdfefe" opacity="0.8"/>
    <path d="M250 80 Q270 50 300 70 Q330 60 340 90 L250 90 Z" fill="#fdfefe" opacity="0.6"/>
    
    <!-- 하늘 높이 솟아오른 방패연 그룹 -->
    <g transform="translate(200, 150) rotate(15)">
      
      <!-- 방패연 본체 (직사각형의 빳빳한 창호지) -->
      <!-- 비율은 대략 2:3 -->
      <rect x="-60" y="-80" width="120" height="160" fill="#fdfefe" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- 방패연의 상징, 중앙의 둥근 구멍 (방구멍) -->
      <!-- 바람이 통과하여 강한 바람에도 연이 찢어지지 않고 자유롭게 움직이게 함 -->
      <circle cx="0" cy="0" r="30" fill="#85c1e9" stroke="#bdc3c7" stroke-width="1"/>
      
      <!-- 방패연에 그려진 태극 문양과 장식 (이마와 치마 부분) -->
      <!-- 윗부분 (이마) 붉은색 장식 -->
      <rect x="-60" y="-80" width="120" height="25" fill="#e74c3c"/>
      <!-- 아랫부분 (치마) 푸른색 장식 -->
      <rect x="-60" y="55" width="120" height="25" fill="#2980b9"/>
      
      <!-- 연을 지탱하는 5개의 대나무 살 (머릿살, 장살, 중살 등) -->
      <!-- 가로 머릿살 -->
      <line x1="-60" y1="-75" x2="60" y2="-75" stroke="#d4ac0d" stroke-width="3"/>
      <!-- 대각선 장살 (X자 형태) -->
      <line x1="-60" y1="-80" x2="60" y2="80" stroke="#d4ac0d" stroke-width="2"/>
      <line x1="60" y1="-80" x2="-60" y2="80" stroke="#d4ac0d" stroke-width="2"/>
      <!-- 세로 중살 -->
      <line x1="0" y1="-80" x2="0" y2="80" stroke="#d4ac0d" stroke-width="2"/>
      <!-- 가로 허릿살 -->
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#d4ac0d" stroke-width="2"/>
      
      <!-- 연줄을 매는 꽁지 벌금 (목줄) -->
      <path d="M-50 -75 L0 0 L50 -75" fill="none" stroke="#fdfefe" stroke-width="1.5" opacity="0.8"/>
      <path d="M0 80 L0 0" fill="none" stroke="#fdfefe" stroke-width="1.5" opacity="0.8"/>
      <circle cx="0" cy="-20" r="2" fill="#2c3e50"/> <!-- 줄 매듭 -->
      
      <!-- 얼레로 이어지는 기나긴 연줄 (유리가루를 먹여 날카로운 실) -->
      <path d="M0 -20 Q-50 150 -150 250" fill="none" stroke="#fdfefe" stroke-width="1.5"/>
      
    </g>
    
    <!-- 아래쪽에 살짝 보이는 실패 (얼레) -->
    <g transform="translate(60, 260) rotate(-30)">
      <polygon points="-10,20 -20,10 -10,-20 0,-30 10,-20 20,10" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
      <!-- 감겨 있는 흰 실 -->
      <rect x="-15" y="-10" width="30" height="20" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1"/>
      <line x1="-15" y1="-5" x2="15" y2="-5" stroke="#bdc3c7" stroke-width="1"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#bdc3c7" stroke-width="1"/>
      <line x1="-15" y1="5" x2="15" y2="5" stroke="#bdc3c7" stroke-width="1"/>
      <line x1="0" y1="20" x2="0" y2="35" stroke="#5c3a21" stroke-width="4"/> <!-- 손잡이 -->
    </g>
    
  </g>
</svg>
