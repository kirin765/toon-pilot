<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="gamasot_cauldron">
    <!-- 조선의 전통 부엌: 거대한 무쇠 가마솥과 장작불 -->
    
    <!-- 부엌 아궁이 배경 (황토 흙벽과 돌) -->
    <rect width="400" height="300" fill="#a0522d"/>
    <path d="M0 200 L400 200 L400 300 L0 300 Z" fill="#784212"/> <!-- 바닥 -->
    <!-- 돌로 만든 아궁이 벽 -->
    <path d="M50 200 C50 150 100 120 150 120 L250 120 C300 120 350 150 350 200 Z" fill="#5d6d7e" stroke="#2c3e50" stroke-width="4"/>
    <path d="M80 140 Q100 130 120 140 M280 140 Q300 130 320 140 M200 130 Q220 135 240 130" stroke="#34495e" stroke-width="2" fill="none"/>
    
    <!-- 아궁이 속 이글거리는 장작불 -->
    <path d="M100 200 L150 280 L250 280 L300 200 Z" fill="#17202a"/> <!-- 아궁이 구멍 -->
    <g transform="translate(200, 260)">
      <!-- 장작 -->
      <path d="M-60 10 L60 -10 M-50 -10 L50 10 M-20 20 L20 -20" stroke="#5c3a21" stroke-width="12" stroke-linecap="round"/>
      <path d="M-60 10 L60 -10 M-50 -10 L50 10 M-20 20 L20 -20" stroke="#3e2723" stroke-width="6" stroke-linecap="round"/>
      <!-- 불꽃 -->
      <path d="M-40 -10 Q-30 -60 0 -80 Q30 -60 40 -10 Q0 -20 -40 -10 Z" fill="#e74c3c">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M-20 -20 Q-10 -50 0 -70 Q10 -50 20 -20 Q0 -30 -20 -20 Z" fill="#f39c12"/>
      <path d="M-10 -30 Q-5 -50 0 -60 Q5 -50 10 -30 Q0 -35 -10 -30 Z" fill="#f1c40f"/>
    </g>
    
    <!-- 무쇠 가마솥 (Gamasot) -->
    <g transform="translate(200, 110)">
      <!-- 솥의 둥글고 넓은 본체 -->
      <path d="M-120 0 C-130 80 -80 120 0 120 C80 120 130 80 120 0 Z" fill="#1c2833" stroke="#111" stroke-width="3"/>
      <!-- 무쇠 질감 (거친 질감과 반사) -->
      <path d="M-100 20 C-110 50 -70 80 0 90" fill="none" stroke="#566573" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
      <path d="M80 30 C90 60 50 80 20 85" fill="none" stroke="#566573" stroke-width="5" opacity="0.3" stroke-linecap="round"/>
      
      <!-- 솥 테두리 (전) -->
      <ellipse cx="0" cy="0" rx="135" ry="25" fill="#2c3e50" stroke="#111" stroke-width="3"/>
      <!-- 솥뚜껑이 덮이는 안쪽 홈 -->
      <ellipse cx="0" cy="0" rx="120" ry="20" fill="#17202a"/>
      
      <!-- 육중한 솥뚜껑 (살짝 열려 있음) -->
      <g transform="translate(0, -10) rotate(-10)">
        <!-- 뚜껑 바닥 -->
        <ellipse cx="0" cy="0" rx="122" ry="22" fill="#2c3e50" stroke="#111" stroke-width="2"/>
        <!-- 뚜껑 본체 (볼록한 형태) -->
        <path d="M-122 0 C-100 -50 100 -50 122 0 Z" fill="#1c2833" stroke="#111" stroke-width="2"/>
        <!-- 무쇠 광택 -->
        <path d="M-80 -20 Q0 -40 80 -20" fill="none" stroke="#566573" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
        <!-- 뚜껑 손잡이 (꼭지) -->
        <ellipse cx="0" cy="-35" rx="15" ry="8" fill="#17202a" stroke="#111" stroke-width="2"/>
        <path d="M-10 -35 L-5 -45 L5 -45 L10 -35 Z" fill="#2c3e50"/>
      </g>
    </g>
    
    <!-- 솥 틈새로 뿜어져 나오는 하얀 수증기 (밥 짓는 중) -->
    <path d="M120 90 Q100 40 140 10 M150 100 Q140 50 180 20 M280 80 Q320 50 280 10" fill="none" stroke="#ecf0f1" stroke-width="6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="160" cy="40" r="15" fill="#fdfefe" opacity="0.4" filter="blur(3px)"/>
    
  </g>
</svg>
