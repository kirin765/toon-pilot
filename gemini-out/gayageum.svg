<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="gayageum">
    <!-- 가야금 몸통 (오동나무) -->
    <path d="M50 200 L350 120 Q370 115 360 105 L340 90 Q320 85 50 160 Q30 165 40 180 L50 200 Z" fill="#8b4513"/>
    
    <!-- 윗면 밝은 나무판 -->
    <path d="M60 190 L340 115 L320 100 L50 170 Z" fill="#a0522d"/>
    
    <!-- 안족 (기러기발 - 줄을 받치는 나무 조각들) -->
    <!-- 위치를 비스듬한 선상에 배치 -->
    <polygon points="120,165 115,155 125,155" fill="#f5deb3"/>
    <polygon points="140,160 135,150 145,150" fill="#f5deb3"/>
    <polygon points="160,155 155,145 165,145" fill="#f5deb3"/>
    <polygon points="180,150 175,140 185,140" fill="#f5deb3"/>
    <polygon points="200,145 195,135 205,135" fill="#f5deb3"/>
    <polygon points="220,140 215,130 225,130" fill="#f5deb3"/>
    <polygon points="240,135 235,125 245,125" fill="#f5deb3"/>
    <polygon points="260,130 255,120 265,120" fill="#f5deb3"/>
    
    <!-- 12현 (명주실) -->
    <!-- 반복되는 선을 그리기 어려우므로 대표적인 몇 가닥만 묘사 -->
    <path d="M50 185 L350 105" stroke="#ecf0f1" stroke-width="1"/>
    <path d="M52 182 L347 103" stroke="#ecf0f1" stroke-width="1"/>
    <path d="M54 179 L344 101" stroke="#ecf0f1" stroke-width="1"/>
    <path d="M56 176 L341 99" stroke="#ecf0f1" stroke-width="1"/>
    
    <!-- 부들 (명주실을 묶는 두꺼운 끈 - 왼쪽 꼬리) -->
    <circle cx="45" cy="180" r="15" fill="#e74c3c"/>
    <path d="M35 180 Q10 200 30 230" stroke="#c0392b" stroke-width="8" fill="none"/>
    <path d="M45 185 Q20 210 40 240" stroke="#c0392b" stroke-width="8" fill="none"/>
  </g>
</svg>
