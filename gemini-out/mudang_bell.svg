<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="mudang_bell">
    <!-- 무당(만신)이 굿을 할 때 흔드는 방울 세트 (무령) -->
    
    <!-- 굿판을 상징하는 오색 돗자리 배경 -->
    <rect width="400" height="300" fill="#f5b041"/>
    <!-- 돗자리 무늬 -->
    <path d="M0 80 L400 80 M0 160 L400 160 M0 240 L400 240" stroke="#d4ac0d" stroke-width="2" opacity="0.5"/>
    <path d="M100 0 L100 300 M200 0 L200 300 M300 0 L300 300" stroke="#d4ac0d" stroke-width="2" opacity="0.5"/>
    
    <!-- 방울 세트 그림자 -->
    <ellipse cx="210" cy="220" rx="90" ry="40" fill="#d35400" opacity="0.4"/>
    
    <!-- 놋쇠로 만든 여러 개의 방울 묶음 (칠성방울 등) -->
    <g transform="translate(180, 160)">
      
      <!-- 방울들을 묶는 중앙 고리와 손잡이 자루 부분 -->
      <rect x="-10" y="-80" width="20" height="60" fill="#5c3a21" stroke="#3e2723" stroke-width="2" rx="3"/>
      <!-- 손잡이 끝의 황동 장식 -->
      <ellipse cx="0" cy="-80" rx="12" ry="5" fill="#d4ac0d" stroke="#b9770e" stroke-width="2"/>
      
      <!-- 방울이 매달리는 거대한 중앙 원형 놋쇠 고리 -->
      <circle cx="0" cy="-10" r="30" fill="none" stroke="#f1c40f" stroke-width="6"/>
      <circle cx="0" cy="-10" r="30" fill="none" stroke="#d4ac0d" stroke-width="2"/>
      
      <!-- 중앙 고리에 매달린 5개의 동그란 놋쇠 방울 -->
      
      <!-- 방울 1 (맨 왼쪽) -->
      <g transform="translate(-40, 20) rotate(20)">
        <circle cx="0" cy="0" r="15" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
        <path d="M-15 0 L15 0" stroke="#b9770e" stroke-width="2"/> <!-- 가로 홈 -->
        <circle cx="0" cy="8" r="3" fill="#3e2723"/> <!-- 구멍 -->
        <!-- 연결 고리 -->
        <path d="M0 -15 L10 -40" stroke="#f1c40f" stroke-width="3"/>
      </g>
      
      <!-- 방울 2 (왼쪽 아래) -->
      <g transform="translate(-20, 50) rotate(10)">
        <circle cx="0" cy="0" r="18" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
        <path d="M-18 0 L18 0" stroke="#b9770e" stroke-width="2"/>
        <circle cx="0" cy="10" r="4" fill="#3e2723"/>
        <path d="M0 -18 L10 -40" stroke="#f1c40f" stroke-width="3"/>
      </g>
      
      <!-- 방울 3 (중앙 아래, 가장 크고 메인인 방울) -->
      <g transform="translate(10, 60)">
        <circle cx="0" cy="0" r="22" fill="#f39c12" stroke="#d4ac0d" stroke-width="3"/>
        <path d="M-22 0 L22 0" stroke="#b9770e" stroke-width="2"/>
        <!-- 방울 속의 쇠구슬이 보이는 듯한 넓은 홈 -->
        <path d="M-5 12 Q0 8 5 12 L0 18 Z" fill="#3e2723"/>
        <!-- 방울 윗부분의 연꽃 잎 무늬 조각 -->
        <path d="M-10 -20 Q0 -10 10 -20" fill="none" stroke="#d4ac0d" stroke-width="2"/>
        <path d="M0 -22 L-5 -35" stroke="#f1c40f" stroke-width="4"/> <!-- 연결 고리 -->
      </g>
      
      <!-- 방울 4 (오른쪽 아래) -->
      <g transform="translate(45, 40) rotate(-15)">
        <circle cx="0" cy="0" r="16" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
        <path d="M-16 0 L16 0" stroke="#b9770e" stroke-width="2"/>
        <circle cx="0" cy="8" r="3" fill="#3e2723"/>
        <path d="M0 -16 L-15 -35" stroke="#f1c40f" stroke-width="3"/>
      </g>
      
      <!-- 방울 5 (맨 오른쪽) -->
      <g transform="translate(60, 5) rotate(-30)">
        <circle cx="0" cy="0" r="14" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
        <path d="M-14 0 L14 0" stroke="#b9770e" stroke-width="2"/>
        <circle cx="0" cy="7" r="2" fill="#3e2723"/>
        <path d="M0 -14 L-25 -25" stroke="#f1c40f" stroke-width="3"/>
      </g>
      
      <!-- 신내림을 의미하는 길게 늘어뜨린 오방색 명주실 띠 -->
      <path d="M-10 -70 Q-40 0 -60 80" fill="none" stroke="#e74c3c" stroke-width="6"/> <!-- 빨강 -->
      <path d="M0 -70 Q30 0 50 100" fill="none" stroke="#3498db" stroke-width="6"/> <!-- 파랑 -->
      <path d="M5 -70 Q60 -20 80 60" fill="none" stroke="#2ecc71" stroke-width="6"/> <!-- 초록 -->
      <path d="M-5 -70 Q-10 10 20 120" fill="none" stroke="#fdfefe" stroke-width="5"/> <!-- 하양 -->
      <path d="M2 -70 Q10 20 -10 110" fill="none" stroke="#f1c40f" stroke-width="5"/> <!-- 노랑 -->
      
    </g>
  </g>
</svg>
