<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="bigeok">
    <!-- 바닥 그림자 -->
    <ellipse cx="200" cy="240" rx="90" ry="25" fill="#2c3e50" opacity="0.4"/>
    
    <!-- 무쇠 공 몸통 (비격진천뢰) -->
    <circle cx="200" cy="160" r="80" fill="#34495e"/>
    
    <!-- 금속 입체감 (반사광과 그림자) -->
    <circle cx="180" cy="140" r="40" fill="#7f8c8d" opacity="0.3"/>
    <path d="M145 220 A 80 80 0 0 0 255 220 A 60 60 0 0 1 145 220 Z" fill="#17202a" opacity="0.6"/>
    
    <!-- 표면의 거친 무쇠 질감 (점들) -->
    <circle cx="160" cy="130" r="2" fill="#17202a"/>
    <circle cx="220" cy="120" r="2" fill="#17202a"/>
    <circle cx="180" cy="180" r="2" fill="#17202a"/>
    <circle cx="240" cy="160" r="3" fill="#17202a"/>
    <circle cx="150" cy="170" r="1.5" fill="#17202a"/>
    <circle cx="210" cy="200" r="2.5" fill="#17202a"/>
    
    <!-- 뚜껑 (목곡이 들어가는 구멍 덮개) -->
    <ellipse cx="200" cy="85" rx="25" ry="10" fill="#2c3e50"/>
    <ellipse cx="200" cy="80" rx="20" ry="8" fill="#17202a"/>
    
    <!-- 도화선 (약선) -->
    <path d="M200 80 Q210 50 180 30 Q160 15 190 10" stroke="#d4ac0d" stroke-width="4" fill="none"/>
    
    <!-- 타들어가는 불꽃 (도화선 끝) -->
    <circle cx="190" cy="10" r="6" fill="#e74c3c"/>
    <circle cx="190" cy="10" r="4" fill="#f1c40f"/>
    <!-- 불꽃 파편 -->
    <line x1="190" y1="10" x2="195" y2="0" stroke="#f39c12" stroke-width="2"/>
    <line x1="190" y1="10" x2="200" y2="15" stroke="#f39c12" stroke-width="2"/>
    <line x1="190" y1="10" x2="180" y2="15" stroke="#e74c3c" stroke-width="2"/>
  </g>
</svg>
