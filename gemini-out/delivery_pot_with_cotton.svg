<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="delivery_pot_with_cotton">
    <!-- 조선판 배달 음식 효종갱: 새벽 배달을 위해 항아리를 솜과 짚으로 겹겹이 싼 보온 용기 -->
    
    <!-- 새벽의 북촌 양반가 앞 어스름한 골목길 배경 -->
    <rect width="400" height="300" fill="#2c3e50"/>
    <circle cx="300" cy="80" r="30" fill="#ecf0f1" opacity="0.8"/> <!-- 새벽달 -->
    <!-- 차가운 새벽 공기 안개 -->
    <path d="M0 250 Q100 230 200 260 T400 250" fill="none" stroke="#7f8c8d" stroke-width="20" opacity="0.3" filter="blur(5px)"/>
    <path d="M0 280 Q150 260 250 290 T400 270" fill="none" stroke="#95a5a6" stroke-width="30" opacity="0.4" filter="blur(8px)"/>
    
    <!-- 갓 배달되어 따뜻한 온기가 새어 나오는 항아리 묶음 -->
    <g transform="translate(200, 180)">
      
      <!-- 보온을 위해 항아리를 감싼 두툼한 무명솜 덩어리들 -->
      <!-- 솜의 뭉게뭉게 한 외곽선 -->
      <path d="M-80 -40 C-100 -20 -90 40 -60 60 C-30 80 30 80 60 60 C90 40 100 -20 80 -40 C70 -70 30 -90 0 -90 C-30 -90 -70 -70 -80 -40 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="3"/>
      <!-- 솜의 볼륨감과 질감 묘사 -->
      <path d="M-60 -20 Q-30 -50 0 -30 M-80 10 Q-50 30 -10 10 M50 -30 Q20 -10 30 20 M60 30 Q30 50 10 30" fill="none" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- 솜이 흩어지지 않게 단단히 묶어 배달 손잡이를 만든 볏짚 새끼줄 -->
      <!-- 가로로 감싼 줄 -->
      <path d="M-90 10 Q0 30 85 10" fill="none" stroke="#d4ac0d" stroke-width="6"/>
      <path d="M-70 -30 Q0 -10 70 -30" fill="none" stroke="#d4ac0d" stroke-width="6"/>
      <!-- 세로로 감싼 줄 -->
      <path d="M-30 -80 Q-40 0 -30 75" fill="none" stroke="#d4ac0d" stroke-width="6"/>
      <path d="M30 -80 Q40 0 30 75" fill="none" stroke="#d4ac0d" stroke-width="6"/>
      
      <!-- 배달꾼이 들고 온 손잡이 매듭 부분 (상단) -->
      <path d="M-20 -80 C-40 -120 40 -120 20 -80" fill="none" stroke="#d4ac0d" stroke-width="6"/>
      <circle cx="0" cy="-80" r="8" fill="#b9770e"/> <!-- 매듭 -->
      
      <!-- 솜 사이로 살짝 보이는 검은 옹기 항아리의 입구 -->
      <g transform="translate(0, -60)">
        <!-- 항아리 뚜껑 부분 -->
        <ellipse cx="0" cy="0" rx="35" ry="12" fill="#212f3c" stroke="#17202a" stroke-width="2"/>
        <path d="M-35 0 L-35 5 C-35 15 35 15 35 5 L35 0 Z" fill="#212f3c"/>
        <!-- 뚜껑 손잡이 -->
        <ellipse cx="0" cy="-12" rx="10" ry="4" fill="#17202a"/>
        <path d="M-10 -12 L-5 0 L5 0 L10 -12 Z" fill="#212f3c"/>
      </g>
      
      <!-- 항아리 틈새로 뿜어져 나오는 뜨거운 해장국(효종갱)의 수증기 (배달의 생명은 보온) -->
      <path d="M-20 -70 Q-40 -100 -10 -130 M0 -70 Q20 -110 -10 -150 M20 -60 Q50 -90 20 -120" fill="none" stroke="#fdfefe" stroke-width="4" opacity="0.6" stroke-linecap="round">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
      </path>
      
    </g>
    
    <!-- 배달꾼이 급하게 뛰어오며 바닥에 떨어진 은행잎 하나 (새벽 배달의 디테일) -->
    <g transform="translate(100, 240) rotate(45)">
      <path d="M0 0 C10 -15 20 -15 15 -5 C25 -5 20 10 0 10 C-20 10 -25 -5 -15 -5 C-20 -15 -10 -15 0 0 Z" fill="#f4d03f" stroke="#d4ac0d" stroke-width="1"/>
      <path d="M0 0 L-5 15" stroke="#d4ac0d" stroke-width="2"/>
    </g>
    
  </g>
</svg>
