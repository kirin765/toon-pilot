<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="geojunggi">
    <!-- 정약용이 수원 화성을 지을 때 발명한 획기적인 발명품, 거중기(擧重機) -->
    
    <!-- 공사 현장의 흙바닥과 하늘 배경 -->
    <rect width="400" height="300" fill="#e5e8e8"/>
    <path d="M0 250 L400 250" stroke="#bdc3c7" stroke-width="4"/>
    <rect x="0" y="250" width="400" height="50" fill="#d5c7b0"/>
    
    <!-- 뒤쪽 지지대 프레임 (나무 기둥) -->
    <path d="M120 250 L160 50 L240 50 L280 250" fill="none" stroke="#8b5a2b" stroke-width="8" opacity="0.5"/>
    <line x1="140" y1="150" x2="260" y2="150" stroke="#8b5a2b" stroke-width="6" opacity="0.5"/>
    
    <!-- 앞쪽 메인 프레임 (두꺼운 통나무 구조) -->
    <!-- 왼쪽 기둥 -->
    <path d="M100 250 L140 30" stroke="#5c3a21" stroke-width="12" stroke-linecap="round"/>
    <!-- 오른쪽 기둥 -->
    <path d="M300 250 L260 30" stroke="#5c3a21" stroke-width="12" stroke-linecap="round"/>
    
    <!-- 상단 가로보 (고정 도르래가 달린 곳) -->
    <rect x="120" y="20" width="160" height="15" fill="#8b5a2b" rx="5"/>
    
    <!-- 상단 고정 도르래 4개 (축과 바퀴) -->
    <rect x="150" y="35" width="100" height="20" fill="#a67c52"/>
    <circle cx="165" cy="45" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="188" cy="45" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="212" cy="45" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="235" cy="45" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- 하단 움직 도르래 (돌을 묶은 프레임) -->
    <g transform="translate(160, 160)">
      <rect x="-10" y="0" width="100" height="20" fill="#a67c52"/>
      <circle cx="5" cy="10" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="28" cy="10" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="52" cy="10" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="75" cy="10" r="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      <!-- 물건을 거는 고리 -->
      <path d="M40 20 L40 40" stroke="#2c3e50" stroke-width="4"/>
      <path d="M20 40 L60 40 L40 60 Z" fill="#2c3e50"/>
    </g>
    
    <!-- 고정 도르래와 움직 도르래를 연결하는 두꺼운 밧줄 (Z자 모양으로 얽힌 구조) -->
    <g stroke="#d4ac0d" stroke-width="3" fill="none">
      <path d="M165 45 L165 170"/>
      <path d="M165 170 L188 45"/>
      <path d="M188 45 L188 170"/>
      <path d="M188 170 L212 45"/>
      <path d="M212 45 L212 170"/>
      <path d="M212 170 L235 45"/>
      <path d="M235 45 L235 170"/>
      <!-- 양쪽 끝에서 얼레(녹로)로 연결되는 밧줄 -->
      <path d="M165 45 Q120 100 80 160"/>
      <path d="M235 170 Q280 120 320 160"/>
    </g>
    
    <!-- 좌우에 위치한 물레(녹로) - 줄을 감아당기는 장치 -->
    <!-- 왼쪽 녹로 -->
    <g transform="translate(80, 200)">
      <path d="M-20 50 L0 -40 L20 50" fill="none" stroke="#8b5a2b" stroke-width="6"/>
      <ellipse cx="0" cy="0" rx="15" ry="30" fill="#5c3a21" stroke="#3e2723" stroke-width="2"/>
      <!-- 감겨 있는 밧줄 -->
      <rect x="-10" y="-15" width="20" height="30" fill="#d4ac0d"/>
      <line x1="-15" y1="0" x2="-30" y2="20" stroke="#5c3a21" stroke-width="4"/> <!-- 손잡이 -->
    </g>
    
    <!-- 오른쪽 녹로 -->
    <g transform="translate(320, 200)">
      <path d="M-20 50 L0 -40 L20 50" fill="none" stroke="#8b5a2b" stroke-width="6"/>
      <ellipse cx="0" cy="0" rx="15" ry="30" fill="#5c3a21" stroke="#3e2723" stroke-width="2"/>
      <rect x="-10" y="-15" width="20" height="30" fill="#d4ac0d"/>
      <line x1="15" y1="0" x2="30" y2="20" stroke="#5c3a21" stroke-width="4"/>
    </g>
    
    <!-- 들어 올려지는 거대한 화강암 돌덩이 (수원 화성 성곽 축조용 무사석) -->
    <g transform="translate(200, 230)">
      <!-- 밧줄 결박 -->
      <rect x="-60" y="-10" width="120" height="50" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3" rx="2"/>
      <path d="M-60 -10 C-40 -20 40 -20 60 -10" fill="none" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- 돌의 질감 (화강암) -->
      <circle cx="-30" cy="10" r="3" fill="#7f8c8d"/>
      <circle cx="-10" cy="20" r="2" fill="#7f8c8d"/>
      <circle cx="20" cy="5" r="4" fill="#7f8c8d"/>
      <circle cx="40" cy="25" r="2" fill="#7f8c8d"/>
      
      <!-- 묶어 올리는 밧줄 십자 형태 -->
      <path d="M-30 -10 L-30 40 M30 -10 L30 40" stroke="#d4ac0d" stroke-width="4"/>
      <path d="M-60 15 L60 15" stroke="#d4ac0d" stroke-width="4"/>
      <!-- 중심 고리와 연결된 줄 -->
      <path d="M0 -30 L-30 -10 M0 -30 L30 -10" stroke="#d4ac0d" stroke-width="4"/>
    </g>
    
  </g>
</svg>
