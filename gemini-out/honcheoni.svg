<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="honcheoni">
    <!-- 혼천의 (천체 관측 기구) - 여러 겹의 원환(고리) 구조 -->
    <!-- 받침대 -->
    <path d="M120 270 L280 270 L260 220 L140 220 Z" fill="#8b4513"/>
    <rect x="170" y="200" width="60" height="20" fill="#a0522d"/>
    <path d="M190 200 L210 200 L210 50 L190 50 Z" fill="#8b4513"/> <!-- 중심 기둥 -->
    
    <!-- 가장 바깥 고리 (자오환) -->
    <circle cx="200" cy="130" r="90" fill="none" stroke="#d4ac0d" stroke-width="8"/>
    <circle cx="200" cy="130" r="86" fill="none" stroke="#f1c40f" stroke-width="2"/>
    
    <!-- 가로 고리 (적도환) -->
    <ellipse cx="200" cy="130" rx="90" ry="30" fill="none" stroke="#b8860b" stroke-width="6"/>
    <!-- 눈금 표시 (점선) -->
    <ellipse cx="200" cy="130" rx="90" ry="30" fill="none" stroke="#17202a" stroke-width="1" stroke-dasharray="2, 4"/>
    
    <!-- 엇갈린 고리 (황도환) -->
    <g transform="translate(200, 130) rotate(23.5) translate(-200, -130)">
      <ellipse cx="200" cy="130" rx="80" ry="25" fill="none" stroke="#cd7f32" stroke-width="6"/>
      <ellipse cx="200" cy="130" rx="80" ry="25" fill="none" stroke="#17202a" stroke-width="1" stroke-dasharray="2, 4"/>
    </g>
    
    <!-- 안쪽 고리 (백도환) -->
    <g transform="translate(200, 130) rotate(-15) translate(-200, -130)">
      <ellipse cx="200" cy="130" rx="70" ry="60" fill="none" stroke="#c0392b" stroke-width="4"/>
    </g>
    
    <!-- 중심 구 (지구 모형) -->
    <circle cx="200" cy="130" r="15" fill="#2980b9"/>
    <circle cx="195" cy="125" r="5" fill="#3498db"/>
    <path d="M190 120 Q210 120 210 140" fill="none" stroke="#27ae60" stroke-width="3"/> <!-- 땅 모양 묘사 -->
    
    <!-- 고리를 연결하는 못/축 장식 -->
    <circle cx="200" cy="40" r="5" fill="#e74c3c"/>
    <circle cx="200" cy="220" r="5" fill="#e74c3c"/>
    <circle cx="110" cy="130" r="5" fill="#e74c3c"/>
    <circle cx="290" cy="130" r="5" fill="#e74c3c"/>
  </g>
</svg>
