<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="gat_and_travel_bag">
    <!-- 김금원 남장 유람: 남장용 갓과 소박한 괴나리봇짐 -->
    
    <!-- 금강산을 유람하는 산길 느낌의 배경 -->
    <rect width="400" height="300" fill="#a3e4d7"/>
    <path d="M0 220 Q200 180 400 240 L400 300 L0 300 Z" fill="#7dcea0"/>
    <path d="M0 260 Q200 240 400 270 L400 300 L0 300 Z" fill="#52be80"/>
    
    <!-- 소녀가 남장을 위해 쓴 작은 갓 (흑립) -->
    <g transform="translate(150, 160) rotate(-10)">
      <!-- 갓양태 (챙) -->
      <ellipse cx="0" cy="0" rx="80" ry="25" fill="#111" stroke="#333" stroke-width="2"/>
      <!-- 대나무살 느낌의 텍스처 (반투명 망건 묘사) -->
      <ellipse cx="0" cy="0" rx="75" ry="20" fill="none" stroke="#2c3e50" stroke-width="1" stroke-dasharray="2 4"/>
      
      <!-- 총모자 (위로 솟은 부분) -->
      <path d="M-35 0 L-30 -60 C-20 -70 20 -70 30 -60 L35 0 Z" fill="#111" stroke="#333" stroke-width="2"/>
      <path d="M-30 0 L-25 -55 C-15 -60 15 -60 25 -55 L30 0 Z" fill="none" stroke="#2c3e50" stroke-width="1" stroke-dasharray="2 2"/>
      
      <!-- 갓끈 (구슬이 달린 양반의 갓끈) -->
      <path d="M-40 10 Q-20 60 0 70" fill="none" stroke="#111" stroke-width="3"/>
      <path d="M40 10 Q20 60 0 70" fill="none" stroke="#111" stroke-width="3"/>
      <circle cx="0" cy="70" r="5" fill="#e74c3c"/> <!-- 붉은 호박 구슬 -->
      <circle cx="-15" cy="45" r="4" fill="#f1c40f"/>
      <circle cx="15" cy="45" r="4" fill="#f1c40f"/>
    </g>
    
    <!-- 금강산 유람을 위한 봇짐 (괴나리봇짐) -->
    <g transform="translate(280, 220) rotate(15)">
      <!-- 봇짐 천 (광목천) -->
      <rect x="-40" y="-30" width="80" height="60" rx="20" fill="#fdf2e9" stroke="#d5c8a0" stroke-width="3"/>
      <path d="M-30 -30 Q-10 -10 10 -30" fill="none" stroke="#d5c8a0" stroke-width="2"/> <!-- 천 주름 -->
      <path d="M-20 30 Q0 10 20 30" fill="none" stroke="#d5c8a0" stroke-width="2"/>
      
      <!-- 봇짐을 묶은 무명 끈 -->
      <line x1="-15" y1="-30" x2="-15" y2="30" stroke="#a6acaf" stroke-width="4"/>
      <line x1="15" y1="-30" x2="15" y2="30" stroke="#a6acaf" stroke-width="4"/>
      
      <!-- 봇짐 위로 튀어나온 대나무 지팡이 (유람의 필수품) -->
      <line x1="-60" y1="20" x2="80" y2="-40" stroke="#d4ac0d" stroke-width="8" stroke-linecap="round"/>
      <line x1="-30" y1="7" x2="-28" y2="2" stroke="#9a7d0a" stroke-width="2"/> <!-- 대나무 마디 -->
      <line x1="10" y1="-10" x2="12" y2="-15" stroke="#9a7d0a" stroke-width="2"/>
      <line x1="50" y1="-27" x2="52" y2="-32" stroke="#9a7d0a" stroke-width="2"/>
    </g>
    
  </g>
</svg>
