<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="bloody_stone_and_torn_headband">
    <!-- 석전(돌팔매질): 피가 묻은 거친 돌멩이와 찢겨 나간 머리띠(두건) -->
    
    <!-- 흙먼지가 날리는 거친 모래밭 배경 -->
    <rect width="400" height="300" fill="#a67c52"/>
    <ellipse cx="200" cy="150" rx="150" ry="80" fill="#8d6e63" opacity="0.5"/>
    
    <!-- 거친 돌멩이 (석전용 무기) -->
    <g transform="translate(160, 180) rotate(15)">
      <!-- 돌멩이 본체 -->
      <path d="M-50 0 C-40 -40 -10 -60 20 -50 C60 -40 70 10 50 40 C20 70 -50 60 -50 0 Z" fill="#7f8c8d" stroke="#34495e" stroke-width="4"/>
      <!-- 돌 표면의 거친 질감 (패인 자국들) -->
      <path d="M-20 -20 Q0 -30 20 -10" fill="none" stroke="#bdc3c7" stroke-width="2"/>
      <path d="M10 20 Q30 30 40 10" fill="none" stroke="#566573" stroke-width="2"/>
      <circle cx="-10" cy="10" r="5" fill="#566573" opacity="0.6"/>
      <circle cx="30" cy="-20" r="3" fill="#bdc3c7" opacity="0.5"/>
      
      <!-- 돌에 묻어 있는 핏자국 (석전의 폭력성) -->
      <path d="M-30 20 Q-10 40 10 30 Q-10 10 -30 20 Z" fill="#c0392b" opacity="0.9"/>
      <circle cx="-35" cy="10" r="4" fill="#c0392b"/>
      <circle cx="20" cy="40" r="3" fill="#c0392b"/>
    </g>
    
    <!-- 또 다른 작은 돌멩이 (바닥에 굴러다님) -->
    <path d="M260 240 Q280 220 300 240 Q290 260 260 240 Z" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- 치열한 전투 중 찢겨져 날아간 붉은색 머리띠 (석전꾼의 띠) -->
    <g transform="translate(250, 100) rotate(-20)">
      <!-- 공중에서 바닥으로 떨어져 나뒹구는 머리띠 천 -->
      <path d="M-80 -40 C-40 -60 0 -20 40 -50 C80 -80 120 0 70 40 C30 70 -40 0 -80 -40 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="3" opacity="0.9"/>
      <!-- 찢어진 단면 (천이 뜯어진 느낌) -->
      <path d="M-80 -40 L-90 -30 L-70 -20 L-90 -10 L-70 0" fill="none" stroke="#e74c3c" stroke-width="4"/>
      <path d="M-80 -40 L-90 -30 L-70 -20 L-90 -10 L-70 0" fill="none" stroke="#c0392b" stroke-width="2"/>
      
      <!-- 머리띠의 주름 -->
      <path d="M-20 -20 Q20 20 60 10" fill="none" stroke="#c0392b" stroke-width="2"/>
      <path d="M0 -30 Q40 -10 30 30" fill="none" stroke="#c0392b" stroke-width="2"/>
      
      <!-- 피와 먼지가 묻은 얼룩 -->
      <circle cx="20" cy="-10" r="10" fill="#2c1e16" opacity="0.4"/>
      <circle cx="50" cy="20" r="5" fill="#111" opacity="0.5"/>
    </g>
    
    <!-- 바닥에 점점이 떨어진 핏방울 -->
    <circle cx="100" cy="220" r="6" fill="#c0392b" opacity="0.8"/>
    <circle cx="115" cy="230" r="3" fill="#c0392b" opacity="0.7"/>
    <circle cx="90" cy="240" r="4" fill="#c0392b" opacity="0.6"/>
    
  </g>
</svg>
