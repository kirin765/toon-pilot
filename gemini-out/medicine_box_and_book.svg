<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="medicine_box_and_book">
    <!-- 의녀 제도의 탄생: 관비 출신 의녀의 약 상자와 천자문 책 -->
    
    <!-- 깨끗하고 차분한 내의원 바닥 (밝은 나무 텍스처) -->
    <rect width="400" height="300" fill="#d5c8a0"/>
    <path d="M0 60 L400 60 M0 120 L400 120 M0 180 L400 180 M0 240 L400 240" stroke="#bda87a" stroke-width="1"/>
    
    <!-- 조선 의녀를 상징하는 옥색(연녹색) 치마폭 -->
    <path d="M-50 200 Q150 150 250 300 L-50 300 Z" fill="#a2d9ce" stroke="#76d7c4" stroke-width="2"/>
    <path d="M0 220 Q100 200 150 300" fill="none" stroke="#76d7c4" stroke-width="3"/> <!-- 옷 주름 -->
    <path d="M80 250 Q180 230 200 300" fill="none" stroke="#76d7c4" stroke-width="3"/>
    
    <!-- 허리에 차고 다니던 약 상자 (휴대용 구급 약낭) -->
    <g transform="translate(180, 200) rotate(15)">
      <rect x="-40" y="-30" width="80" height="60" rx="10" fill="#873600" stroke="#512e2b" stroke-width="3"/>
      <!-- 상자 테두리 장식 -->
      <rect x="-35" y="-25" width="70" height="50" rx="8" fill="none" stroke="#d4ac0d" stroke-width="2"/>
      <!-- 상자 잠금장치 -->
      <circle cx="0" cy="0" r="8" fill="#d4ac0d"/>
      <rect x="-3" y="-15" width="6" height="30" fill="#d4ac0d"/>
      
      <!-- 상자에 묶인 붉은 끈 -->
      <path d="M0 -30 Q20 -60 50 -40" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
      <path d="M50 -40 Q60 -30 40 -10" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- 글을 모르던 노비들에게 강제로 가르쳤던 기초 한자 교재 '천자문(千字文)' -->
    <g transform="translate(260, 120) rotate(-10)">
      <polygon points="-40,-50 30,-40 20,40 -50,30" fill="#fdf2e9" stroke="#d5c8a0" stroke-width="2"/>
      <!-- 책을 제본한 실선 -->
      <line x1="-42" y1="-40" x2="-35" y2="-40" stroke="#333" stroke-width="2"/>
      <line x1="-45" y1="-10" x2="-38" y2="-10" stroke="#333" stroke-width="2"/>
      <line x1="-47" y1="20" x2="-40" y2="20" stroke="#333" stroke-width="2"/>
      
      <!-- 책 표지의 라벨과 글씨 (千字文) -->
      <rect x="-20" y="-30" width="20" height="40" fill="#fff" stroke="#111" stroke-width="1"/>
      <path d="M-15 -25 L-5 -25 M-10 -25 L-10 -15" stroke="#111" stroke-width="2"/> <!-- 천(千) 간략화 -->
      <path d="M-15 -5 L-5 -5 M-10 -5 L-10 5" stroke="#111" stroke-width="2"/>
    </g>
    
    <!-- 진맥을 짚고 침을 놓기 위한 작은 침통 -->
    <g transform="translate(100, 130) rotate(30)">
      <rect x="-10" y="-30" width="20" height="60" rx="10" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
      <rect x="-10" y="-10" width="20" height="4" fill="#34495e"/>
      <!-- 뽑혀 나온 가느다란 침 하나 -->
      <line x1="0" y1="-30" x2="20" y2="-60" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="20" cy="-60" r="2" fill="#bdc3c7"/>
    </g>
    
  </g>
</svg>
