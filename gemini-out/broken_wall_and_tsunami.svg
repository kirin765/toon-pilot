<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="broken_wall_and_tsunami">
    <!-- 1681년 숙종 대지진과 쓰나미: 무너진 흙담과 거대한 파도 -->
    
    <!-- 재난이 닥친 암울한 잿빛 하늘 배경 -->
    <rect width="400" height="300" fill="#7f8c8d"/>
    <path d="M0 0 L400 0 L400 150 L0 150 Z" fill="#95a5a6" opacity="0.5"/>
    
    <!-- 강원도 해안가를 덮치는 끔찍한 쓰나미 (거대한 파도) -->
    <!-- 뒤쪽 파도 -->
    <path d="M-50 200 C50 100 150 50 250 150 C300 200 350 200 450 180 L450 300 L-50 300 Z" fill="#2e86c1"/>
    <!-- 앞쪽 덮치는 거대한 파도 (우키요에 스타일의 날카로운 물결 변형) -->
    <path d="M-50 300 C0 150 100 50 200 50 C250 50 280 80 300 120 C320 180 250 250 150 250 C100 250 50 280 0 300 Z" fill="#1f618d"/>
    
    <!-- 부서지는 하얀 파도의 포말 (물거품) -->
    <path d="M180 50 C220 30 260 70 280 120 C290 140 260 160 230 140 C210 120 200 80 180 50 Z" fill="#ebf5fb"/>
    <circle cx="280" cy="120" r="10" fill="#ebf5fb"/>
    <circle cx="300" cy="140" r="15" fill="#ebf5fb"/>
    <circle cx="315" cy="170" r="8" fill="#ebf5fb"/>
    <circle cx="260" cy="90" r="6" fill="#ebf5fb"/>
    <circle cx="240" cy="60" r="5" fill="#ebf5fb"/>
    
    <!-- 지진으로 인해 박살 난 한양(또는 해안가 민가)의 흙담 -->
    <g transform="translate(280, 220)">
      <!-- 남아있는 무너진 담장 베이스 -->
      <polygon points="-60,80 80,80 60,-20 0,-40 -40,-10" fill="#a04000"/>
      <!-- 담장의 기와 파편 -->
      <path d="M-40 -10 L0 -40 L20 -30 L-20 0 Z" fill="#34495e"/>
      <path d="M0 -40 L60 -20 L40 -10 L-20 -30 Z" fill="#2c3e50"/>
      
      <!-- 지진으로 갈라진 담장 벽면의 균열 -->
      <path d="M10 -30 L5 0 L20 30 L5 60" fill="none" stroke="#6e2c00" stroke-width="4" stroke-linecap="round"/>
      <path d="M-10 10 L-30 40" fill="none" stroke="#6e2c00" stroke-width="3" stroke-linecap="round"/>
      
      <!-- 공중에 흩날리는 기와와 흙벽돌 파편들 (지진의 충격 묘사) -->
      <polygon points="-80,-60 -60,-70 -50,-50 -70,-40" fill="#34495e" transform="rotate(30 -70 -60)"/>
      <polygon points="30,-80 50,-90 60,-70 40,-60" fill="#2c3e50" transform="rotate(-45 45 -80)"/>
      <circle cx="-40" cy="-80" r="4" fill="#a04000"/>
      <circle cx="0" cy="-70" r="6" fill="#873600"/>
      <circle cx="80" cy="-50" r="5" fill="#a04000"/>
    </g>
    
    <!-- 휩쓸려 가는 나무판자 (파도에 잠긴 집의 잔해) -->
    <polygon points="50,220 120,200 110,180 40,200" fill="#873600" transform="rotate(15 80 200)"/>
    <line x1="60" y1="210" x2="100" y2="195" stroke="#512e2b" stroke-width="2" transform="rotate(15 80 200)"/>
    
  </g>
</svg>
