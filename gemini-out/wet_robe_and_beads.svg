<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="wet_robe_and_beads">
    <!-- 황진이와 지족선사 파계: 젖은 소복과 부러진 염주 -->
    
    <rect width="400" height="300" fill="#17202a"/>
    
    <!-- 비 내리는 어두운 암자 배경 효과 -->
    <path d="M50 0 L20 300 M150 0 L100 300 M250 0 L230 300 M350 0 L310 300 M100 0 L60 300 M300 0 L260 300" stroke="#7f8c8d" stroke-width="1" opacity="0.3" stroke-dasharray="10 5"/>
    <ellipse cx="200" cy="220" rx="160" ry="60" fill="#2c3e50" opacity="0.8"/>
    
    <!-- 바닥에 떨어져 흩어진 108번뇌 염주 알들 (수행의 붕괴) -->
    <g transform="translate(180, 240)">
      <!-- 끊어진 염주 줄 -->
      <path d="M-60 0 Q-20 20 20 -10 Q50 -30 80 10" fill="none" stroke="#d4ac0d" stroke-width="2"/>
      <path d="M-60 0 Q-80 -10 -90 -30" fill="none" stroke="#d4ac0d" stroke-width="2"/>
      
      <!-- 흩어진 거대한 나무 염주 알들 -->
      <circle cx="-60" cy="0" r="8" fill="#873600"/>
      <circle cx="-40" cy="12" r="8" fill="#873600"/>
      <circle cx="-15" cy="18" r="8" fill="#873600"/>
      <circle cx="10" cy="8" r="8" fill="#873600"/>
      <circle cx="30" cy="-5" r="8" fill="#873600"/>
      
      <!-- 굴러다니는 염주 알들 -->
      <circle cx="-20" cy="-15" r="8" fill="#873600"/>
      <circle cx="-80" cy="-20" r="8" fill="#873600"/>
      <circle cx="50" cy="15" r="8" fill="#873600"/>
      <circle cx="70" cy="25" r="8" fill="#873600"/>
      
      <!-- 염주의 붉은 술 장식 (끊어짐) -->
      <path d="M-60 0 L-65 20 M-60 0 L-55 20 L-50 25" stroke="#c0392b" stroke-width="2"/>
    </g>
    
    <!-- 황진이의 빗물에 젖어 속이 비치는 하얀 소복 (관능적 유혹의 상징) -->
    <g transform="translate(180, 160)">
      <!-- 벗어 던진 듯 바닥에 구겨진 소복 저고리 -->
      <path d="M-50 -30 C-80 -10 -70 40 -30 60 C10 80 70 70 90 40 C110 10 90 -20 50 -40 C10 -60 -20 -50 -50 -30 Z" fill="#ecf0f1" opacity="0.85"/>
      <path d="M-50 -30 C-80 -10 -70 40 -30 60 C10 80 70 70 90 40 C110 10 90 -20 50 -40 C10 -60 -20 -50 -50 -30 Z" fill="none" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- 저고리 깃과 동정 -->
      <path d="M-30 -20 Q0 -10 30 -30" fill="none" stroke="#7f8c8d" stroke-width="4"/>
      <!-- 풀어헤쳐진 붉은 고름 -->
      <path d="M-10 -15 Q-40 10 -20 50 Q0 80 40 70" fill="none" stroke="#e74c3c" stroke-width="6"/>
      <path d="M-10 -15 Q10 20 40 10" fill="none" stroke="#e74c3c" stroke-width="6"/>
    </g>
    
    <!-- 승려의 상징인 낡은 목탁이 뒤집혀 방치됨 -->
    <g transform="translate(100, 200) rotate(-30)">
      <circle cx="0" cy="0" r="25" fill="#a04000"/>
      <!-- 목탁 파인 틈 -->
      <path d="M-15 0 C-10 -10 10 -10 15 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-15" cy="0" r="4" fill="#111"/>
      <circle cx="15" cy="0" r="4" fill="#111"/>
      <!-- 목탁 채 -->
      <rect x="-40" y="30" width="60" height="6" fill="#ba4a00" transform="rotate(45)"/>
    </g>
    
  </g>
</svg>
