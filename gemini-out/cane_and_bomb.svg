<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="cane_and_bomb">
    <!-- 남대문역 광장의 바닥 그림자 -->
    <ellipse cx="200" cy="260" rx="140" ry="20" fill="#2c3e50" opacity="0.3"/>
    
    <!-- 평범한 노인의 낡은 나무 지팡이 (대각선으로 바닥에 떨어진 모습) -->
    <g transform="translate(180, 230) rotate(60)">
      <!-- 지팡이 몸통 -->
      <rect x="-120" y="-8" width="220" height="16" rx="8" fill="#8b4513" stroke="#5c2e0b" stroke-width="2"/>
      <path d="M-100 -8 Q-80 0 -60 -8 M-20 8 Q0 0 20 8 M50 -8 Q70 0 90 -8" fill="none" stroke="#5c2e0b" stroke-width="2"/> <!-- 나무 결 -->
      <!-- 둥글게 굽은 지팡이 손잡이 -->
      <path d="M100 -8 C130 -8 130 -40 100 -40 C80 -40 80 -25 90 -25" fill="none" stroke="#8b4513" stroke-width="16" stroke-linecap="round"/>
      <path d="M100 -8 C130 -8 130 -40 100 -40 C80 -40 80 -25 90 -25" fill="none" stroke="#5c2e0b" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
    </g>
    
    <!-- 지팡이 옆에 굴러가는 치명적인 무기 (영국제 수류탄/폭탄) -->
    <!-- 할아버지의 치마폭(두루마기) 속에 숨겼던 폭탄 -->
    <g transform="translate(130, 220) rotate(-15)">
      <ellipse cx="0" cy="25" rx="20" ry="8" fill="#17202a" opacity="0.4"/> <!-- 폭탄 그림자 -->
      
      <!-- 폭탄 몸체 (울퉁불퉁한 파인애플형 수류탄) -->
      <rect x="-20" y="-30" width="40" height="50" rx="10" fill="#2c3e50" stroke="#1a252f" stroke-width="3"/>
      <!-- 수류탄 표면의 격자무늬 (파편이 잘 튀도록 만든 홈) -->
      <line x1="-10" y1="-30" x2="-10" y2="20" stroke="#1a252f" stroke-width="3"/>
      <line x1="0" y1="-30" x2="0" y2="20" stroke="#1a252f" stroke-width="3"/>
      <line x1="10" y1="-30" x2="10" y2="20" stroke="#1a252f" stroke-width="3"/>
      <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#1a252f" stroke-width="3"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#1a252f" stroke-width="3"/>
      <line x1="-20" y1="10" x2="20" y2="10" stroke="#1a252f" stroke-width="3"/>
      
      <!-- 폭탄 윗부분 (기폭 장치) -->
      <rect x="-10" y="-40" width="20" height="10" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
      <rect x="-15" y="-35" width="30" height="5" fill="#95a5a6"/>
      
      <!-- 안전핀과 레버 -->
      <path d="M-5 -40 L-10 -55 L-25 -50" fill="none" stroke="#bdc3c7" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-25" cy="-50" r="5" fill="none" stroke="#bdc3c7" stroke-width="3"/> <!-- 안전핀 고리 -->
      
      <!-- 이미 뽑힌 안전핀 고리가 허공에 날아가는 연출 (거사 직전) -->
      <g transform="translate(40, -50) rotate(30)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#ecf0f1" stroke-width="2"/>
        <line x1="-8" y1="0" x2="-15" y2="0" stroke="#ecf0f1" stroke-width="2"/>
        <!-- 모션 블러 (운동감) -->
        <line x1="10" y1="0" x2="30" y2="-10" stroke="#ecf0f1" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
      </g>
    </g>
    
    <!-- 65세 노인의 결연한 의지를 보여주는 바닥의 흰 고무신 한 짝 -->
    <g transform="translate(250, 250) rotate(-10)">
      <path d="M-30 0 C-30 -20 20 -20 40 0 C50 10 30 20 0 20 C-20 20 -30 10 -30 0 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      <path d="M-15 -5 C0 -5 15 -10 25 -5" fill="none" stroke="#bdc3c7" stroke-width="2"/> <!-- 신발 코 부분 -->
    </g>
  </g>
</svg>
