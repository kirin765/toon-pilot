<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="polo_stick_and_wooden_ball">
    <!-- 격구(조선 폴로): 구부러진 격구채(장시)와 둥근 나무 공(목우) -->
    
    <!-- 모래가 깔린 훈련장(연병장) 배경 -->
    <rect width="400" height="300" fill="#d3ba96"/>
    <path d="M0 150 Q200 100 400 150 M0 200 Q200 150 400 200 M0 250 Q200 200 400 250" stroke="#c2a278" stroke-width="4" opacity="0.5"/>
    
    <!-- 거친 말발굽 자국들 (격구 경기의 흔적) -->
    <g fill="#a8885c" opacity="0.6">
      <path d="M50 80 C60 70 70 70 80 80 C70 90 60 90 50 80 Z" transform="rotate(30 65 80)"/>
      <path d="M65 95 C75 85 85 85 95 95 C85 105 75 105 65 95 Z" transform="rotate(30 80 95)"/>
      
      <path d="M300 200 C310 190 320 190 330 200 C320 210 310 210 300 200 Z" transform="rotate(-45 315 200)"/>
      <path d="M285 215 C295 205 305 205 315 215 C305 225 295 225 285 215 Z" transform="rotate(-45 300 215)"/>
    </g>
    
    <!-- 격구채 (장시 杖匙) - 손잡이는 길고 끝은 숟가락처럼 구부러져 공을 퍼 올릴 수 있음 -->
    <g transform="translate(200, 160) rotate(-25)">
      <!-- 긴 막대 부분 (나무) -->
      <rect x="-150" y="-8" width="180" height="16" rx="5" fill="#8b5a2b" stroke="#5c3a21" stroke-width="3"/>
      <!-- 손잡이에 감은 붉은 가죽 끈 -->
      <path d="M-140 -8 L-130 8 M-130 -8 L-120 8 M-120 -8 L-110 8 M-110 -8 L-100 8 M-100 -8 L-90 8 M-90 -8 L-80 8" stroke="#e74c3c" stroke-width="4"/>
      
      <!-- 구부러진 숟가락 모양의 타격부 (공을 치거나 떠안는 부분) -->
      <path d="M30 -8 C60 -8 80 10 90 40 C100 70 60 70 40 40 C30 25 30 8 30 -8 Z" fill="#a0522d" stroke="#5c3a21" stroke-width="3"/>
      <!-- 숟가락 안쪽의 파인 부분 (명암) -->
      <path d="M45 10 C60 10 70 25 75 40 C80 55 55 55 45 40 C40 30 40 15 45 10 Z" fill="#5c3a21" opacity="0.6"/>
      <!-- 타격부의 거친 흠집 (경기의 흔적) -->
      <line x1="60" y1="20" x2="70" y2="30" stroke="#d2b48c" stroke-width="2"/>
      <line x1="45" y1="35" x2="55" y2="45" stroke="#d2b48c" stroke-width="2"/>
    </g>
    
    <!-- 나무 공 (목우 木牛) - 장시로 치는 공, 붉은 칠이 되어 있음 -->
    <g transform="translate(130, 220)">
      <circle cx="0" cy="0" r="25" fill="#c0392b" stroke="#7b241c" stroke-width="3"/>
      <!-- 공의 둥근 입체감 (하이라이트) -->
      <path d="M-15 -10 Q0 -20 15 -10" fill="none" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
      <!-- 거친 바닥에 긁힌 공의 상처 자국들 -->
      <line x1="-10" y1="5" x2="-5" y2="15" stroke="#7b241c" stroke-width="2"/>
      <line x1="5" y1="0" x2="15" y2="-5" stroke="#7b241c" stroke-width="2"/>
      <circle cx="10" cy="10" r="2" fill="#7b241c"/>
    </g>
    
    <!-- 공이 굴러온 모래 먼지 궤적 -->
    <path d="M30 240 Q80 230 110 220" fill="none" stroke="#c2a278" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    
  </g>
</svg>
