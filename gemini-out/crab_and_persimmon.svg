<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="crab_and_persimmon">
    <!-- 경종 독살설: 영조가 올린 치명적인 식단 (간장게장과 생감) -->
    
    <!-- 음산한 붉은 톤의 밥상 배경 -->
    <rect width="400" height="300" fill="#641e16"/>
    <ellipse cx="200" cy="180" rx="170" ry="90" fill="#17202a" opacity="0.6"/>
    
    <!-- 화려한 왕의 수라상 백자 접시 -->
    <ellipse cx="140" cy="170" rx="80" ry="40" fill="#fdf2e9" stroke="#bdc3c7" stroke-width="2"/>
    <ellipse cx="280" cy="210" rx="60" ry="30" fill="#fdf2e9" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- 접시 1: 속이 꽉 찬 간장게장 (독이 되는 음식 1) -->
    <g transform="translate(140, 160)">
      <!-- 게딱지 -->
      <path d="M-40 0 C-40 -30 40 -30 40 0 C40 20 -40 20 -40 0 Z" fill="#d35400" stroke="#873600" stroke-width="2"/>
      <path d="M-30 -10 C-10 -20 10 -20 30 -10" fill="none" stroke="#e67e22" stroke-width="3"/>
      <!-- 흘러내리는 짠 간장 국물 -->
      <path d="M-20 15 Q0 30 20 10" fill="none" stroke="#3e2723" stroke-width="4"/>
      <!-- 게 집게발 -->
      <path d="M-40 0 Q-60 -20 -50 -40 Q-30 -30 -30 -10" fill="#d35400" stroke="#873600" stroke-width="2"/>
      <path d="M40 0 Q60 -20 50 -40 Q30 -30 30 -10" fill="#d35400" stroke="#873600" stroke-width="2"/>
    </g>
    
    <!-- 접시 2: 덜 익은 푸릇한 생감 (독이 되는 음식 2) -->
    <g transform="translate(280, 200)">
      <!-- 감 1 -->
      <circle cx="-15" cy="0" r="20" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
      <!-- 덜 익은 푸른 얼룩 (생감) -->
      <path d="M-25 -5 Q-15 -15 -5 0" fill="none" stroke="#27ae60" stroke-width="8" opacity="0.6"/>
      <!-- 감 꼭지 -->
      <path d="M-15 -20 L-20 -25 L-10 -25 Z" fill="#229954"/>
      <path d="M-25 -20 Q-15 -15 -5 -20" fill="none" stroke="#229954" stroke-width="2"/>
      
      <!-- 감 2 -->
      <circle cx="15" cy="5" r="18" fill="#e67e22" stroke="#ba4a00" stroke-width="2"/>
      <path d="M15 -13 L10 -18 L20 -18 Z" fill="#229954"/>
    </g>
    
    <!-- 상극의 조화를 상징하는 붉은 X 표시 (보이지 않는 죽음의 덫) -->
    <path d="M180 140 L230 200 M230 140 L180 200" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    
    <!-- 젓가락이 바닥에 떨어져 있음 (고통스럽게 쓰러진 경종 암시) -->
    <g transform="translate(100, 260) rotate(-15)">
      <rect x="-60" y="0" width="120" height="4" fill="#bdc3c7"/>
      <rect x="-55" y="10" width="120" height="4" fill="#bdc3c7"/>
    </g>
    
  </g>
</svg>
