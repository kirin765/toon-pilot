<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="yakttanggi">
    <!-- 한약을 달이던 전통 질그릇 탕약기 (Herb Medicine Pot) -->
    
    <!-- 부뚜막의 따뜻한 불빛 배경 -->
    <rect width="400" height="300" fill="#2c3e50"/>
    <ellipse cx="200" cy="200" rx="150" ry="80" fill="#e67e22" opacity="0.3"/>
    
    <!-- 화로 불꽃 (탕약기를 데우는 숯불) -->
    <g transform="translate(200, 240)">
      <path d="M-40 0 Q-20 -40 0 -20 Q20 -60 40 -10 Q50 20 0 30 Q-50 20 -40 0" fill="#e74c3c" opacity="0.8"/>
      <path d="M-20 10 Q0 -20 10 -10 Q20 -40 30 0 Q30 20 0 25 Q-30 20 -20 10" fill="#f39c12"/>
      <path d="M-10 15 Q0 -5 5 0 Q10 -20 20 10 Q20 20 0 20 Q-20 20 -10 15" fill="#f1c40f"/>
    </g>
    
    <!-- 탕약기 (거친 질감의 짙은 갈색 토기) -->
    <g transform="translate(200, 180)">
      <!-- 탕약기 몸통 -->
      <path d="M-60 0 C-80 50 -50 80 0 80 C50 80 80 50 60 0 Z" fill="#5c3a21" stroke="#3e2723" stroke-width="4"/>
      
      <!-- 질그릇의 거친 질감을 나타내는 얼룩 -->
      <ellipse cx="-20" cy="40" rx="15" ry="10" fill="#3e2723" opacity="0.4"/>
      <ellipse cx="30" cy="20" rx="20" ry="15" fill="#8b5a2b" opacity="0.3"/>
      <path d="M-50 10 Q-60 30 -40 60" fill="none" stroke="#8b5a2b" stroke-width="2" opacity="0.5"/>
      
      <!-- 탕약기 주둥이 (약물을 따르는 귀때) -->
      <path d="M55 -10 Q75 -20 85 -10 Q70 0 58 5 Z" fill="#5c3a21" stroke="#3e2723" stroke-width="3"/>
      
      <!-- 탕약기 손잡이 -->
      <!-- 보통 뜨거우므로 옆으로 길게 뻗은 막대형 손잡이가 있음 -->
      <path d="M-60 0 L-130 -30" stroke="#3e2723" stroke-width="12" stroke-linecap="round"/>
      <path d="M-60 0 L-130 -30" stroke="#8b5a2b" stroke-width="8" stroke-linecap="round"/>
      
      <!-- 탕약기 목 부분 -->
      <rect x="-40" y="-20" width="80" height="20" fill="#5c3a21" stroke="#3e2723" stroke-width="4"/>
      
      <!-- 탕약기를 덮고 있는 한지 (약효가 날아가지 않게 밀봉) -->
      <path d="M-45 -15 Q-55 -45 -30 -50 Q0 -60 30 -50 Q55 -45 45 -15" fill="#fcf3cf" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- 한지를 묶은 삼베 줄 -->
      <path d="M-45 -15 Q0 -5 45 -15" fill="none" stroke="#d4ac0d" stroke-width="3"/>
      <path d="M-45 -10 Q0 0 45 -10" fill="none" stroke="#b9770e" stroke-width="2"/>
      
      <!-- 한지 위로 새어나오는 뜨거운 김 (수증기) -->
      <path d="M-10 -55 Q-20 -80 -10 -110" fill="none" stroke="#fdfefe" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
      <path d="M20 -50 Q30 -90 15 -120" fill="none" stroke="#fdfefe" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
      <path d="M5 -50 Q10 -70 0 -90" fill="none" stroke="#fdfefe" stroke-width="5" opacity="0.3" stroke-linecap="round"/>
      
    </g>
    
    <!-- 약재 꾸러미 (종이에 싼 한약재) -->
    <g transform="translate(320, 240)">
      <polygon points="0,0 -40,-20 -10,-40 30,-20" fill="#f5cba7" stroke="#e59866" stroke-width="2"/>
      <polygon points="-40,-20 -40,10 0,30 0,0" fill="#edbb99" stroke="#dc7633" stroke-width="2"/>
      <polygon points="0,30 30,10 30,-20 0,0" fill="#e59866" stroke="#d35400" stroke-width="2"/>
      <!-- 꾸러미 묶은 끈 (십자 모양) -->
      <line x1="-15" y1="-30" x2="-15" y2="20" stroke="#8b5a2b" stroke-width="2"/>
      <line x1="-40" y1="-5" x2="30" y2="-5" stroke="#8b5a2b" stroke-width="2"/>
      <circle cx="-15" cy="-5" r="3" fill="#8b5a2b"/>
    </g>
    
  </g>
</svg>
