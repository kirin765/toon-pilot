<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="geomungo">
    <!-- 조선 선비들의 악기 1순위, 거문고 (Geomungo) -->
    
    <!-- 은은한 한지 배경 -->
    <rect width="400" height="300" fill="#fcf3cf"/>
    <path d="M0 250 L400 250" stroke="#f5b041" stroke-width="2" opacity="0.3"/>
    
    <!-- 거문고 바닥 그림자 -->
    <ellipse cx="200" cy="200" rx="160" ry="25" fill="#f5b041" opacity="0.5"/>
    
    <!-- 거문고 본체 그룹 -->
    <g transform="translate(200, 180) rotate(-5)">
      
      <!-- 오동나무로 만든 길고 둥근 울림통 (앞면) -->
      <!-- 거문고는 가야금보다 넓고 검은 빛을 띤다 -->
      <path d="M-150 -15 C-50 -25 50 -25 150 -15 C160 -15 165 -5 165 0 L165 15 C165 20 160 25 150 25 C50 35 -50 35 -150 25 C-160 25 -165 20 -165 15 L-165 0 C-165 -5 -160 -15 -150 -15 Z" fill="#3e2723" stroke="#212f3d" stroke-width="2"/>
      
      <!-- 울림통의 두께 (밤나무 밑면) -->
      <path d="M-150 25 C-50 35 50 35 150 25 L150 35 C50 45 -50 45 -150 35 Z" fill="#2c3e50" stroke="#17202a" stroke-width="2"/>
      
      <!-- 오동나무 결 무늬 -->
      <path d="M-120 -5 Q0 5 120 -5 M-100 5 Q0 15 100 5 M-140 15 Q0 25 140 15" fill="none" stroke="#566573" stroke-width="1.5" opacity="0.4"/>
      
      <!-- 거문고의 상징, 16개의 괘 (나무 막대 모양의 브릿지) -->
      <!-- 왼쪽부터 크기가 점점 작아짐 -->
      <g fill="#a04000" stroke="#5c3a21" stroke-width="1">
        <rect x="-100" y="-12" width="6" height="30"/>
        <rect x="-85" y="-10" width="5.5" height="28"/>
        <rect x="-70" y="-8" width="5" height="26"/>
        <rect x="-55" y="-6" width="4.5" height="24"/>
        <rect x="-40" y="-4" width="4" height="22"/>
        <rect x="-25" y="-2" width="4" height="20"/>
        <rect x="-10" y="0" width="3.5" height="18"/>
        <rect x="5" y="2" width="3.5" height="16"/>
        <rect x="20" y="4" width="3" height="14"/>
        <rect x="35" y="6" width="3" height="12"/>
        <rect x="50" y="8" width="2.5" height="10"/>
        <rect x="65" y="10" width="2.5" height="8"/>
        <rect x="80" y="11" width="2" height="7"/>
        <rect x="95" y="12" width="2" height="6"/>
        <rect x="110" y="13" width="2" height="5"/>
        <rect x="125" y="14" width="1.5" height="4"/>
      </g>
      
      <!-- 오른쪽 끝의 안족 (기러기발 모양의 브릿지, 거문고는 3개의 안족이 있음) -->
      <path d="M140 -5 L135 10 L145 10 Z" fill="#d35400" stroke="#8b5a2b" stroke-width="1"/>
      <path d="M145 0 L140 15 L150 15 Z" fill="#d35400" stroke="#8b5a2b" stroke-width="1"/>
      <path d="M150 5 L145 20 L155 20 Z" fill="#d35400" stroke="#8b5a2b" stroke-width="1"/>
      
      <!-- 6개의 명주실 줄 (현) -->
      <g stroke="#fdfefe" stroke-width="1.5" opacity="0.9">
        <!-- 괘 위를 지나는 줄 3개 -->
        <path d="M-150 -10 C-50 -15 50 -15 150 -10"/>
        <path d="M-150 -2 C-50 -5 50 -5 150 -2"/>
        <path d="M-150 6 C-50 5 50 5 150 6"/>
        <!-- 안족 위를 지나는 줄 3개 -->
        <path d="M-150 14 C-50 15 50 15 150 14"/>
        <path d="M-150 22 C-50 25 50 25 150 22"/>
        <!-- 가장 두꺼운 줄 (문현) -->
        <path d="M-150 -18 C-50 -25 50 -25 150 -18" stroke-width="2"/>
      </g>
      
      <!-- 대모 (술대로 내려치는 부분을 보호하는 부드러운 가죽판) -->
      <path d="M-120 -15 C-90 -20 -90 30 -120 25 Z" fill="#7f8c8d" stroke="#566573" stroke-width="2"/>
      
      <!-- 양 끝단 장식 (용두와 꼬리) -->
      <!-- 왼쪽 (용두) 장식과 줄을 묶는 부분 -->
      <rect x="-165" y="-10" width="10" height="30" fill="#a04000" stroke="#5c3a21" stroke-width="2"/>
      <path d="M-165 -15 L-175 -10 L-175 25 L-165 30 Z" fill="#d4ac0d" stroke="#b9770e" stroke-width="2"/>
      <!-- 줄이 묶여 늘어진 붉은 술 장식 (학슬과 부들) -->
      <path d="M-175 10 C-185 20 -195 40 -190 60 M-175 15 C-180 30 -190 50 -180 70" fill="none" stroke="#c0392b" stroke-width="2"/>
      
      <!-- 오른쪽 끝 장식 -->
      <rect x="155" y="-5" width="10" height="25" fill="#a04000" stroke="#5c3a21" stroke-width="2"/>
      
    </g>
    
    <!-- 술대 (거문고를 치는 대나무 막대) -->
    <g transform="translate(100, 120) rotate(30)">
      <!-- 얇고 긴 막대 -->
      <rect x="-40" y="-2" width="80" height="4" rx="2" fill="#d4ac0d" stroke="#b9770e" stroke-width="1.5"/>
      <!-- 잡는 부분 장식 -->
      <circle cx="-30" cy="0" r="3" fill="#c0392b"/>
    </g>
    
  </g>
</svg>
