<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="white_kimchi">
    <!-- 바닥 그림자 -->
    <ellipse cx="200" cy="240" rx="90" ry="15" fill="#2c3e50" opacity="0.2"/>
    
    <!-- 백자 접시 (둥글고 하얀 도자기) -->
    <ellipse cx="200" cy="200" rx="120" ry="40" fill="#f4f6f7"/>
    <ellipse cx="200" cy="200" rx="110" ry="32" fill="#ecf0f1"/>
    <!-- 접시 굽 -->
    <path d="M150 235 Q200 250 250 235 L230 250 Q200 260 170 250 Z" fill="#bdc3c7"/>
    
    <!-- 동치미 국물 (맑고 투명한 느낌) -->
    <ellipse cx="200" cy="195" rx="90" ry="25" fill="#ebf5fb" opacity="0.8"/>
    
    <!-- 배추 백김치 덩어리 (고춧가루 없는 흰색/연녹색) -->
    <g transform="translate(190, 175) rotate(-10)">
      <!-- 배추 줄기 (흰색) -->
      <path d="M-40 0 C-60 -30 -30 -70 0 -80 C30 -90 60 -50 40 -10 C30 10 0 20 -40 0 Z" fill="#fdfefe"/>
      <!-- 배추 잎사귀 (연한 녹색/노란색) -->
      <path d="M-30 -30 C-40 -60 -10 -90 10 -95 C40 -100 70 -60 50 -20 Z" fill="#e8f8f5"/>
      <path d="M0 -40 C-10 -70 20 -100 40 -105 C70 -110 80 -60 40 -30 Z" fill="#d4efdf"/>
      
      <!-- 배추 결/섬유질 묘사 -->
      <path d="M-20 -10 Q0 -40 10 -70" fill="none" stroke="#eaeded" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 -5 Q20 -30 30 -60" fill="none" stroke="#eaeded" stroke-width="2" stroke-linecap="round"/>
      
      <!-- 동치미 무 조각 -->
      <rect x="50" y="0" width="40" height="20" rx="5" fill="#fcf3cf" transform="rotate(20)"/>
      <rect x="-60" y="-20" width="35" height="15" rx="3" fill="#fcf3cf" transform="rotate(-15)"/>
    </g>
    
    <!-- 백김치 고명 (실고추나 파 - 고추 유입 전이므로 파, 밤, 대추, 잣 등으로 묘사) -->
    <!-- 잣 -->
    <circle cx="170" cy="150" r="3" fill="#f5cba7"/>
    <circle cx="180" cy="145" r="3" fill="#f5cba7"/>
    <!-- 얇게 썬 밤/대추 조각 (갈색빛) -->
    <path d="M220 140 Q230 135 235 145 Z" fill="#a04000"/>
    <path d="M150 160 Q160 155 165 165 Z" fill="#a04000"/>
    <!-- 송송 썬 파 (녹색) -->
    <circle cx="210" cy="160" r="4" fill="#58d68d"/>
    <circle cx="240" cy="170" r="3.5" fill="#58d68d"/>
    
    <!-- 젓가락 (나무) -->
    <path d="M80 180 L250 130" stroke="#8b4513" stroke-width="5" stroke-linecap="round"/>
    <path d="M75 190 L245 140" stroke="#8b4513" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
