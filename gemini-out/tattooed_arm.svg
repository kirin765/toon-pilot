<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="tattooed_arm">
    <!-- 어우동의 파격적 스캔들: 양반의 몸에 새긴 문신(타투) -->
    
    <!-- 은밀한 방 안의 붉은 톤 조명 -->
    <rect width="400" height="300" fill="#641e16"/>
    
    <g transform="translate(200, 150) rotate(-15)">
      <!-- 옷소매를 걷어붙인 양반 사대부의 건장한 팔뚝 -->
      <!-- 소매 부분 (흰색 모시옷) -->
      <path d="M-120 -60 Q-80 -80 -20 -50 L-40 60 Q-100 80 -120 0 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="3"/>
      <path d="M-80 -65 Q-70 -20 -50 65" fill="none" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- 맨살이 드러난 팔뚝 (근육질) -->
      <path d="M-20 -50 Q40 -20 120 -10 Q140 10 100 40 Q40 50 -40 60 Z" fill="#f5cba7" stroke="#e59866" stroke-width="4"/>
      <path d="M40 -35 Q60 0 40 45" fill="none" stroke="#e59866" stroke-width="2" opacity="0.6"/> <!-- 근육 선 -->
      
      <!-- 어우동이 먹물과 바늘로 직접 새긴 선명한 흑색 한자 문신 (어우동의 이름 於宇同) -->
      <!-- 於 (어) -->
      <path d="M 0 -20 L 20 -20 M 10 -30 L 10 10 M 0 10 L 20 10" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
      <path d="M 25 -25 L 40 0 M 40 0 L 25 15 M 40 0 L 55 10" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
      <!-- 宇 (우) -->
      <path d="M 70 -20 L 90 -20 M 80 -30 L 80 -10 M 65 -5 L 95 -5 L 95 15 M 70 0 L 90 0 M 80 0 L 80 20 M 70 10 L 90 10" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
      
      <!-- 방금 문신을 새긴 듯 피부 주위가 붉게 부어오른 자국 -->
      <ellipse cx="20" cy="-5" rx="30" ry="40" fill="#e74c3c" opacity="0.3" filter="blur(4px)"/>
      <ellipse cx="80" cy="0" rx="25" ry="30" fill="#e74c3c" opacity="0.3" filter="blur(4px)"/>
    </g>
    
    <!-- 어우동의 화려한 손길: 가체(머리 장식)와 비녀 조각 -->
    <g transform="translate(280, 240) rotate(20)">
      <!-- 금비녀 -->
      <rect x="-40" y="-3" width="80" height="6" fill="#f1c40f" rx="3"/>
      <!-- 붉은 보석 장식 -->
      <circle cx="30" cy="0" r="12" fill="#e74c3c"/>
      <path d="M20 -10 L40 10 M20 10 L40 -10" stroke="#f1c40f" stroke-width="2"/>
    </g>
    
    <!-- 문신을 새길 때 쓴 피 묻은 바늘과 먹물 그릇 -->
    <g transform="translate(100, 220)">
      <!-- 먹물 접시 -->
      <ellipse cx="0" cy="0" rx="30" ry="15" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
      <ellipse cx="0" cy="-2" rx="25" ry="10" fill="#17202a"/>
      <!-- 뾰족한 바늘 -->
      <path d="M -10 10 L -40 40" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-10" cy="10" r="3" fill="#e74c3c"/> <!-- 바늘 끝의 피 -->
    </g>
    
  </g>
</svg>
