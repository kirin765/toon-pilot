<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="gama_palanquin">
    <!-- 조선 사대부나 왕족이 타던 옥교 (화려한 가마) -->
    
    <!-- 밝고 부드러운 단색 배경 -->
    <rect width="400" height="300" fill="#e5e8e8"/>
    <!-- 바닥 그림자 -->
    <ellipse cx="200" cy="250" rx="150" ry="20" fill="#bdc3c7" opacity="0.7"/>
    
    <!-- 가마 전체 그룹 -->
    <g transform="translate(200, 160)">
      
      <!-- 가마를 드는 긴 가마채 (앞뒤로 길게 뻗은 두꺼운 나무 막대) -->
      <!-- 뒤쪽 막대 -->
      <rect x="-160" y="60" width="320" height="10" fill="#8b5a2b" stroke="#5c3a21" stroke-width="2"/>
      <!-- 앞쪽 막대 -->
      <rect x="-170" y="75" width="340" height="12" fill="#a0522d" stroke="#5c3a21" stroke-width="2"/>
      <!-- 채 끝부분 금속 장식 -->
      <rect x="-170" y="75" width="10" height="12" fill="#d4ac0d"/>
      <rect x="160" y="75" width="10" height="12" fill="#d4ac0d"/>
      
      <!-- 가마 본체 (방 모양의 공간) -->
      <rect x="-50" y="-30" width="100" height="100" fill="#34495e" stroke="#2c3e50" stroke-width="4"/>
      
      <!-- 가마 본체의 나무 기둥과 테두리 (주칠을 한 붉은 나무) -->
      <!-- 세로 기둥 -->
      <rect x="-50" y="-30" width="8" height="100" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      <rect x="42" y="-30" width="8" height="100" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      <!-- 가로 테두리 -->
      <rect x="-50" y="62" width="100" height="8" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      <rect x="-50" y="-30" width="100" height="8" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      
      <!-- 측면 창문 (바람이 통하는 격자무늬 문살과 녹색 비단 막) -->
      <rect x="-35" y="-15" width="70" height="50" fill="#27ae60" stroke="#c0392b" stroke-width="3"/>
      <!-- 격자 무늬 -->
      <line x1="-35" y1="10" x2="35" y2="10" stroke="#f1c40f" stroke-width="1.5"/>
      <line x1="0" y1="-15" x2="0" y2="35" stroke="#f1c40f" stroke-width="1.5"/>
      <line x1="-17.5" y1="-15" x2="-17.5" y2="35" stroke="#f1c40f" stroke-width="1.5"/>
      <line x1="17.5" y1="-15" x2="17.5" y2="35" stroke="#f1c40f" stroke-width="1.5"/>
      
      <!-- 화려한 가마 지붕 (지붕 마루가 솟은 둥근 천막 형태) -->
      <!-- 파란색 덮개 -->
      <path d="M-60 -30 C-40 -80 40 -80 60 -30 Z" fill="#2980b9" stroke="#1f618d" stroke-width="3"/>
      <path d="M-40 -30 C-20 -70 20 -70 40 -30 Z" fill="#3498db"/> <!-- 지붕 입체감 -->
      
      <!-- 지붕 테두리 장식 (처마 끝 수술 장식) -->
      <rect x="-60" y="-30" width="120" height="5" fill="#f1c40f"/>
      <path d="M-55 -25 L-55 -15 M-45 -25 L-45 -15 M-35 -25 L-35 -15 M-25 -25 L-25 -15 M-15 -25 L-15 -15 M-5 -25 L-5 -15 M5 -25 L5 -15 M15 -25 L15 -15 M25 -25 L25 -15 M35 -25 L35 -15 M45 -25 L45 -15 M55 -25 L55 -15" stroke="#e74c3c" stroke-width="2"/>
      
      <!-- 꼭대기 황금색 장식 (호리병 모양) -->
      <circle cx="0" cy="-70" r="5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
      <ellipse cx="0" cy="-60" rx="4" ry="6" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
      
      <!-- 모서리에 매달린 붉은 술 장식 -->
      <circle cx="-55" cy="-25" r="3" fill="#f1c40f"/>
      <path d="M-55 -22 C-60 -10 -50 0 -55 5" fill="none" stroke="#e74c3c" stroke-width="2"/>
      <circle cx="55" cy="-25" r="3" fill="#f1c40f"/>
      <path d="M55 -22 C60 -10 50 0 55 5" fill="none" stroke="#e74c3c" stroke-width="2"/>
      
    </g>
    
  </g>
</svg>
