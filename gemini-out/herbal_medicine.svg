<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="herbal_medicine">
    <!-- 조선 시대 약탕기(전약기)와 탕약, 약재들 -->
    
    <!-- 따뜻한 온돌방 또는 약방 바닥 배경 -->
    <rect width="400" height="300" fill="#e59866"/>
    <!-- 한지 장판 무늬 -->
    <path d="M0 100 Q200 120 400 100 M0 200 Q200 180 400 200" fill="none" stroke="#d35400" stroke-width="3" opacity="0.3"/>
    
    <!-- 숯불이 든 흙 화로 -->
    <g transform="translate(150, 220)">
      <!-- 화로 그림자 -->
      <ellipse cx="0" cy="30" rx="60" ry="15" fill="#a04000" opacity="0.6"/>
      <!-- 화로 본체 -->
      <path d="M-50 0 C-50 40 -30 60 0 60 C30 60 50 40 50 0 L-50 0 Z" fill="#8b5a2b" stroke="#5c3a21" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="50" ry="15" fill="#3e2723" stroke="#5c3a21" stroke-width="3"/>
      
      <!-- 이글거리는 숯불 (주황색, 빨간색) -->
      <circle cx="-15" cy="5" r="8" fill="#e74c3c"/>
      <circle cx="10" cy="0" r="10" fill="#d35400"/>
      <circle cx="0" cy="8" r="7" fill="#f39c12"/>
      <circle cx="20" cy="5" r="6" fill="#e74c3c"/>
      <circle cx="-25" cy="0" r="5" fill="#f39c12"/>
    </g>
    
    <!-- 약탕기 (약을 달이는 옹기 그릇, 꼬막단지) -->
    <g transform="translate(150, 160)">
      <!-- 약탕기 본체 -->
      <path d="M-40 20 C-50 60 50 60 40 20 L30 -20 L-30 -20 Z" fill="#34495e" stroke="#2c3e50" stroke-width="3"/>
      <!-- 뚜껑 대신 덮어놓은 한지 (약효가 날아가지 않게 함) -->
      <ellipse cx="0" cy="-20" rx="35" ry="10" fill="#fdfefe" stroke="#bdc3c7" stroke-width="2"/>
      <!-- 한지를 묶은 새끼줄 -->
      <line x1="-35" y1="-20" x2="35" y2="-20" stroke="#f5b041" stroke-width="2"/>
      <!-- 약탕기 손잡이 -->
      <path d="M45 10 C60 10 70 30 50 40 L45 35 C60 25 50 15 40 15 Z" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      <!-- 약탕기 부리 (주둥이) -->
      <path d="M-40 10 L-60 -5 L-45 -15 Z" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- 보글보글 끓으며 부리에서 나오는 하얀 김 -->
      <path d="M-55 -10 Q-60 -40 -30 -60" fill="none" stroke="#fdfefe" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M-60 -5 Q-80 -20 -70 -50" fill="none" stroke="#fdfefe" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <!-- 약 냄새를 상징하는 옅은 갈색 기운 -->
      <path d="M-50 -20 Q-20 -50 -40 -80" fill="none" stroke="#d4ac0d" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    </g>
    
    <!-- 사발에 담긴 시커먼 탕약 -->
    <g transform="translate(300, 200)">
      <ellipse cx="0" cy="15" rx="35" ry="10" fill="#a04000" opacity="0.6"/> <!-- 사발 그림자 -->
      
      <!-- 백자 사발 -->
      <path d="M-30 0 C-30 20 -15 30 0 30 C15 30 30 20 30 0 Z" fill="#fdfefe" stroke="#bdc3c7" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- 까만 탕약 (진하게 달인 한약) -->
      <ellipse cx="0" cy="2" rx="25" ry="6" fill="#17202a"/>
      <!-- 탕약 빛 반사 -->
      <ellipse cx="-10" cy="2" rx="5" ry="2" fill="#566573" opacity="0.8"/>
      <!-- 탕약 김 -->
      <path d="M0 0 Q10 -15 -5 -30" fill="none" stroke="#fdfefe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
    
    <!-- 바닥에 흩어진 한약재 (인삼, 감초, 대추) -->
    
    <!-- 대추 2알 (붉고 주름진 열매) -->
    <g transform="translate(250, 240)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="#922b21" stroke="#641e16" stroke-width="1.5" transform="rotate(30)"/>
      <!-- 대추 주름 -->
      <path d="M-2 -10 Q0 0 -2 10" stroke="#641e16" stroke-width="1" transform="rotate(30)"/>
      <path d="M3 -8 Q5 0 3 8" stroke="#641e16" stroke-width="1" transform="rotate(30)"/>
    </g>
    <g transform="translate(230, 250)">
      <ellipse cx="0" cy="0" rx="7" ry="10" fill="#c0392b" stroke="#641e16" stroke-width="1.5" transform="rotate(-40)"/>
      <path d="M-2 -8 Q0 0 -2 8" stroke="#641e16" stroke-width="1" transform="rotate(-40)"/>
    </g>
    
    <!-- 감초 (동그랗게 썬 나무토막 형태) -->
    <g transform="translate(270, 260)">
      <!-- 감초 조각 1 -->
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#fcf3cf" stroke="#d4ac0d" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="none" stroke="#d4ac0d" stroke-width="1"/> <!-- 나이테 -->
      <!-- 옆면 -->
      <path d="M-10 0 L-10 4 C-10 8 10 8 10 4 L10 0" fill="#a67c52" stroke="#d4ac0d" stroke-width="1.5"/>
    </g>
    <g transform="translate(285, 250)">
      <!-- 감초 조각 2 -->
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#fcf3cf" stroke="#d4ac0d" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="none" stroke="#d4ac0d" stroke-width="1"/>
      <path d="M-10 0 L-10 4 C-10 8 10 8 10 4 L10 0" fill="#a67c52" stroke="#d4ac0d" stroke-width="1.5"/>
    </g>
    
    <!-- 인삼 (사람 모양의 뿌리) -->
    <g transform="translate(80, 230) rotate(-30)">
      <path d="M0 0 C10 10 10 30 20 40 C15 45 5 35 0 25 C-5 35 -15 45 -20 40 C-10 30 -10 10 0 0 Z" fill="#f5cba7" stroke="#dc7633" stroke-width="2"/>
      <!-- 인삼 머리(뇌두) -->
      <rect x="-3" y="-5" width="6" height="5" fill="#eb984e" rx="2"/>
      <!-- 인삼 잔뿌리들 -->
      <path d="M10 20 Q20 25 30 20" fill="none" stroke="#eb984e" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-10 20 Q-20 25 -30 20" fill="none" stroke="#eb984e" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15 35 Q20 45 15 50" fill="none" stroke="#eb984e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 표면 흙 묻은 질감 묘사 -->
      <path d="M-5 5 L5 10 M-8 15 L2 20 M-2 25 L8 30" stroke="#ca6f1e" stroke-width="1" opacity="0.6"/>
    </g>
    
  </g>
</svg>
