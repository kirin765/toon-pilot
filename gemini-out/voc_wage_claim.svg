<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="voc_wage_claim">
    <!-- 책상 배경 (오래된 유럽의 서재 느낌) -->
    <rect x="20" y="20" width="360" height="260" fill="#5c3a21" rx="10" opacity="0.3"/>
    
    <!-- 펼쳐진 낡은 양피지 문서 (하멜의 임금 청구 보고서) -->
    <g transform="translate(140, 150) rotate(-5)">
      <!-- 문서 그림자 -->
      <path d="M-60 -90 L90 -90 L90 110 L-60 110 Z" fill="#2c3e50" opacity="0.4"/>
      <!-- 문서 본체 -->
      <path d="M-65 -95 L85 -95 L85 105 L-65 105 Z" fill="#f5eec8" stroke="#d7ccc8" stroke-width="2"/>
      <!-- 종이 질감과 낡은 테두리 -->
      <path d="M-65 -95 Q-40 -105 85 -95" fill="none" stroke="#d7ccc8" stroke-width="3"/>
      <path d="M85 105 Q60 115 -65 105" fill="none" stroke="#d7ccc8" stroke-width="3"/>
      
      <!-- VOC (네덜란드 동인도 회사) 로고 스탬프 (상단 중앙) -->
      <!-- 'V' 위에 'O'와 'C'가 겹친 붉은 인장 -->
      <circle cx="10" cy="-60" r="18" fill="#c0392b" opacity="0.8"/>
      <path d="M0 -70 L10 -50 L20 -70" fill="none" stroke="#f5eec8" stroke-width="3" stroke-linejoin="round"/> <!-- V -->
      <circle cx="2" cy="-65" r="4" fill="none" stroke="#f5eec8" stroke-width="2"/> <!-- O -->
      <path d="M22 -69 C18 -69 15 -65 18 -61" fill="none" stroke="#f5eec8" stroke-width="2"/> <!-- C -->
      
      <!-- 깃펜으로 휘갈겨 쓴 글씨들 (13년 치 임금 청구 내역) -->
      <!-- 날짜와 수신인 -->
      <line x1="-50" y1="-30" x2="-10" y2="-30" stroke="#2c3e50" stroke-width="2"/>
      <line x1="-50" y1="-20" x2="30" y2="-20" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
      
      <!-- 본문 (청구 금액 강조) -->
      <line x1="-50" y1="0" x2="70" y2="0" stroke="#2c3e50" stroke-width="2"/>
      <line x1="-50" y1="10" x2="50" y2="10" stroke="#2c3e50" stroke-width="2"/>
      <line x1="-50" y1="20" x2="60" y2="20" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- "13 YEARS" 와 숫자가 굵게 적힌 부분 (밀린 임금) -->
      <rect x="-45" y="35" width="80" height="20" fill="#fcf3cf" opacity="0.5"/> <!-- 형광펜 칠한 듯한 연출 -->
      <line x1="-40" y1="40" x2="30" y2="40" stroke="#c0392b" stroke-width="4"/>
      <line x1="-40" y1="50" x2="10" y2="50" stroke="#2c3e50" stroke-width="3"/>
      
      <line x1="-50" y1="70" x2="70" y2="70" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- 하멜의 서명 -->
      <path d="M10 90 Q30 80 50 90 Q60 85 70 95" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- 깃펜과 엎어진 잉크병 -->
    <g transform="translate(260, 200) rotate(45)">
      <!-- 하얀 깃털 펜 -->
      <path d="M0 0 C-20 -40 -40 -60 0 -100 C40 -60 20 -40 0 0 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#bdc3c7" stroke-width="2"/>
      <!-- 펜촉 -->
      <polygon points="0,0 -3,15 3,15" fill="#34495e"/>
      <polygon points="-3,15 0,25 3,15" fill="#2c3e50"/>
      <!-- 묻은 잉크 -->
      <circle cx="0" cy="20" r="3" fill="#17202a"/>
    </g>
    
    <g transform="translate(90, 80) rotate(-15)">
      <!-- 작은 잉크병 -->
      <rect x="-15" y="-10" width="30" height="25" rx="3" fill="#34495e"/>
      <rect x="-10" y="-15" width="20" height="5" fill="#7f8c8d"/>
      <circle cx="0" cy="-15" r="8" fill="#17202a"/>
      <!-- 종이에 번진 잉크 방울 -->
      <circle cx="20" cy="20" r="4" fill="#17202a" opacity="0.8"/>
      <circle cx="15" cy="25" r="2" fill="#17202a" opacity="0.6"/>
      <circle cx="30" cy="15" r="1.5" fill="#17202a" opacity="0.7"/>
    </g>
    
    <!-- 항해용 나침반 (조선 표류를 상징) -->
    <g transform="translate(280, 80)">
      <circle cx="0" cy="0" r="35" fill="#d4ac0d" stroke="#b9770e" stroke-width="4"/>
      <circle cx="0" cy="0" r="28" fill="#fdf2e9"/>
      <!-- 나침반 바늘 -->
      <polygon points="-5,0 0,-20 5,0" fill="#c0392b"/>
      <polygon points="-5,0 0,20 5,0" fill="#2c3e50"/>
      <circle cx="0" cy="0" r="3" fill="#d4ac0d"/>
    </g>
  </g>
</svg>
