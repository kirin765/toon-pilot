<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="yeopjeon_bundle">
    <!-- 바닥 그림자 -->
    <ellipse cx="200" cy="270" rx="100" ry="20" fill="#2c3e50" opacity="0.4"/>
    
    <!-- 엽전을 꿴 지푸라기 끈 (아래로 늘어진 형태) -->
    <path d="M180 50 Q170 150 180 250" fill="none" stroke="#d4ac0d" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 50 Q230 150 220 250" fill="none" stroke="#d4ac0d" stroke-width="8" stroke-linecap="round"/>
    
    <!-- 상평통보 엽전들 (겹겹이 쌓인 모습) -->
    <!-- 하나의 엽전 그리는 함수적 접근 대신, 그룹 복사나 수작업 배치 -->
    <!-- 엽전 색상: 구리빛 (황동색, 푸른 녹) -->
    <g id="coin" transform="translate(180, 240)">
      <circle cx="0" cy="0" r="25" fill="#b9770e"/>
      <circle cx="0" cy="0" r="22" fill="#d68910"/>
      <!-- 가운데 네모난 구멍 -->
      <rect x="-6" y="-6" width="12" height="12" fill="#2c3e50"/>
      <!-- 테두리와 글자 느낌의 단순한 선 -->
      <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="#b9770e" stroke-width="2"/>
      <path d="M0 -15 L0 -9 M0 9 L0 15 M-15 0 L-9 0 M9 0 L15 0" stroke="#b9770e" stroke-width="3"/>
    </g>
    
    <use href="#coin" x="-10" y="-15"/>
    <use href="#coin" x="5" y="-30"/>
    <use href="#coin" x="-5" y="-45"/>
    <use href="#coin" x="8" y="-60"/>
    <use href="#coin" x="-8" y="-75"/>
    <use href="#coin" x="4" y="-90"/>
    <use href="#coin" x="-6" y="-105"/>
    <use href="#coin" x="5" y="-120"/>
    <use href="#coin" x="-4" y="-135"/>
    <use href="#coin" x="0" y="-150"/>
    
    <!-- 우측 꾸러미 -->
    <g id="coin_right" transform="translate(220, 245)">
      <circle cx="0" cy="0" r="25" fill="#af601a"/>
      <circle cx="0" cy="0" r="22" fill="#ca6f1e"/>
      <rect x="-6" y="-6" width="12" height="12" fill="#2c3e50"/>
      <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="#af601a" stroke-width="2"/>
    </g>
    <use href="#coin_right" x="8" y="-18"/>
    <use href="#coin_right" x="-5" y="-35"/>
    <use href="#coin_right" x="6" y="-50"/>
    <use href="#coin_right" x="-4" y="-68"/>
    <use href="#coin_right" x="7" y="-85"/>
    <use href="#coin_right" x="-5" y="-100"/>
    <use href="#coin_right" x="4" y="-115"/>
    <use href="#coin_right" x="-3" y="-130"/>
    <use href="#coin_right" x="5" y="-145"/>
    
    <!-- 상단 매듭 -->
    <path d="M180 50 Q200 20 220 50" fill="none" stroke="#d4ac0d" stroke-width="10" stroke-linecap="round"/>
    <path d="M195 40 L205 40" stroke="#b9770e" stroke-width="15" stroke-linecap="round"/>
    
    <!-- 엽전의 녹슨 표현 (청동 녹) -->
    <circle cx="170" cy="230" r="4" fill="#1abc9c" opacity="0.6"/>
    <circle cx="185" cy="170" r="3" fill="#1abc9c" opacity="0.7"/>
    <circle cx="215" cy="140" r="5" fill="#1abc9c" opacity="0.5"/>
    <circle cx="225" cy="200" r="3" fill="#1abc9c" opacity="0.6"/>
  </g>
</svg>
