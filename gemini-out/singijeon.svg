<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="singijeon">
    <!-- 화차 바퀴 -->
    <circle cx="120" cy="240" r="40" fill="#8b4513"/>
    <circle cx="120" cy="240" r="30" fill="#f5deb3"/>
    <!-- 바퀴살 -->
    <line x1="120" y1="200" x2="120" y2="280" stroke="#8b4513" stroke-width="6"/>
    <line x1="80" y1="240" x2="160" y2="240" stroke="#8b4513" stroke-width="6"/>
    <circle cx="120" cy="240" r="10" fill="#2c3e50"/> <!-- 바퀴 축 -->
    
    <!-- 뒤쪽 바퀴 (작게) -->
    <circle cx="280" cy="220" r="30" fill="#a0522d"/>
    <circle cx="280" cy="220" r="20" fill="#f5deb3"/>
    <line x1="280" y1="190" x2="280" y2="250" stroke="#8b4513" stroke-width="4"/>
    <line x1="250" y1="220" x2="310" y2="220" stroke="#8b4513" stroke-width="4"/>
    
    <!-- 수레 몸통 (차체) -->
    <path d="M80 180 L320 160 L340 180 L100 200 Z" fill="#cd853f"/>
    <path d="M80 180 L100 200 L100 220 L80 200 Z" fill="#a0522d"/>
    
    <!-- 신기전기 (발사대 박스) -->
    <polygon points="120,70 300,50 320,130 140,150" fill="#8b4513"/>
    <!-- 발사대 앞면 (구멍이 뚫린 면) -->
    <polygon points="120,70 140,150 110,160 90,80" fill="#a0522d"/>
    
    <!-- 구멍과 화살촉 (앞면 디테일) -->
    <circle cx="115" cy="90" r="3" fill="#17202a"/>
    <circle cx="125" cy="110" r="3" fill="#17202a"/>
    <circle cx="130" cy="130" r="3" fill="#17202a"/>
    
    <!-- 발사되는 로켓 불화살 (위로 솟구침) -->
    <!-- 로켓 1 -->
    <line x1="160" y1="65" x2="80" y2="20" stroke="#d4ac0d" stroke-width="3"/>
    <polygon points="80,20 70,25 75,15" fill="#7f8c8d"/>
    <circle cx="160" cy="65" r="8" fill="#e74c3c"/>
    <circle cx="160" cy="65" r="4" fill="#f1c40f"/>
    <!-- 꼬리 연기 -->
    <path d="M160 65 Q180 80 200 70" stroke="#bdc3c7" stroke-width="4" fill="none" opacity="0.6"/>
    
    <!-- 로켓 2 -->
    <line x1="220" y1="60" x2="140" y2="10" stroke="#d4ac0d" stroke-width="3"/>
    <polygon points="140,10 130,15 135,5" fill="#7f8c8d"/>
    <circle cx="220" cy="60" r="8" fill="#e74c3c"/>
    <circle cx="220" cy="60" r="4" fill="#f1c40f"/>
    <path d="M220 60 Q235 75 250 60" stroke="#bdc3c7" stroke-width="4" fill="none" opacity="0.6"/>
  </g>
</svg>
