<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="deungrong">
    <!-- 등롱 매달린 줄 -->
    <line x1="200" y1="20" x2="200" y2="60" stroke="#34495e" stroke-width="4"/>
    
    <!-- 위쪽 나무 테두리 -->
    <ellipse cx="200" cy="70" rx="45" ry="15" fill="#8b4513"/>
    <ellipse cx="200" cy="65" rx="45" ry="15" fill="#a0522d"/>
    
    <!-- 청사초롱 위쪽 붉은 천 (홍사) -->
    <path d="M155 70 Q145 120 155 160 L245 160 Q255 120 245 70 Z" fill="#e74c3c"/>
    <!-- 입체감 명암 -->
    <path d="M245 70 Q255 120 245 160 L200 160 L200 70 Z" fill="#c0392b" opacity="0.5"/>
    
    <!-- 청사초롱 아래쪽 푸른 천 (청사) -->
    <path d="M155 160 Q160 210 165 240 L235 240 Q240 210 245 160 Z" fill="#2980b9"/>
    <!-- 입체감 명암 -->
    <path d="M245 160 Q240 210 235 240 L200 240 L200 160 Z" fill="#2471a3" opacity="0.5"/>
    
    <!-- 아래쪽 나무 테두리 -->
    <ellipse cx="200" cy="245" rx="35" ry="10" fill="#8b4513"/>
    <ellipse cx="200" cy="240" rx="35" ry="10" fill="#a0522d"/>
    
    <!-- 불빛 (안에서 은은하게 비치는 노란빛 효과) -->
    <ellipse cx="200" cy="155" rx="20" ry="40" fill="#f1c40f" opacity="0.4"/>
    
    <!-- 천 주름 (세로선) -->
    <path d="M175 75 Q170 155 180 238" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
    <path d="M225 75 Q230 155 220 238" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>
</svg>
