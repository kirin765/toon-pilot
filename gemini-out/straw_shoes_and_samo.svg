<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="straw_shoes_and_samo">
    <!-- 반석평의 기적: 벗어 던진 노비의 짚신과 새로 쓴 양반의 벼슬아치 모자(사모) -->
    
    <!-- 밝고 희망찬 푸른 하늘과 궁궐 담장 느낌의 배경 -->
    <rect width="400" height="300" fill="#aed6f1"/>
    <!-- 사선으로 뻗은 빛줄기 (신분 상승을 상징) -->
    <polygon points="0,300 200,0 400,0 200,300" fill="#ebf5fb" opacity="0.5"/>
    
    <!-- 바닥에 내팽개쳐진 낡은 짚신 (과거 노비 신분의 굴레) -->
    <g transform="translate(120, 240) rotate(-20)">
      <!-- 짚신 베이스 -->
      <path d="M-30 0 C-30 -20 30 -20 40 0 C50 20 40 40 20 50 C-10 60 -30 30 -30 0 Z" fill="#d4ac0d" stroke="#b9770e" stroke-width="3"/>
      <!-- 짚신의 그물망(새끼줄) -->
      <path d="M-10 -15 L-10 40 M10 -15 L10 45 M30 -5 L25 40" stroke="#b9770e" stroke-width="2"/>
      <path d="M-25 10 L45 10 M-20 30 L35 30" stroke="#b9770e" stroke-width="2"/>
      <!-- 떨어져 나간 짚풀 조각 -->
      <line x1="-40" y1="-10" x2="-50" y2="-20" stroke="#d4ac0d" stroke-width="2"/>
      <line x1="50" y1="20" x2="60" y2="10" stroke="#d4ac0d" stroke-width="2"/>
    </g>
    
    <g transform="translate(180, 260) rotate(10)">
      <!-- 짚신 한 짝 더 (엎어져 있음) -->
      <path d="M-30 0 C-30 -20 30 -20 40 0 C50 20 40 40 20 50 C-10 60 -30 30 -30 0 Z" fill="#b9770e" stroke="#935116" stroke-width="3"/>
    </g>
    
    <!-- 높은 곳(화면 우측 상단)에 위치한 정1~2품 고위 관료의 뿔 달린 모자 (사모 紗帽) -->
    <g transform="translate(250, 120)">
      <!-- 사모의 둥근 모자 부분 -->
      <path d="M-40 40 C-40 -10 -20 -40 0 -40 C20 -40 40 -10 40 40 Z" fill="#1c2833"/>
      <path d="M-40 40 C-40 60 40 60 40 40 Z" fill="#2c3e50"/>
      <!-- 2단으로 솟은 뒷부분 -->
      <path d="M-20 -40 C-20 -70 20 -70 20 -40 Z" fill="#1c2833"/>
      
      <!-- 사모 양옆에 달린 날개 (각) - 고위 관직을 상징 (크고 둥글게 뻗음) -->
      <!-- 왼쪽 날개 -->
      <path d="M-30 20 Q-80 20 -100 0 Q-120 -20 -90 -40 Q-50 -60 -20 -20" fill="none" stroke="#2c3e50" stroke-width="15" stroke-linecap="round" opacity="0.9"/>
      <!-- 오른쪽 날개 -->
      <path d="M30 20 Q80 20 100 0 Q120 -20 90 -40 Q50 -60 20 -20" fill="none" stroke="#2c3e50" stroke-width="15" stroke-linecap="round" opacity="0.9"/>
      
      <!-- 모자 표면의 섬세한 무늬 (사모의 직물 질감) -->
      <path d="M-30 10 Q0 -10 30 10 M-20 -20 Q0 -40 20 -20" fill="none" stroke="#566573" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- 짚신과 사모를 이어주는 흩날리는 붉은 명주 실 (신분 상승의 연결 고리) -->
    <path d="M120 220 C100 150 150 80 220 100" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5 5"/>
    
  </g>
</svg>
