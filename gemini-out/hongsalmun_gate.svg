<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="hongsalmun_gate">
    <!-- 신성한 공간을 알리는 붉은 문: 홍살문 (Hongsalmun) -->
    
    <!-- 고요하고 성스러운 느낌의 단색 배경 -->
    <rect width="400" height="300" fill="#ecf0f1"/>
    <!-- 바닥 능선 실루엣 -->
    <path d="M0 270 Q200 250 400 280 L400 300 L0 300 Z" fill="#bdc3c7"/>
    
    <!-- 홍살문 전체 구조 -->
    <g transform="translate(200, 260)">
      
      <!-- 양쪽 붉은 둥근 기둥 (원주) -->
      <!-- 왼쪽 기둥 -->
      <rect x="-110" y="-220" width="16" height="220" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      <!-- 원근감/둥근 느낌을 위한 음영 -->
      <rect x="-106" y="-220" width="4" height="220" fill="#e74c3c"/>
      
      <!-- 오른쪽 기둥 -->
      <rect x="94" y="-220" width="16" height="220" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      <rect x="98" y="-220" width="4" height="220" fill="#e74c3c"/>
      
      <!-- 지붕 없는 상단 구조물 -->
      <!-- 아래쪽 가로 인방 (창방) -->
      <rect x="-120" y="-150" width="240" height="12" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      <!-- 위쪽 가로 인방 (평방) -->
      <rect x="-120" y="-190" width="240" height="12" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      
      <!-- 상단을 관통하는 세로 붉은 화살 모양 살창 (살대) -->
      <!-- 홍살문(紅箭門: 붉은 화살 문)의 이름 유래 -->
      <!-- 간격을 두고 촘촘히 꽂힌 화살들 -->
      <!-- 7개의 살대 배치 -->
      
      <g stroke="#c0392b" stroke-width="6" stroke-linecap="round">
        <line x1="-80" y1="-150" x2="-80" y2="-210"/>
        <line x1="-50" y1="-150" x2="-50" y2="-210"/>
        <line x1="-20" y1="-150" x2="-20" y2="-210"/>
        <!-- 가운데 살대는 더 위로 길게 솟아 있음 -->
        <line x1="20" y1="-150" x2="20" y2="-210"/>
        <line x1="50" y1="-150" x2="50" y2="-210"/>
        <line x1="80" y1="-150" x2="80" y2="-210"/>
      </g>
      
      <!-- 화살촉 디테일 (살대 위쪽 끝) -->
      <g fill="#922b21">
        <polygon points="-80,-215 -84,-205 -76,-205"/>
        <polygon points="-50,-215 -54,-205 -46,-205"/>
        <polygon points="-20,-215 -24,-205 -16,-205"/>
        
        <polygon points="20,-215 24,-205 16,-205"/>
        <polygon points="50,-215 54,-205 46,-205"/>
        <polygon points="80,-215 84,-205 76,-205"/>
      </g>
      
      <!-- 정중앙의 가장 높고 화려한 살대와 삼지창 형상 -->
      <line x1="0" y1="-150" x2="0" y2="-230" stroke="#c0392b" stroke-width="8"/>
      <!-- 삼지창 (태극 문양 위로 뻗은 세 갈래 장식) -->
      <path d="M0 -235 L0 -255 M-10 -240 Q-15 -250 -10 -255 M10 -240 Q15 -250 10 -255" fill="none" stroke="#c0392b" stroke-width="4"/>
      <polygon points="0,-260 -4,-250 4,-250" fill="#922b21"/>
      
      <!-- 중앙의 태극 문양 장식 (태극판) -->
      <circle cx="0" cy="-170" r="18" fill="#fdfefe" stroke="#c0392b" stroke-width="3"/>
      <!-- 삼태극 (빨강, 파랑, 노랑) -->
      <!-- 파랑 -->
      <path d="M-15 -178 C-10 -165 5 -165 15 -178 C15 -160 5 -152 0 -152 C-15 -152 -18 -165 -15 -178 Z" fill="#2980b9"/>
      <!-- 빨강 -->
      <path d="M-15 -178 C-10 -195 5 -195 15 -178 C15 -188 5 -188 0 -188 C-15 -188 -18 -188 -15 -178 Z" fill="#c0392b"/>
      <!-- 노랑 -->
      <circle cx="0" cy="-170" r="8" fill="#f1c40f"/>
      
      <!-- 기둥 하단의 주춧돌 (사각의 거친 화강암) -->
      <path d="M-115 0 L-95 0 L-100 -20 L-110 -20 Z" fill="#7f8c8d" stroke="#566573" stroke-width="2"/>
      <path d="M89 0 L109 0 L104 -20 L94 -20 Z" fill="#7f8c8d" stroke="#566573" stroke-width="2"/>
      
    </g>
    
    <!-- 배경 구름 (신성한 공간의 고즈넉함) -->
    <path d="M50 80 Q80 70 120 85 M280 60 Q330 50 380 70" fill="none" stroke="#bdc3c7" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    
  </g>
</svg>
