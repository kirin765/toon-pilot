<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="firefighter_axe_watergun">
    <!-- 배경: 화재 연기를 묘사하는 구름 -->
    <circle cx="100" cy="150" r="50" fill="#7f8c8d" opacity="0.2"/>
    <circle cx="180" cy="120" r="60" fill="#7f8c8d" opacity="0.2"/>
    <circle cx="280" cy="160" r="70" fill="#7f8c8d" opacity="0.2"/>
    
    <!-- 멸화군의 상징 1: 불 끄는 물총 (수총기 / 대나무 물총) -->
    <!-- 굵은 대나무 통 -->
    <g transform="translate(100, 220) rotate(-30)">
      <!-- 대나무 몸통 -->
      <rect x="0" y="-15" width="200" height="30" rx="5" fill="#27ae60"/>
      <!-- 대나무 마디 -->
      <rect x="40" y="-15" width="5" height="30" fill="#1e8449"/>
      <rect x="100" y="-15" width="5" height="30" fill="#1e8449"/>
      <rect x="160" y="-15" width="5" height="30" fill="#1e8449"/>
      
      <!-- 물을 밀어내는 손잡이 기둥 -->
      <rect x="-40" y="-5" width="50" height="10" fill="#d4ac0d"/>
      <rect x="-45" y="-15" width="10" height="30" rx="3" fill="#8b4513"/> <!-- 손잡이 끝부분 -->
      
      <!-- 총구 부분 쇠장식 -->
      <rect x="195" y="-10" width="10" height="20" fill="#7f8c8d"/>
      
      <!-- 뿜어져 나오는 물줄기 -->
      <path d="M210 0 Q250 -10 280 -40" fill="none" stroke="#3498db" stroke-width="8" stroke-linecap="round"/>
      <path d="M210 0 Q240 10 260 -20" fill="none" stroke="#5dade2" stroke-width="5" stroke-linecap="round"/>
      <circle cx="270" cy="-45" r="4" fill="#85c1e9"/>
      <circle cx="285" cy="-35" r="3" fill="#85c1e9"/>
    </g>
    
    <!-- 멸화군의 상징 2: 집을 헐어버리는 방화용 도끼 -->
    <!-- 물총과 교차하게 배치 -->
    <g transform="translate(150, 100) rotate(45)">
      <!-- 긴 나무 자루 -->
      <rect x="0" y="-8" width="180" height="16" fill="#8b4513"/>
      <!-- 나무결 -->
      <path d="M10 -3 L170 -3 M10 3 L170 3" stroke="#5c2e0b" stroke-width="1" opacity="0.6"/>
      
      <!-- 크고 무거운 도끼날 (쇳덩이) -->
      <path d="M130 -8 L130 -30 L170 -40 C180 -20 180 20 170 40 L130 30 L130 8 Z" fill="#34495e"/>
      <path d="M130 -8 L130 -30 L170 -40 C175 -20 175 20 170 40 L130 30 L130 8 Z" fill="none" stroke="#2c3e50" stroke-width="3"/>
      <!-- 도끼날의 뾰족한 은빛 하이라이트 -->
      <path d="M165 -35 C175 -15 175 15 165 35" fill="none" stroke="#bdc3c7" stroke-width="4"/>
      
      <!-- 자루와 도끼날 고정하는 쐐기 -->
      <rect x="140" y="-10" width="10" height="20" fill="#2c3e50"/>
    </g>
    
  </g>
</svg>
