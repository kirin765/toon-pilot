<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="executioner_sword_and_gourd">
    <!-- 처형장 망나니: 피가 묻은 큰 칼과 뿜어내던 술 호리병 -->
    
    <!-- 핏빛 붉은 태양이 지는 서늘한 처형장 배경 -->
    <rect width="400" height="300" fill="#2c3e50"/>
    <circle cx="200" cy="150" r="100" fill="#e74c3c" opacity="0.3" filter="blur(10px)"/>
    
    <!-- 바닥에 꽂힌 낡고 거친 처형도 (망나니의 칼) -->
    <g transform="translate(180, 200) rotate(15)">
      <!-- 칼날 부분 (넓고 투박한 형태) -->
      <path d="M-10 -150 L10 -150 L15 50 L-15 50 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
      <path d="M-10 -150 L0 -170 L10 -150 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/> <!-- 뾰족한 칼끝 -->
      <!-- 날이 이가 빠진 거친 디테일 -->
      <path d="M10 -50 L5 -40 L12 -30" fill="#2c3e50"/>
      <path d="M13 10 L8 20 L14 30" fill="#2c3e50"/>
      
      <!-- 칼날에 묻은 피 -->
      <path d="M-10 -150 Q0 -130 10 -150 Q5 -100 -12 -80 Z" fill="#c0392b" opacity="0.8"/>
      <path d="M-15 0 Q-5 20 -15 40 Z" fill="#c0392b" opacity="0.8"/>
      
      <!-- 칼등 방패 (코등이) -->
      <rect x="-25" y="50" width="50" height="10" rx="3" fill="#795548" stroke="#3e2723" stroke-width="2"/>
      <!-- 낡은 천을 감은 손잡이 -->
      <rect x="-10" y="60" width="20" height="60" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
      <!-- 손잡이 끈(X자 교차) -->
      <path d="M-10 70 L10 80 M-10 80 L10 70 M-10 90 L10 100 M-10 100 L10 90 M-10 110 L10 120 M-10 120 L10 110" stroke="#935116" stroke-width="2"/>
      <!-- 칼끝 장식 고리 (여기에 붉은 천이 매달림) -->
      <circle cx="0" cy="125" r="5" fill="none" stroke="#7f8c8d" stroke-width="3"/>
      <!-- 칼 손잡이에 매달린 피 묻은 붉은 천조각 -->
      <path d="M0 130 Q-20 160 -10 200 Q10 170 0 130 Z" fill="#e74c3c" opacity="0.9"/>
    </g>
    
    <!-- 망나니가 술을 뿜기 위해 들고 마셨던 호리병 (우측 바닥에 나뒹굴고 있음) -->
    <g transform="translate(280, 250) rotate(-110)">
      <!-- 호리병 윗부분 -->
      <circle cx="0" cy="-30" r="15" fill="#f5cba7" stroke="#dc7633" stroke-width="3"/>
      <!-- 호리병 몸통 (아래쪽) -->
      <circle cx="0" cy="10" r="25" fill="#f5cba7" stroke="#dc7633" stroke-width="3"/>
      <!-- 호리병 입구 -->
      <rect x="-8" y="-55" width="16" height="15" fill="#f5cba7" stroke="#dc7633" stroke-width="2"/>
      <!-- 입구를 묶은 새끼줄 끈 -->
      <path d="M-15 -45 L15 -45" stroke="#935116" stroke-width="4"/>
      
      <!-- 쏟아지는 탁주(술)와 피가 섞인 액체 -->
      <path d="M0 -55 Q20 -80 0 -120" fill="none" stroke="#ecf0f1" stroke-width="6" opacity="0.6"/>
      <circle cx="5" cy="-100" r="3" fill="#ecf0f1"/>
    </g>
    
    <!-- 공포감을 극대화하는 허공에 흩뿌려진 붉은 액체(피 혹은 입에서 뿜은 술) 효과 -->
    <circle cx="120" cy="100" r="8" fill="#c0392b" opacity="0.8"/>
    <circle cx="100" cy="120" r="5" fill="#c0392b" opacity="0.7"/>
    <circle cx="140" cy="80" r="4" fill="#c0392b" opacity="0.9"/>
    <path d="M120 100 Q150 150 100 180" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 5" opacity="0.5"/>
    
  </g>
</svg>
