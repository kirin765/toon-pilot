<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="annals">
    <!-- 조선왕조실록(朝鮮王朝實錄) 책자 꾸러미 (사고 보관용 붉은 상자/보자기 위에 놓임) -->
    
    <!-- 실록을 보관하는 나무 궤짝(실록궤) 배경 일부 -->
    <rect width="400" height="300" fill="#a67c52"/>
    <rect x="20" y="20" width="360" height="260" fill="#8b5a2b" rx="10"/>
    <path d="M40 40 L360 40 L360 260 L40 260 Z" fill="#5c3a21"/>
    
    <!-- 궤짝 내부의 붉은 보자기 (실록을 싸는 붉은 천) -->
    <rect x="60" y="60" width="280" height="180" fill="#c0392b" rx="5"/>
    <path d="M60 60 Q200 150 340 60 M60 240 Q200 150 340 240" fill="none" stroke="#a93226" stroke-width="15" opacity="0.4"/>
    
    <!-- 차곡차곡 쌓여 있는 실록 책 3권 -->
    
    <!-- 맨 아래 책 (가장 어두움) -->
    <g transform="translate(200, 200) rotate(-5)">
      <rect x="-100" y="-15" width="200" height="30" fill="#fcf3cf" stroke="#d4ac0d" stroke-width="2" rx="2"/>
      <path d="M-95 -15 L-95 15" stroke="#e67e22" stroke-width="3"/> <!-- 오침안정법 책끈 묶음 표현 1 -->
      <path d="M-80 -15 L-80 15" stroke="#e67e22" stroke-width="3"/> <!-- 묶음 표현 2 -->
      <rect x="-100" y="-20" width="200" height="6" fill="#f5b041" stroke="#d4ac0d" stroke-width="1.5"/> <!-- 표지 두께 -->
    </g>
    
    <!-- 중간 책 -->
    <g transform="translate(190, 175) rotate(2)">
      <rect x="-100" y="-15" width="200" height="30" fill="#fcf3cf" stroke="#d4ac0d" stroke-width="2" rx="2"/>
      <!-- 종이 결 (책장들) -->
      <path d="M-100 -5 L100 -5 M-100 0 L100 0 M-100 5 L100 5" stroke="#f5b041" stroke-width="1.5" opacity="0.6"/>
      <path d="M-95 -15 L-95 15 M-80 -15 L-80 15" stroke="#e67e22" stroke-width="3"/>
      <rect x="-100" y="-20" width="200" height="6" fill="#f5b041" stroke="#d4ac0d" stroke-width="1.5"/>
    </g>
    
    <!-- 맨 위 책 (표지가 잘 보임) -->
    <g transform="translate(210, 145) rotate(-3)">
      <rect x="-100" y="-15" width="200" height="30" fill="#fcf3cf" stroke="#d4ac0d" stroke-width="2" rx="2"/>
      <path d="M-100 -5 L100 -5 M-100 0 L100 0 M-100 5 L100 5" stroke="#f5b041" stroke-width="1.5" opacity="0.6"/>
      
      <!-- 전통 제본 방식 (오침안정법) - 오른쪽(또는 왼쪽) 끝부분을 묶은 붉은 실 -->
      <rect x="75" y="-15" width="25" height="30" fill="#f5b041"/>
      <path d="M80 -15 L80 15 M85 -15 L85 15 M90 -15 L90 15 M95 -15 L95 15" stroke="#c0392b" stroke-width="1.5"/>
      
      <!-- 위 표지 덮개 -->
      <path d="M-100 -25 L100 -25 L100 -15 L-100 -15 Z" fill="#f8c471" stroke="#d4ac0d" stroke-width="2"/>
      
      <!-- 표지 라벨 (책 이름) -->
      <rect x="-30" y="-23" width="60" height="6" fill="#fdfefe" stroke="#b9770e" stroke-width="1"/>
      <!-- '太宗實錄' (태종실록) 한자 간략 표현 -->
      <path d="M-20 -21 L-15 -19 M-10 -21 L-5 -19 M0 -21 L5 -19 M10 -21 L15 -19" stroke="#17202a" stroke-width="1.5"/>
    </g>
    
    <!-- 표지 위 붉은 옥새(국새) 자국 또는 관리인장 -->
    <rect x="230" y="125" width="15" height="10" fill="#e74c3c" opacity="0.8" transform="rotate(-3)"/>
    
    <!-- 흩날리는 나뭇잎 (사고 주변 깊은 산속의 적막함 연출) -->
    <path d="M50 80 Q60 90 70 85 Q65 75 50 80 Z" fill="#27ae60" opacity="0.7"/>
    <path d="M350 220 Q360 210 355 200 Q345 205 350 220 Z" fill="#f39c12" opacity="0.7"/>
    
  </g>
</svg>
