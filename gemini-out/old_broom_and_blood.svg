<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="old_broom_and_blood">
    <!-- 조선 도깨비의 정체: 오니가 아닌 피 묻은 낡은 싸리 빗자루 -->
    
    <!-- 기묘하고 으스스한 도깨비불이 떠도는 한밤중의 버려진 초가집 마당 -->
    <rect width="400" height="300" fill="#17202a"/>
    <!-- 허공에 떠도는 푸른 도깨비불 (인광) -->
    <circle cx="100" cy="100" r="25" fill="#2ecc71" opacity="0.6" filter="blur(5px)"/>
    <circle cx="100" cy="100" r="15" fill="#1abc9c" opacity="0.8"/>
    <path d="M100 100 Q120 70 90 50 Q70 80 100 100 Z" fill="#a3e4d7" opacity="0.9"/>
    
    <circle cx="300" cy="80" r="20" fill="#3498db" opacity="0.6" filter="blur(4px)"/>
    <circle cx="300" cy="80" r="10" fill="#5dade2" opacity="0.8"/>
    <path d="M300 80 Q320 60 290 40 Q280 70 300 80 Z" fill="#d6eaf8" opacity="0.9"/>
    
    <ellipse cx="200" cy="250" rx="150" ry="40" fill="#2c3e50" opacity="0.8"/> <!-- 바닥 그림자 -->
    
    <!-- 마당 구석에 버려진 낡고 해진 싸리 빗자루 (조선 도깨비의 본체) -->
    <g transform="translate(200, 180) rotate(-15)">
      <!-- 빗자루 손잡이 (오래된 나무 막대) -->
      <rect x="-10" y="-120" width="20" height="100" rx="5" fill="#8d6e63" stroke="#4e342e" stroke-width="3"/>
      <line x1="-5" y1="-100" x2="5" y2="-110" stroke="#3e2723" stroke-width="2"/>
      <line x1="-5" y1="-50" x2="5" y2="-60" stroke="#3e2723" stroke-width="2"/>
      
      <!-- 빗자루 솔 윗부분 (짚으로 묶은 곳) -->
      <path d="M-20 -20 C-30 -10 -40 20 -50 60 L50 60 C40 20 30 -10 20 -20 Z" fill="#d5c8a0" stroke="#b9770e" stroke-width="3"/>
      <!-- 빗자루를 동여맨 새끼줄 -->
      <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#935116" stroke-width="3"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#935116" stroke-width="3"/>
      <line x1="-35" y1="10" x2="35" y2="10" stroke="#935116" stroke-width="3"/>
      
      <!-- 해지고 흐트러진 빗자루 가지들 -->
      <path d="M-40 60 Q-60 100 -50 120" fill="none" stroke="#d5c8a0" stroke-width="4" stroke-linecap="round"/>
      <path d="M-20 60 Q-30 110 -10 130" fill="none" stroke="#d5c8a0" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 60 L0 140" fill="none" stroke="#d5c8a0" stroke-width="4" stroke-linecap="round"/>
      <path d="M20 60 Q30 110 10 130" fill="none" stroke="#d5c8a0" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 60 Q60 100 50 120" fill="none" stroke="#d5c8a0" stroke-width="4" stroke-linecap="round"/>
      
      <!-- 도깨비로 변하게 만든 원인: 생리가 묻은(또는 짐승 피가 묻은) 자국 -->
      <path d="M-20 40 Q0 30 10 50 Q0 60 -20 40 Z" fill="#e74c3c" opacity="0.8"/>
      <circle cx="-10" cy="55" r="4" fill="#c0392b"/>
      <circle cx="5" cy="45" r="3" fill="#c0392b"/>
      <ellipse cx="-30" cy="80" rx="8" ry="15" fill="#e74c3c" opacity="0.6" transform="rotate(20 -30 80)"/>
    </g>
    
    <!-- 도깨비가 변신할 때 나타나는 기괴한 안개(요기) 묘사 -->
    <path d="M150 200 Q200 150 250 200 Q220 100 180 120" fill="none" stroke="#1abc9c" stroke-width="8" opacity="0.2" filter="blur(4px)"/>
    
  </g>
</svg>
