<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="apseul_boards_stones">
    <!-- 추국장 모래바닥 그림자 -->
    <ellipse cx="200" cy="270" rx="160" ry="25" fill="#e5e8e8" opacity="0.5"/>
    <ellipse cx="200" cy="265" rx="130" ry="20" fill="#bdc3c7" opacity="0.8"/>
    
    <!-- 바닥에 깔린 깨진 기왓장과 날카로운 자갈들 (무릎에 고통을 주는 용도) -->
    <g id="broken_tiles" transform="translate(180, 250)">
      <path d="M-30 0 L-15 -10 L0 5 Z" fill="#95a5a6"/>
      <path d="M10 -5 L25 5 L15 15 Z" fill="#7f8c8d"/>
      <path d="M-10 10 L-5 20 L5 15 Z" fill="#7f8c8d"/>
      <circle cx="-25" cy="15" r="4" fill="#34495e"/>
      <circle cx="35" cy="0" r="5" fill="#2c3e50"/>
      <circle cx="0" cy="-15" r="6" fill="#34495e"/>
      <!-- 무릎이 으깨진 참혹한 피자국 (명확한 고문의 흔적) -->
      <path d="M-10 5 Q0 15 20 10" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <circle cx="15" cy="5" r="8" fill="#c0392b" opacity="0.7"/>
    </g>
    
    <use href="#broken_tiles" x="-60" y="-10"/>
    <use href="#broken_tiles" x="50" y="5"/>
    
    <!-- 무릎 위를 짓누르는 거칠고 무거운 널빤지 (두 개의 큰 나무판) -->
    <!-- 뒤쪽 널빤지 -->
    <polygon points="70,220 330,190 350,210 90,240" fill="#8b4513" stroke="#5c2e0b" stroke-width="3"/>
    <!-- 앞쪽 널빤지 (엑스 자로 엇갈리거나 겹쳐진 모습) -->
    <polygon points="60,190 310,230 330,250 80,210" fill="#a0522d" stroke="#5c2e0b" stroke-width="3"/>
    
    <!-- 널빤지의 거친 나무 결 -->
    <path d="M90,200 L300,235 M110,215 L280,240" stroke="#5c2e0b" stroke-width="2" opacity="0.6"/>
    
    <!-- 널빤지 위에 올려진 육중한 둥근 돌들 (다리뼈를 산산조각 내는 하중) -->
    <!-- 돌 1 (왼쪽) -->
    <ellipse cx="140" cy="170" rx="45" ry="35" fill="#7f8c8d" transform="rotate(-15, 140, 170)"/>
    <ellipse cx="135" cy="165" rx="35" ry="25" fill="#95a5a6" transform="rotate(-15, 135, 165)"/>
    <path d="M120 150 Q140 140 160 160" fill="none" stroke="#bdc3c7" stroke-width="3"/> <!-- 돌 질감 -->
    
    <!-- 돌 2 (오른쪽 위) -->
    <ellipse cx="260" cy="160" rx="50" ry="40" fill="#34495e" transform="rotate(20, 260, 160)"/>
    <ellipse cx="265" cy="155" rx="40" ry="30" fill="#7f8c8d" transform="rotate(20, 265, 155)"/>
    <path d="M240 140 Q260 130 280 150" fill="none" stroke="#95a5a6" stroke-width="3"/>
    
    <!-- 돌 3 (중앙 꼭대기 - 가장 무거운 놈) -->
    <ellipse cx="200" cy="110" rx="60" ry="45" fill="#2c3e50"/>
    <ellipse cx="195" cy="105" rx="45" ry="35" fill="#34495e"/>
    <path d="M170 85 Q200 70 230 95" fill="none" stroke="#7f8c8d" stroke-width="4"/>
    <circle cx="210" cy="120" r="5" fill="#1a252f"/>
    <circle cx="180" cy="115" r="4" fill="#1a252f"/>
    
    <!-- 고문의 공포를 더하는 포승줄 (돌을 묶거나 주변에 널브러진 밧줄) -->
    <path d="M200 65 Q180 120 220 180" fill="none" stroke="#d4ac0d" stroke-width="6" stroke-linecap="round"/>
    <path d="M200 65 Q180 120 220 180" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2"/>
  </g>
</svg>
