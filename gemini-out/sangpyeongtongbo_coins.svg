<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="sangpyeongtongbo_coins">
    <!-- 조선의 화폐: 엽전(상평통보) 무더기와 닢 -->
    
    <!-- 장터의 낡은 나무 가판대 배경 -->
    <rect width="400" height="300" fill="#a0522d"/>
    <path d="M0 100 L400 100 M0 200 L400 200" stroke="#8b5a2b" stroke-width="4" opacity="0.6"/>
    <!-- 나무결 무늬 -->
    <path d="M50 0 Q70 150 40 300 M150 0 Q130 150 160 300 M250 0 Q270 150 240 300 M350 0 Q330 150 360 300" fill="none" stroke="#8b5a2b" stroke-width="2" opacity="0.4"/>
    
    <!-- 엽전 꾸러미 (새끼줄에 꿰어진 수십 닢의 동전) -->
    <g transform="translate(180, 150) rotate(-15)">
      <!-- 바닥 그림자 -->
      <ellipse cx="0" cy="15" rx="80" ry="30" fill="#5c3a21" opacity="0.8"/>
      
      <!-- 꾸러미를 묶은 거친 짚(새끼) 줄 -->
      <path d="M-90 -10 C-50 20 50 20 90 -10" fill="none" stroke="#d4ac0d" stroke-width="8"/>
      <path d="M-90 -10 C-50 20 50 20 90 -10" fill="none" stroke="#9c640c" stroke-width="2" stroke-dasharray="2,2"/>
      
      <!-- 겹겹이 쌓인 상평통보 뭉치 (입체감을 위해 여러 개 그림) -->
      <!-- 구리의 변색된 색상 (황동, 청동색) -->
      <g fill="#c39bd3" stroke="#5b2c6f" stroke-width="1.5">
        <!-- 뒤쪽 동전들 -->
        <circle cx="-60" cy="-5" r="15" fill="#aeb6bf"/>
        <circle cx="-45" cy="0" r="15" fill="#f5b041"/>
        <circle cx="-30" cy="5" r="15" fill="#aeb6bf"/>
        <circle cx="-15" cy="8" r="15" fill="#f5b041"/>
        <circle cx="0" cy="10" r="15" fill="#aeb6bf"/>
        <circle cx="15" cy="8" r="15" fill="#f5b041"/>
        <circle cx="30" cy="5" r="15" fill="#aeb6bf"/>
        <circle cx="45" cy="0" r="15" fill="#f5b041"/>
        <circle cx="60" cy="-5" r="15" fill="#aeb6bf"/>
        
        <!-- 앞쪽 겹친 동전들 -->
        <circle cx="-70" cy="5" r="15" fill="#d4ac0d"/>
        <circle cx="-55" cy="10" r="15" fill="#b9770e"/>
        <circle cx="-40" cy="14" r="15" fill="#d4ac0d"/>
        <circle cx="-25" cy="17" r="15" fill="#b9770e"/>
        <circle cx="-10" cy="19" r="15" fill="#d4ac0d"/>
        <circle cx="5" cy="19" r="15" fill="#b9770e"/>
        <circle cx="20" cy="17" r="15" fill="#d4ac0d"/>
        <circle cx="35" cy="14" r="15" fill="#b9770e"/>
        <circle cx="50" cy="10" r="15" fill="#d4ac0d"/>
        <circle cx="65" cy="5" r="15" fill="#b9770e"/>
        
        <!-- 맨 앞 동전들 (가운데 구멍이 보임) -->
        <g transform="translate(-15, 25)">
          <circle cx="0" cy="0" r="15" fill="#f1c40f" stroke="#b9770e" stroke-width="2"/>
          <rect x="-4" y="-4" width="8" height="8" fill="#5c3a21"/> <!-- 네모난 구멍 (천원지방) -->
        </g>
        <g transform="translate(15, 23)">
          <circle cx="0" cy="0" r="15" fill="#f39c12" stroke="#b9770e" stroke-width="2"/>
          <rect x="-4" y="-4" width="8" height="8" fill="#5c3a21"/>
        </g>
      </g>
    </g>
    
    <!-- 바닥에 흩어진 낱개 상평통보 (근접 묘사) -->
    <!-- 동전 1 (좌측 하단) -->
    <g transform="translate(80, 240) rotate(10) scale(1.5)">
      <circle cx="0" cy="0" r="20" fill="#f1c40f" stroke="#b9770e" stroke-width="3"/>
      <!-- 테두리 턱 -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#d4ac0d" stroke-width="2"/>
      <!-- 가운데 네모난 구멍 -->
      <rect x="-6" y="-6" width="12" height="12" fill="#5c3a21" stroke="#b9770e" stroke-width="2"/>
      <!-- 상평통보 (常平通寶) 한자 윤곽 묘사 -->
      <!-- 상(常) -->
      <path d="M-3 -15 L3 -15 M0 -15 L0 -9" stroke="#b9770e" stroke-width="1.5"/>
      <!-- 평(平) -->
      <path d="M-3 15 L3 15 M0 15 L0 9" stroke="#b9770e" stroke-width="1.5"/>
      <!-- 통(通) -->
      <path d="M-15 -3 L-15 3 M-15 0 L-9 0" stroke="#b9770e" stroke-width="1.5"/>
      <!-- 보(寶) -->
      <path d="M15 -3 L15 3 M15 0 L9 0" stroke="#b9770e" stroke-width="1.5"/>
    </g>
    
    <!-- 동전 2 (우측 하단) -->
    <g transform="translate(300, 220) rotate(-20) scale(1.3)">
      <circle cx="0" cy="0" r="20" fill="#d4ac0d" stroke="#9c640c" stroke-width="3"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#b9770e" stroke-width="2"/>
      <rect x="-6" y="-6" width="12" height="12" fill="#5c3a21" stroke="#9c640c" stroke-width="2"/>
      <!-- 한자 흔적 -->
      <circle cx="0" cy="-12" r="2" fill="#9c640c"/>
      <circle cx="0" cy="12" r="2" fill="#9c640c"/>
      <circle cx="-12" cy="0" r="2" fill="#9c640c"/>
      <circle cx="12" cy="0" r="2" fill="#9c640c"/>
    </g>
    
    <!-- 동전 3 (우측 상단, 반쯤 빛을 받음) -->
    <g transform="translate(320, 80) rotate(45)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#f5b041" stroke="#d4ac0d" stroke-width="2"/>
      <ellipse cx="0" cy="-2" rx="18" ry="8" fill="#f1c40f"/> <!-- 두께감 -->
      <rect x="-4" y="-3" width="8" height="3" fill="#a0522d"/>
    </g>
    
  </g>
</svg>
