<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="medical_book">
    <!-- 정약용의 마과회통(麻科會通) 등 조선의 낡은 의학 서적 -->
    
    <!-- 낡은 나무 서안(책상) 배경 -->
    <rect width="400" height="300" fill="#a67c52"/>
    <path d="M0 100 Q200 80 400 100 M0 200 Q200 220 400 200" fill="none" stroke="#8b5a2b" stroke-width="6" opacity="0.4"/>
    
    <!-- 펼쳐진 의서 (마과회통 묘사) -->
    <g transform="translate(200, 160)">
      <!-- 책 그림자 -->
      <path d="M-130 -40 L-10 20 L130 -40 L10 100 Z" fill="#5c3a21" opacity="0.6"/>
      
      <!-- 오른쪽 페이지 -->
      <path d="M0 10 Q60 -20 120 -40 L110 60 Q60 80 0 90 Z" fill="#fdfefe" stroke="#d5dbdb" stroke-width="2"/>
      <path d="M0 10 Q60 -10 120 -30 L110 70 Q60 90 0 90 Z" fill="#fcf3cf" stroke="#d5dbdb" stroke-width="2"/>
      
      <!-- 왼쪽 페이지 -->
      <path d="M0 10 Q-60 -20 -120 -40 L-110 60 Q-60 80 0 90 Z" fill="#fdfefe" stroke="#d5dbdb" stroke-width="2"/>
      <path d="M0 10 Q-60 -10 -120 -30 L-110 70 Q-60 90 0 90 Z" fill="#fcf3cf" stroke="#d5dbdb" stroke-width="2"/>
      
      <!-- 중앙 접힌 부분 (책등) -->
      <line x1="0" y1="10" x2="0" y2="90" stroke="#a6acaf" stroke-width="3"/>
      <line x1="-2" y1="12" x2="-2" y2="88" stroke="#8b5a2b" stroke-width="1" opacity="0.5"/>
      <line x1="2" y1="12" x2="2" y2="88" stroke="#8b5a2b" stroke-width="1" opacity="0.5"/>
      
      <!-- 세로쓰기 한자 텍스트 (의서 내용 묘사) -->
      <g stroke="#2c3e50" stroke-width="2" stroke-linecap="round" fill="none">
        <!-- 오른쪽 페이지 글씨 -->
        <path d="M90 -10 Q95 10 90 30 M90 40 Q85 50 90 60"/>
        <path d="M70 -5 Q75 15 70 35 M70 45 Q65 55 70 65"/>
        <path d="M50 0 Q55 20 50 40 M50 50 Q45 60 50 70"/>
        <path d="M30 5 Q35 25 30 45 M30 55 Q25 65 30 75"/>
        
        <!-- 왼쪽 페이지 글씨 -->
        <path d="M-90 -10 Q-95 10 -90 30 M-90 40 Q-85 50 -90 60"/>
        <path d="M-70 -5 Q-75 15 -70 35 M-70 45 Q-65 55 -70 65"/>
        <path d="M-50 0 Q-55 20 -50 40 M-50 50 Q-45 60 -50 70"/>
        
        <!-- 인체 혈자리(또는 발진) 그림 (마진, 천연두 증상 묘사) -->
        <ellipse cx="-25" cy="40" rx="15" ry="25" fill="#f8c471" stroke="#b9770e" stroke-width="1"/>
        <circle cx="-25" cy="20" r="10" fill="#f8c471" stroke="#b9770e" stroke-width="1"/> <!-- 머리 -->
        <line x1="-25" y1="30" x2="-25" y2="60" stroke="#b9770e" stroke-width="1"/> <!-- 중심선 -->
        <!-- 천연두 발진(마마) 자국 붉은 점들 -->
        <circle cx="-25" cy="20" r="1.5" fill="#c0392b" stroke="none"/>
        <circle cx="-30" cy="18" r="1.5" fill="#c0392b" stroke="none"/>
        <circle cx="-20" cy="23" r="1.5" fill="#c0392b" stroke="none"/>
        <circle cx="-28" cy="40" r="1.5" fill="#c0392b" stroke="none"/>
        <circle cx="-20" cy="45" r="1.5" fill="#c0392b" stroke="none"/>
      </g>
      
      <!-- 오래된 종이의 얼룩 -->
      <circle cx="80" cy="50" r="15" fill="#e59866" opacity="0.3" filter="blur(2px)"/>
      <circle cx="-60" cy="-10" r="20" fill="#e59866" opacity="0.2" filter="blur(3px)"/>
    </g>
    
    <!-- 책 옆에 놓인 안경 (실학자의 연구 상징) -->
    <g transform="translate(100, 240) rotate(-20)">
      <!-- 안경알 (둥근 돋보기 형태) -->
      <circle cx="-15" cy="0" r="12" fill="#eaf2f8" stroke="#17202a" stroke-width="2" opacity="0.8"/>
      <circle cx="15" cy="0" r="12" fill="#eaf2f8" stroke="#17202a" stroke-width="2" opacity="0.8"/>
      <!-- 빛 반사 -->
      <path d="M-22 -5 Q-15 -10 -8 -5" fill="none" stroke="#fdfefe" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 -5 Q15 -10 22 -5" fill="none" stroke="#fdfefe" stroke-width="2" stroke-linecap="round"/>
      <!-- 콧등과 안경테 -->
      <path d="M-3 0 Q0 -5 3 0" fill="none" stroke="#17202a" stroke-width="2"/>
      <line x1="-27" y1="0" x2="-45" y2="-10" stroke="#17202a" stroke-width="2"/>
      <line x1="27" y1="0" x2="45" y2="-10" stroke="#17202a" stroke-width="2"/>
    </g>
    
  </g>
</svg>
