<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="moktak">
    <!-- 불교 사찰에서 독경할 때 두드리는 목탁과 채 -->
    
    <!-- 사찰 마루 배경 -->
    <rect width="400" height="300" fill="#d35400"/>
    <path d="M0 50 L400 50 M0 150 L400 150 M0 250 L400 250" stroke="#ba4a00" stroke-width="4" opacity="0.3"/> <!-- 마루 결 -->
    
    <!-- 목탁 그림자 -->
    <ellipse cx="190" cy="210" rx="90" ry="25" fill="#a04000" opacity="0.6"/>
    
    <!-- 목탁 본체 -->
    <g transform="translate(160, 160)">
      
      <!-- 나무결을 살린 둥근 몸통 (대추나무 등으로 깎음) -->
      <circle cx="0" cy="0" r="70" fill="#f39c12" stroke="#b9770e" stroke-width="3"/>
      <!-- 나무 그라데이션 및 질감 (곡선) -->
      <path d="M-50 -40 A70 70 0 0 1 50 40" fill="none" stroke="#e67e22" stroke-width="8" opacity="0.5"/>
      <path d="M-60 -20 A70 70 0 0 1 60 20" fill="none" stroke="#d35400" stroke-width="4" opacity="0.4"/>
      
      <!-- 목탁 손잡이 (위쪽) -->
      <path d="M-30 -60 Q0 -90 30 -60" fill="none" stroke="#b9770e" stroke-width="20" stroke-linecap="round"/>
      <path d="M-30 -60 Q0 -90 30 -60" fill="none" stroke="#f39c12" stroke-width="14" stroke-linecap="round"/>
      <path d="M-30 -60 Q0 -90 30 -60" fill="none" stroke="#fdfefe" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      
      <!-- 소리가 울려 나오는 좌우의 구멍 (눈 부분)과 가로 틈새 (입 부분) -->
      <!-- '물고기'를 상징하여 눈과 입 모양으로 뚫려 있음 -->
      <!-- 왼쪽 눈 구멍 -->
      <circle cx="-35" cy="5" r="8" fill="#5c3a21" stroke="#3e2723" stroke-width="2"/>
      <!-- 오른쪽 눈 구멍 -->
      <circle cx="35" cy="5" r="8" fill="#5c3a21" stroke="#3e2723" stroke-width="2"/>
      
      <!-- 입 (가로 틈새) -->
      <path d="M-35 5 Q0 -10 35 5 Q0 -5 -35 5" fill="#3e2723"/>
      
      <!-- 입에서 아래쪽으로 파인 긴 틈 -->
      <path d="M-15 10 C-10 40 10 40 15 10 C5 35 -5 35 -15 10" fill="#3e2723"/>
      
      <!-- 목탁 표면 광택 -->
      <path d="M-40 -30 A50 50 0 0 1 10 -60" fill="none" stroke="#fdfefe" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
      
    </g>
    
    <!-- 목탁 채 (막대 부분과 솜이나 가죽으로 싼 머리) -->
    <!-- 목탁 옆에 비스듬히 놓여 있음 -->
    <g transform="translate(280, 190) rotate(45)">
      <!-- 채 막대 그림자 -->
      <rect x="-80" y="7" width="100" height="6" fill="#a04000" rx="3" opacity="0.6"/>
      <!-- 막대 -->
      <rect x="-80" y="-3" width="100" height="6" fill="#d4ac0d" stroke="#b9770e" stroke-width="1.5" rx="3"/>
      
      <!-- 두드리는 뭉치 부분 (머리) -->
      <ellipse cx="20" cy="0" rx="15" ry="12" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      <!-- 가죽이나 천의 질감 (바느질 자국) -->
      <path d="M10 -10 A15 12 0 0 0 10 10" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- 그림자 음영 -->
      <ellipse cx="23" cy="3" rx="10" ry="8" fill="#bdc3c7" opacity="0.5"/>
    </g>
    
  </g>
</svg>
