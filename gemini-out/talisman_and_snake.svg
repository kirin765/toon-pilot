<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="talisman_and_snake">
    <!-- 궁궐의 어두운 구석을 상징하는 바닥 그림자 -->
    <ellipse cx="200" cy="240" rx="140" ry="25" fill="#17202a" opacity="0.4"/>
    
    <!-- 압승술(저주/주술)에 사용된 노란색 부적 (Talisman) 2장 -->
    <!-- 바닥에 깔린 부적 -->
    <g transform="translate(160, 230) rotate(-15)">
      <rect x="-30" y="-80" width="60" height="160" fill="#f4d03f" stroke="#d4ac0d" stroke-width="2"/>
      <!-- 주술적 기호 (붉은 주사로 쓴 부적 글씨) -->
      <path d="M-10 -60 Q0 -70 10 -60 Q20 -40 0 -20 Q-20 -10 0 0" fill="none" stroke="#c0392b" stroke-width="4"/>
      <path d="M0 0 Q20 20 -10 40 Q-30 60 10 70" fill="none" stroke="#c0392b" stroke-width="4"/>
      <circle cx="0" cy="0" r="5" fill="#c0392b"/>
      <circle cx="-10" cy="-30" r="3" fill="#c0392b"/>
      <circle cx="10" cy="30" r="3" fill="#c0392b"/>
    </g>
    
    <!-- 겹쳐진 부적 -->
    <g transform="translate(240, 220) rotate(25)">
      <rect x="-30" y="-80" width="60" height="160" fill="#f4d03f" stroke="#d4ac0d" stroke-width="2"/>
      <path d="M-15 -50 L15 -50 M0 -60 L0 -20" stroke="#c0392b" stroke-width="4"/>
      <path d="M-20 -10 Q0 -30 20 -10 Q10 20 -10 40 Q-20 60 15 65" fill="none" stroke="#c0392b" stroke-width="4"/>
      <circle cx="15" cy="65" r="4" fill="#c0392b"/>
    </g>
    
    <!-- 남편의 사랑을 구하기 위해 사용한 기괴한 주술의 상징, 교미하는 뱀의 점액을 담은 작은 도자기 병 -->
    <g transform="translate(100, 200)">
      <ellipse cx="0" cy="20" rx="20" ry="8" fill="#17202a" opacity="0.6"/> <!-- 병 그림자 -->
      <!-- 검은빛/푸른빛 도자기 병 -->
      <path d="M-20 20 C-20 0 -15 -20 -5 -30 L-5 -45 L5 -45 L5 -30 C15 -20 20 0 20 20 Z" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
      <ellipse cx="0" cy="20" rx="20" ry="6" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
      <!-- 병 입구를 막은 붉은 비단과 끈 -->
      <path d="M-10 -45 Q0 -55 10 -45 L15 -35 L-15 -35 Z" fill="#922b21"/>
      <line x1="-15" y1="-35" x2="15" y2="-35" stroke="#f1c40f" stroke-width="2"/>
      
      <!-- 쏟아진 점액 (은밀하고 섬뜩한 액체) -->
      <path d="M10 20 Q40 25 50 40 Q60 50 30 50 Q0 45 10 20 Z" fill="#a3e4d7" opacity="0.7"/>
    </g>
    
    <!-- 부적 위를 기어가는 기분 나쁜 푸른 뱀 (스캔들과 파멸을 상징) -->
    <g transform="translate(200, 160)">
      <!-- 똬리를 튼 몸통 -->
      <path d="M-30 40 C-60 60 0 100 40 70 C70 50 50 10 20 20 C-10 30 -50 0 -20 -30" fill="none" stroke="#1abc9c" stroke-width="14" stroke-linecap="round"/>
      <path d="M-30 40 C-60 60 0 100 40 70 C70 50 50 10 20 20 C-10 30 -50 0 -20 -30" fill="none" stroke="#117864" stroke-width="4" stroke-dasharray="3 5"/> <!-- 뱀피 무늬 -->
      
      <!-- 뱀 머리 (부적을 향해 혓바닥을 날름거림) -->
      <path d="M-20 -30 Q-30 -40 -15 -50 Q-5 -45 -10 -30 Z" fill="#1abc9c"/>
      <circle cx="-18" cy="-40" r="2" fill="#17202a"/> <!-- 눈 -->
      <!-- 갈라진 붉은 혀 -->
      <path d="M-22 -48 Q-30 -55 -28 -60 M-28 -60 L-32 -65 M-28 -60 L-24 -65" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
    </g>
  </g>
</svg>
