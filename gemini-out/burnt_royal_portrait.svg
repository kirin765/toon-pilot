<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="burnt_royal_portrait">
    <!-- 얼굴 없는 왕 철종: 한국전쟁 화재로 오른쪽 절반이 불타 날아간 어진(초상화) -->
    
    <!-- 화재의 참상을 보여주는 잿빛 바닥 배경 -->
    <rect width="400" height="300" fill="#2c3e50"/>
    <circle cx="200" cy="150" r="120" fill="#1a252f" opacity="0.8"/>
    
    <!-- 불타버린 어진(초상화)의 비단 화폭 -->
    <g transform="translate(120, 50)">
      <!-- 족자의 위쪽 나무 축 -->
      <rect x="20" y="0" width="120" height="15" fill="#8b5a2b" stroke="#5c3a21" stroke-width="2"/>
      <circle cx="20" cy="7.5" r="7.5" fill="#f1c40f"/>
      <circle cx="140" cy="7.5" r="7.5" fill="#f1c40f"/>
      
      <!-- 초상화가 그려진 비단 화폭 (왼쪽 부분만 멀쩡함) -->
      <path d="M30 15 L30 200 L120 200 C110 180 140 150 110 120 C140 90 100 60 130 15 Z" fill="#f5eab8" stroke="#d4ac0d" stroke-width="1"/>
      
      <!-- 불타서 날아간 오른쪽 가장자리의 시커먼 그을음과 재 효과 -->
      <path d="M120 200 C100 180 130 150 100 120 C130 90 90 60 130 15 L140 15 L140 200 Z" fill="#111" opacity="0.9"/>
      <path d="M110 190 C90 170 120 140 90 110 C120 80 80 50 120 15 L130 15 L130 200 Z" fill="#c0392b" opacity="0.5"/> <!-- 남은 불씨 -->
      
      <!-- 화폭 안에 희미하게 남아있는 철종의 용포와 옥대 (왼쪽 어깨와 가슴) -->
      <!-- 붉은색 곤룡포 (용 문양 옷) -->
      <path d="M40 130 C60 110 100 120 120 150 L100 200 L40 200 Z" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
      <!-- 용포 어깨에 달린 둥근 금박 용무늬 (보) - 절반만 보임 -->
      <path d="M100 130 A 20 20 0 0 1 120 150 L100 150 Z" fill="#f1c40f"/>
      <!-- 옥대 (허리띠) -->
      <rect x="40" y="180" width="60" height="15" fill="#17202a"/>
      <rect x="50" y="182" width="10" height="11" fill="#f1c40f"/>
      <rect x="70" y="182" width="20" height="11" fill="#f1c40f"/>
      
      <!-- 왕의 얼굴 묘사 (이마와 왼쪽 눈썹까지만 남아있고 오른쪽과 하관은 모두 불탔음) -->
      <path d="M70 70 C80 60 100 60 110 70 L110 100 C100 100 90 90 70 100 Z" fill="#f5cba7"/>
      <!-- 익선관 (왕의 검은 모자) - 왼쪽 뿔만 남음 -->
      <path d="M60 70 C70 40 110 40 120 70 Z" fill="#1c2833"/>
      <path d="M100 40 C110 20 130 10 120 50 Z" fill="#1c2833"/> <!-- 뒤쪽 뿔 -->
      <!-- 근엄한 왼쪽 눈썹 -->
      <path d="M80 80 Q90 75 100 80" fill="none" stroke="#111" stroke-width="2"/>
      
      <!-- 불길에 그을린 연기 -->
      <path d="M130 150 Q160 100 120 50" fill="none" stroke="#111" stroke-width="10" opacity="0.4" filter="blur(3px)"/>
    </g>
    
    <!-- 화재 현장 바닥에 흩날리는 재와 남은 불씨들 -->
    <path d="M220 240 C230 230 250 250 240 220" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="260" cy="200" r="3" fill="#e74c3c" opacity="0.8"/>
    <circle cx="240" cy="180" r="2" fill="#f1c40f" opacity="0.9"/>
    <circle cx="160" cy="250" r="4" fill="#111" opacity="0.8"/>
    <circle cx="140" cy="260" r="3" fill="#111" opacity="0.6"/>
    
    <!-- 허공에 떠다니는 불씨 -->
    <circle cx="280" cy="120" r="2" fill="#e67e22"/>
    <circle cx="300" cy="100" r="3" fill="#f1c40f" opacity="0.7"/>
    
  </g>
</svg>
