<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="deumu_fire_pot">
    <!-- 화마(불귀신)를 막기 위해 궁궐 월대 위에 놓아두던 청동 항아리 '드무' -->
    
    <!-- 궁궐 기단(월대) 돌바닥 배경 -->
    <rect width="400" height="300" fill="#bdc3c7"/>
    <path d="M0 200 L400 200" stroke="#95a5a6" stroke-width="3"/>
    <path d="M100 200 L50 300 M200 200 L200 300 M300 200 L350 300" stroke="#95a5a6" stroke-width="2"/> <!-- 돌바닥 무늬 -->
    
    <!-- 드무 바닥 그림자 -->
    <ellipse cx="200" cy="230" rx="80" ry="20" fill="#7f8c8d" opacity="0.6"/>
    
    <!-- 거대한 청동 솥 '드무' -->
    <g transform="translate(200, 150)">
      
      <!-- 드무 다리 (짐승의 발톱이나 악귀를 쫓는 무늬) 3개 중 앞의 2개 -->
      <path d="M-40 70 L-50 90 L-30 90 Z" fill="#2c3e50" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M40 70 L30 90 L50 90 Z" fill="#2c3e50" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- 육중한 솥 몸통 (무쇠와 청동 질감) -->
      <!-- 위가 넓고 아래가 좁아지는 둥근 형태 -->
      <path d="M-80 -20 C-100 50 -60 80 -30 80 L30 80 C60 80 100 50 80 -20 Z" fill="#34495e" stroke="#17202a" stroke-width="4"/>
      
      <!-- 솥 표면의 청동 녹(구리 녹, 파티나)과 텍스처 -->
      <ellipse cx="-40" cy="30" rx="20" ry="15" fill="#1abc9c" opacity="0.3"/>
      <ellipse cx="30" cy="40" rx="30" ry="20" fill="#1e8449" opacity="0.2"/>
      <path d="M-70 10 C-60 40 -30 60 0 60" fill="none" stroke="#2c3e50" stroke-width="6" opacity="0.8"/>
      
      <!-- 입구 테두리 (입술) -->
      <ellipse cx="0" cy="-20" rx="85" ry="15" fill="#566573" stroke="#17202a" stroke-width="4"/>
      <ellipse cx="0" cy="-20" rx="80" ry="12" fill="#2c3e50"/>
      
      <!-- 솥 안에 담긴 맑은 물 (화마가 자신의 얼굴을 비춰보고 도망가게 함) -->
      <!-- 하늘이 반사된 물빛 -->
      <ellipse cx="0" cy="-17" rx="75" ry="10" fill="#3498db" opacity="0.8"/>
      <!-- 물 표면의 잔물결 빛 반사 -->
      <path d="M-40 -17 L-20 -17 M10 -15 L30 -15" stroke="#fdfefe" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
      
      <!-- 몸통 중앙의 주술적인 문양 (화마를 막는 도깨비 귀면) -->
      <g transform="translate(0, 30) scale(0.6)">
        <circle cx="0" cy="0" r="30" fill="#2c3e50" stroke="#17202a" stroke-width="2"/>
        <!-- 부리부리한 눈 -->
        <circle cx="-10" cy="-5" r="5" fill="#e74c3c"/>
        <circle cx="10" cy="-5" r="5" fill="#e74c3c"/>
        <!-- 이빨을 드러낸 입 -->
        <path d="M-15 10 Q0 20 15 10" fill="none" stroke="#fdfefe" stroke-width="3"/>
        <polygon points="-10,12 -5,17 0,12 5,17 10,12" fill="#fdfefe"/>
      </g>
      
      <!-- 솥을 운반하기 위한 양옆의 무쇠 고리 -->
      <circle cx="-80" cy="10" r="10" fill="none" stroke="#17202a" stroke-width="4"/>
      <circle cx="80" cy="10" r="10" fill="none" stroke="#17202a" stroke-width="4"/>
      
    </g>
  </g>
</svg>
