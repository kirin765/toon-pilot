<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="amisan_chimney">
    <!-- 지대석 (하얀 화강암 받침) -->
    <rect x="150" y="240" width="100" height="30" fill="#bdc3c7"/>
    <rect x="160" y="220" width="80" height="20" fill="#ecf0f1"/>
    
    <!-- 육각형 굴뚝 몸체 (붉은 벽돌) -->
    <polygon points="160,220 240,220 250,70 150,70" fill="#a93226"/>
    <!-- 육각형 입체감을 위한 그림자 면 -->
    <polygon points="160,220 180,220 190,70 150,70" fill="#922b21"/>
    
    <!-- 벽돌 줄눈 무늬 -->
    <line x1="154" y1="100" x2="246" y2="100" stroke="#f5b041" stroke-width="1" opacity="0.5"/>
    <line x1="156" y1="130" x2="244" y2="130" stroke="#f5b041" stroke-width="1" opacity="0.5"/>
    <line x1="158" y1="160" x2="242" y2="160" stroke="#f5b041" stroke-width="1" opacity="0.5"/>
    <line x1="160" y1="190" x2="240" y2="190" stroke="#f5b041" stroke-width="1" opacity="0.5"/>
    
    <!-- 굴뚝 벽면에 조각된 십장생/벽사 무늬 (부조) -->
    <!-- 학 무늬 -->
    <circle cx="200" cy="110" r="15" fill="#fcf3cf"/>
    <path d="M195 110 L205 100 L210 110 Z" fill="#17202a"/> <!-- 새 형상 단순화 -->
    <!-- 박쥐 무늬 (부귀 상징) -->
    <rect x="175" y="140" width="20" height="20" fill="#fcf3cf"/>
    <path d="M175 150 Q185 140 195 150 Q185 160 175 150 Z" fill="#e74c3c"/>
    <!-- 소나무 무늬 -->
    <rect x="205" y="170" width="20" height="30" fill="#fcf3cf"/>
    <circle cx="215" cy="180" r="8" fill="#27ae60"/>
    
    <!-- 연가 (연기가 빠져나가는 점토 지붕) -->
    <polygon points="140,70 260,70 230,40 170,40" fill="#34495e"/>
    <rect x="180" y="20" width="40" height="20" fill="#7f8c8d"/>
    <!-- 지붕 기와 디테일 -->
    <line x1="150" y1="70" x2="180" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <line x1="170" y1="70" x2="195" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <line x1="190" y1="70" x2="205" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <line x1="210" y1="70" x2="215" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <line x1="230" y1="70" x2="225" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <line x1="250" y1="70" x2="235" y2="40" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- 연기 -->
    <path d="M190 20 Q180 -10 210 -20" fill="none" stroke="#bdc3c7" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M210 20 Q220 -10 190 -30" fill="none" stroke="#bdc3c7" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
