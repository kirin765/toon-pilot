<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="seunggyeongdo_game">
    <!-- 벼슬을 올리는 조선판 보드게임: 승경도와 윤목 -->
    
    <!-- 양반집 방 안의 따뜻한 장판 바닥 -->
    <rect width="400" height="300" fill="#f5cba7"/>
    <!-- 한지 장판 무늬 -->
    <line x1="100" y1="0" x2="100" y2="300" stroke="#e59866" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#e59866" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#e59866" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="#e59866" stroke-width="1" opacity="0.5"/>
    
    <!-- 바닥에 넓게 펼쳐진 승경도(종정도) 보드판 -->
    <g transform="translate(200, 150) rotate(-10)">
      <!-- 커다란 종이판 (원근감을 위해 사다리꼴 변형) -->
      <polygon points="-120,-80 120,-80 150,100 -150,100" fill="#fdfefe" stroke="#8b5a2b" stroke-width="3"/>
      <!-- 종이판의 구겨진 주름 -->
      <line x1="-120" y1="-80" x2="-150" y2="100" stroke="#bdc3c7" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="-80" x2="0" y2="100" stroke="#bdc3c7" stroke-width="1" opacity="0.3"/>
      <line x1="120" y1="-80" x2="150" y2="100" stroke="#bdc3c7" stroke-width="1" opacity="0.3"/>
      <line x1="-135" y1="10" x2="135" y2="10" stroke="#bdc3c7" stroke-width="1" opacity="0.3"/>
      
      <!-- 보드판 위에 빼곡하게 그려진 수백 개의 관직 칸 (격자 무늬) -->
      <g stroke="#34495e" stroke-width="1.5" opacity="0.6">
        <!-- 가로선 -->
        <line x1="-125" y1="-50" x2="125" y2="-50"/>
        <line x1="-130" y1="-20" x2="130" y2="-20"/>
        <line x1="-135" y1="10" x2="135" y2="10"/>
        <line x1="-140" y1="40" x2="140" y2="40"/>
        <line x1="-145" y1="70" x2="145" y2="70"/>
        <!-- 세로선 (원근감) -->
        <line x1="-80" y1="-80" x2="-100" y2="100"/>
        <line x1="-40" y1="-80" x2="-50" y2="100"/>
        <line x1="0" y1="-80" x2="0" y2="100"/>
        <line x1="40" y1="-80" x2="50" y2="100"/>
        <line x1="80" y1="-80" x2="100" y2="100"/>
      </g>
      
      <!-- 칸마다 쓰인 벼슬 이름 (한자 흉내) -->
      <!-- 글씨 대신 점과 선으로 기호화 -->
      <g stroke="#17202a" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
        <!-- 맨 꼭대기 (영의정 등 최고 관직) -->
        <path d="M-15 -65 L15 -65 M0 -75 L0 -55" stroke="#c0392b" stroke-width="2"/> <!-- 도착점 강제 강조 -->
        <circle cx="0" cy="-65" r="8" fill="none" stroke="#c0392b" stroke-width="2"/>
        
        <!-- 하위 칸들의 글씨 흔적 -->
        <path d="M-60 -35 L-50 -35 M-55 -40 L-55 -30"/>
        <path d="M-20 -35 L-10 -35 M-15 -40 L-15 -30"/>
        <path d="M20 -35 L30 -35 M25 -40 L25 -30"/>
        <path d="M60 -35 L70 -35 M65 -40 L65 -30"/>
        
        <path d="M-100 25 L-90 25 M-95 20 L-95 30"/>
        <path d="M-60 25 L-50 25 M-55 20 L-55 30"/>
        <path d="M-20 25 L-10 25 M-15 20 L-15 30"/>
        <path d="M20 25 L30 25 M25 20 L25 30"/>
        
        <!-- 맨 아래쪽 (출발점: 유학 등) -->
        <circle cx="-120" cy="85" r="6" fill="#2980b9"/>
      </g>
      
      <!-- 게임판 위의 말 (사람들이 자신의 위치를 표시하는 돌) -->
      <circle cx="-15" cy="25" r="5" fill="#e74c3c" stroke="#111" stroke-width="1"/>
      <circle cx="65" cy="-35" r="5" fill="#27ae60" stroke="#111" stroke-width="1"/>
      <circle cx="-55" cy="55" r="5" fill="#2980b9" stroke="#111" stroke-width="1"/>
      
    </g>
    
    <!-- 굴러가는 윤목 (5각형 또는 육각형의 긴 팽이 모양 주사위) -->
    <!-- 판 바깥 바닥에 굴러가는 모습 -->
    <g transform="translate(100, 220) rotate(30)">
      <!-- 그림자 -->
      <ellipse cx="0" cy="10" rx="30" ry="10" fill="#d35400" opacity="0.6"/>
      
      <!-- 윤목 본체 (나무 조각) -->
      <path d="M-30 0 L-20 -15 L20 -15 L30 0 L20 15 L-20 15 Z" fill="#f1c40f" stroke="#b9770e" stroke-width="2"/>
      
      <!-- 입체감을 위한 모서리 선 -->
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#b9770e" stroke-width="1.5"/>
      <line x1="-20" y1="-15" x2="-20" y2="15" stroke="#b9770e" stroke-width="1.5"/>
      <line x1="20" y1="-15" x2="20" y2="15" stroke="#b9770e" stroke-width="1.5"/>
      
      <!-- 윗면에 새겨진 눈금 (보통 1~5의 숫자가 새겨짐) -->
      <!-- 도, 개, 걸, 윷, 모에 해당하는 눈금 표시 -->
      <!-- 중앙 면에 3개의 점 (걸) 표시 -->
      <circle cx="-10" cy="-7" r="2" fill="#c0392b"/>
      <circle cx="0" cy="-7" r="2" fill="#c0392b"/>
      <circle cx="10" cy="-7" r="2" fill="#c0392b"/>
      
      <!-- 아랫면에 1개의 점 (도) 표시 -->
      <circle cx="0" cy="7" r="2" fill="#2c3e50"/>
    </g>
    
    <!-- 윤목이 굴러가는 궤적 (역동성) -->
    <path d="M40 180 Q70 200 90 215" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    
  </g>
</svg>
