<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="yeonjabanga_mill">
    <!-- 연자방아 (Horse-driven Millstone): 소나 말이 끌어 곡식을 찧는 거대한 둥근 맷돌 -->
    
    <!-- 흙바닥과 시골 마당 배경 -->
    <rect width="400" height="300" fill="#d68910"/>
    <path d="M50 250 Q100 230 150 260 M250 240 Q300 220 350 250" fill="none" stroke="#b9770e" stroke-width="3"/>
    
    <!-- 연자방아의 하단 둥근 돌판 (곡식을 올려놓는 넓은 돌) -->
    <g transform="translate(200, 200)">
      <ellipse cx="0" cy="0" rx="140" ry="45" fill="#7f8c8d" stroke="#566573" stroke-width="4"/>
      <!-- 돌판 두께 -->
      <path d="M-140 0 L-140 15 C-140 60 140 60 140 15 L140 0 Z" fill="#566573"/>
      <!-- 돌판 안쪽 (곡식이 갈리는 움푹 파인 부분) -->
      <ellipse cx="0" cy="0" rx="120" ry="35" fill="#95a5a6"/>
      
      <!-- 빻아지고 있는 곡식 가루들 (노란색/흰색 점들) -->
      <path d="M-80 0 Q-50 -20 0 -10 Q50 0 80 -10 Q30 20 -40 10 Z" fill="#f4d03f" opacity="0.8"/>
      <circle cx="-50" cy="5" r="2" fill="#fdfefe"/>
      <circle cx="20" cy="15" r="3" fill="#fdfefe"/>
      <circle cx="70" cy="-5" r="2" fill="#fdfefe"/>
    </g>
    
    <!-- 연자방아의 중심축 기둥 (나무) -->
    <rect x="185" y="60" width="30" height="150" fill="#8b5a2b" stroke="#5c3a21" stroke-width="2"/>
    <ellipse cx="200" cy="60" rx="15" ry="6" fill="#a0522d"/> <!-- 축 윗면 -->
    
    <!-- 세로로 서서 굴러가는 거대한 돌바퀴 (숫돌) -->
    <!-- 돌바퀴가 중심축에 연결되어 원을 그리며 회전함 -->
    <g transform="translate(130, 150)">
      <!-- 돌바퀴의 입체감 (정면에서 약간 비스듬히 본 모습) -->
      <path d="M-20 -50 C-40 -50 -40 50 -20 50 L20 50 C40 50 40 -50 20 -50 Z" fill="#566573" stroke="#2c3e50" stroke-width="3"/>
      <path d="M-20 -50 C0 -50 0 50 -20 50 Z" fill="#7f8c8d"/> <!-- 둥근 옆면 질감 -->
      
      <!-- 바퀴 중앙을 관통하는 둥근 나무 축 -->
      <circle cx="0" cy="0" r="10" fill="#2c3e50"/>
      
      <!-- 바퀴를 끄는 거대한 가로 나무 틀 (소가 끄는 멍에와 연결됨) -->
      <!-- 가로 막대기 (중심축에서 돌바퀴를 통과해 바깥으로 뻗음) -->
      <path d="M70 0 L-100 0 L-100 10 L70 10 Z" fill="#a0522d" stroke="#5c3a21" stroke-width="2"/>
      <!-- 나무 쐐기로 고정 -->
      <rect x="-15" y="-5" width="4" height="20" fill="#5c3a21"/>
    </g>
    
    <!-- 가로 막대기 끝부분 (이곳에 소를 매달아 빙글빙글 돌게 함) -->
    <path d="M30 150 L30 180" stroke="#5c3a21" stroke-width="4"/>
    <path d="M30 180 Q10 200 -20 200" fill="none" stroke="#2c3e50" stroke-width="4" stroke-dasharray="5 5"/> <!-- 소에 연결된 줄 (가상) -->
    
  </g>
</svg>
