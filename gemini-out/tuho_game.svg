<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="tuho_game">
    <!-- 궁중이나 양반가에서 즐기던 예절 놀이이자 내기, 투호 (Pitch-pot Game) -->
    
    <!-- 잔디가 깔린 궁궐 정원 배경 -->
    <rect width="400" height="300" fill="#a9dfbf"/>
    <!-- 궁궐 담장 실루엣 -->
    <rect x="0" y="0" width="400" height="120" fill="#d35400"/>
    <path d="M0 120 L400 120 M0 125 L400 125" stroke="#ba4a00" stroke-width="2"/>
    <!-- 기와지붕 실루엣 -->
    <path d="M0 80 Q10 70 20 80 T40 80 T60 80 T80 80 T100 80 T120 80 T140 80 T160 80 T180 80 T200 80 T220 80 T240 80 T260 80 T280 80 T300 80 T320 80 T340 80 T360 80 T380 80 T400 80" fill="none" stroke="#2c3e50" stroke-width="6"/>
    
    <!-- 투호 항아리 바닥 그림자 -->
    <ellipse cx="200" cy="240" rx="40" ry="15" fill="#7dcea0" opacity="0.8"/>
    
    <!-- 화살이 꽂힌 청동(또는 놋쇠) 투호 항아리 -->
    <g transform="translate(200, 200)">
      <!-- 항아리의 불룩한 몸통 -->
      <path d="M-30 0 C-40 40 -20 40 0 40 C20 40 40 40 30 0 Z" fill="#b9770e" stroke="#7e5109" stroke-width="3"/>
      
      <!-- 몸통의 둥근 광택 -->
      <path d="M-25 10 C-30 30 -10 35 0 35" fill="none" stroke="#f1c40f" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
      
      <!-- 길고 좁은 목 부분 -->
      <rect x="-15" y="-60" width="30" height="60" fill="#b9770e" stroke="#7e5109" stroke-width="3"/>
      
      <!-- 목 양쪽에 달린 두 개의 둥근 귀 (이곳에 넣으면 점수가 더 높음) -->
      <!-- 왼쪽 귀 -->
      <path d="M-15 -40 L-25 -40 L-25 -20 L-15 -20 Z" fill="#d4ac0d" stroke="#7e5109" stroke-width="3"/>
      <!-- 오른쪽 귀 -->
      <path d="M15 -40 L25 -40 L25 -20 L15 -20 Z" fill="#d4ac0d" stroke="#7e5109" stroke-width="3"/>
      
      <!-- 상단 입구 (화살이 들어가는 곳) -->
      <ellipse cx="0" cy="-60" rx="15" ry="6" fill="#f1c40f" stroke="#7e5109" stroke-width="3"/>
      <ellipse cx="0" cy="-60" rx="10" ry="3" fill="#111"/> <!-- 입구 안쪽 어둠 -->
      
      <!-- 귀 입구의 구멍 -->
      <ellipse cx="-20" cy="-40" rx="5" ry="2" fill="#111"/>
      <ellipse cx="20" cy="-40" rx="5" ry="2" fill="#111"/>
      
      <!-- 항아리에 꽂힌 투호 화살들 -->
      <!-- 화살 1 (가운데 정확히 꽂힘) -->
      <g stroke-linecap="round">
        <line x1="-5" y1="-55" x2="-25" y2="-150" stroke="#8b5a2b" stroke-width="4"/>
        <line x1="-5" y1="-55" x2="-25" y2="-150" stroke="#d4ac0d" stroke-width="1.5"/>
        <!-- 화살 깃 (새의 깃털) -->
        <path d="M-25 -150 L-35 -140 M-20 -140 L-30 -130" stroke="#3498db" stroke-width="3"/>
        <path d="M-25 -150 L-15 -140 M-20 -140 L-10 -130" stroke="#e74c3c" stroke-width="3"/>
      </g>
      
      <!-- 화살 2 (오른쪽 귀에 아슬아슬하게 꽂힘 - 고득점) -->
      <g stroke-linecap="round">
        <line x1="20" y1="-35" x2="50" y2="-120" stroke="#8b5a2b" stroke-width="4"/>
        <!-- 화살 깃 -->
        <path d="M50 -120 L40 -115 M45 -110 L35 -105" stroke="#f1c40f" stroke-width="3"/>
        <path d="M50 -120 L60 -110 M45 -110 L55 -100" stroke="#e74c3c" stroke-width="3"/>
      </g>
      
    </g>
    
    <!-- 바닥에 빗나가 떨어진 화살 (내기에 져서 속상한 상황 암시) -->
    <g transform="translate(120, 260) rotate(70)">
      <ellipse cx="0" cy="5" rx="50" ry="5" fill="#7dcea0" opacity="0.8"/> <!-- 화살 그림자 -->
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#d4ac0d" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 고무 촉 부분 -->
      <circle cx="50" cy="0" r="4" fill="#34495e"/>
      <!-- 화살 깃 -->
      <path d="M-50 0 L-40 10 M-40 0 L-30 10" stroke="#3498db" stroke-width="3"/>
      <path d="M-50 0 L-40 -10 M-40 0 L-30 -10" stroke="#e74c3c" stroke-width="3"/>
    </g>
    
    <!-- 하늘에서 포물선을 그리며 날아오는 화살 궤적 (누군가 던지고 있음) -->
    <path d="M350 50 Q300 -20 230 -10" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>
    <polygon points="230,-10 240,-15 235,-5" fill="#2c3e50" opacity="0.4"/>
    
  </g>
</svg>
