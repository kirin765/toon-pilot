<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="jangseung">
    <!-- 몸통 (나무 기둥) -->
    <rect x="150" y="80" width="100" height="200" fill="#a0522d"/>
    <path d="M150 80 Q200 60 250 80" fill="#a0522d"/>
    
    <!-- 얼굴 윤곽선 (나뭇결 표현) -->
    <path d="M160 100 L160 270 M240 100 L240 270" stroke="#8b4513" stroke-width="4" stroke-linecap="round"/>
    
    <!-- 커다란 왕방울 눈 -->
    <circle cx="175" cy="120" r="15" fill="#ffffff"/>
    <circle cx="175" cy="120" r="6" fill="#000000"/>
    <circle cx="225" cy="120" r="15" fill="#ffffff"/>
    <circle cx="225" cy="120" r="6" fill="#000000"/>
    
    <!-- 사나운 눈썹 -->
    <path d="M155 100 L195 110" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M245 100 L205 110" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 크고 주먹만한 코 -->
    <ellipse cx="200" cy="150" rx="15" ry="20" fill="#8b4513"/>
    <ellipse cx="185" cy="160" rx="10" ry="10" fill="#8b4513"/>
    <ellipse cx="215" cy="160" rx="10" ry="10" fill="#8b4513"/>
    
    <!-- 이빨을 드러낸 큰 입 -->
    <rect x="160" y="180" width="80" height="30" fill="#ffffff" rx="10"/>
    <rect x="170" y="185" width="60" height="20" fill="#000000"/>
    <!-- 덧니 (송곳니) -->
    <polygon points="175,185 185,185 180,210" fill="#ffffff"/>
    <polygon points="225,185 215,185 220,210" fill="#ffffff"/>
    
    <!-- 글귀 (천하대장군) -->
    <rect x="170" y="225" width="60" height="50" fill="#f5deb3"/>
    <path d="M180 235 L190 235 M185 230 L185 245 M210 235 L220 235 M215 230 L215 245" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
