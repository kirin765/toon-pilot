<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="bomb_and_shrapnel">
    <!-- 조선의 시한폭탄 비격진천뢰: 폭발하는 둥근 무쇠 공과 파편(마름쇠) -->
    
    <!-- 격렬한 전장의 붉은 섬광 배경 -->
    <rect width="400" height="300" fill="#341c1c"/>
    <!-- 거대한 폭발을 암시하는 주황빛 배경 그라데이션 효과 (벡터 도형 겹침) -->
    <circle cx="200" cy="150" r="180" fill="#a04000" opacity="0.3"/>
    <circle cx="200" cy="150" r="120" fill="#d35400" opacity="0.4"/>
    <circle cx="200" cy="150" r="80" fill="#e67e22" opacity="0.5"/>
    
    <!-- 폭발 직전~진행 중인 둥근 무쇠 폭탄 (비격진천뢰) -->
    <g transform="translate(200, 150)">
      <!-- 폭발로 인해 쪼개지는 무쇠 공의 본체 파편들 -->
      <path d="M-60 0 A60 60 0 0 1 0 -60 L-10 -20 Z" fill="#2c3e50" stroke="#1a252f" stroke-width="3"/>
      <path d="M0 -60 A60 60 0 0 1 60 0 L20 -10 Z" fill="#34495e" stroke="#1a252f" stroke-width="3"/>
      <path d="M60 0 A60 60 0 0 1 0 60 L10 20 Z" fill="#2c3e50" stroke="#1a252f" stroke-width="3"/>
      <path d="M0 60 A60 60 0 0 1 -60 0 L-20 10 Z" fill="#34495e" stroke="#1a252f" stroke-width="3"/>
      
      <!-- 중심부 폭발 화염 -->
      <path d="M0 0 L30 -50 L10 -10 L60 -20 L20 10 L50 40 L10 20 L-20 60 L-10 10 L-60 -10 L-20 -20 L-40 -50 Z" fill="#f1c40f"/>
      <path d="M0 0 L15 -25 L5 -5 L30 -10 L10 5 L25 20 L5 10 L-10 30 L-5 5 L-30 -5 L-10 -10 Z" fill="#fff"/>
      
      <!-- 도화선을 감았던 핵심 부품: 목곡 (나선형 홈이 파인 나무통 파편) -->
      <g transform="translate(-40, -40) rotate(-30)">
        <rect x="-10" y="-20" width="20" height="40" fill="#935116"/>
        <line x1="-10" y1="-10" x2="10" y2="-5" stroke="#111" stroke-width="2"/>
        <line x1="-10" y1="0" x2="10" y2="5" stroke="#111" stroke-width="2"/>
        <line x1="-10" y1="10" x2="10" y2="15" stroke="#111" stroke-width="2"/>
      </g>
    </g>
    
    <!-- 사방으로 무자비하게 튀어나가는 살상용 파편 (마름쇠와 철조각) -->
    <!-- 마름쇠 1 (네 개의 날카로운 가시가 달린 철 흉기) -->
    <g transform="translate(100, 80) rotate(45)">
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#bdc3c7" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#bdc3c7" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#7f8c8d"/>
      <!-- 운동선 (빠르게 날아감) -->
      <line x1="20" y1="20" x2="60" y2="60" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- 마름쇠 2 -->
    <g transform="translate(300, 220) rotate(20)">
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#bdc3c7" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#bdc3c7" stroke-width="3" stroke-linecap="round"/>
      <line x1="-30" y1="-30" x2="-80" y2="-80" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- 마름쇠 3 -->
    <g transform="translate(320, 90) rotate(70)">
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#bdc3c7" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#bdc3c7" stroke-width="3" stroke-linecap="round"/>
      <line x1="-20" y1="30" x2="-60" y2="70" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- 불규칙한 무쇠 쇳조각들 -->
    <polygon points="120,240 130,230 140,250 120,260" fill="#7f8c8d"/>
    <polygon points="80,150 90,140 100,160" fill="#95a5a6"/>
    <polygon points="250,60 270,50 280,70" fill="#7f8c8d"/>
    
    <!-- 폭발 궤적 선들 -->
    <path d="M200 150 L50 50 M200 150 L350 250 M200 150 L350 50 M200 150 L50 250" stroke="#f39c12" stroke-width="1" opacity="0.4" stroke-dasharray="10 10"/>
    
  </g>
</svg>
