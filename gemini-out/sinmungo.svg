<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="sinmungo">
    <!-- 북 받침대 그림자 -->
    <ellipse cx="200" cy="270" rx="100" ry="20" fill="#2c3e50" opacity="0.3"/>
    
    <!-- 북 받침대 (나무 프레임) -->
    <rect x="130" y="240" width="140" height="20" fill="#8b4513"/>
    <path d="M140 260 L120 280 M260 260 L280 280" stroke="#8b4513" stroke-width="15" stroke-linecap="round"/>
    <path d="M120 180 L140 240 M280 180 L260 240" stroke="#a0522d" stroke-width="15" stroke-linecap="round"/>
    
    <!-- 북통 (옆면) -->
    <ellipse cx="200" cy="150" rx="90" ry="110" fill="#c0392b"/>
    <ellipse cx="200" cy="150" rx="80" ry="100" fill="#e74c3c"/>
    <!-- 북통 무늬 (태극 무늬나 단청 느낌의 곡선) -->
    <path d="M125 150 Q200 220 275 150" stroke="#f1c40f" stroke-width="4" fill="none"/>
    <path d="M135 120 Q200 180 265 120" stroke="#2980b9" stroke-width="4" fill="none"/>
    
    <!-- 북면 (소가죽) -->
    <ellipse cx="200" cy="150" rx="60" ry="85" fill="#f5deb3"/>
    <ellipse cx="200" cy="150" rx="50" ry="75" fill="#e6ccb2"/>
    
    <!-- 태극 무늬 (북면 중앙) -->
    <g transform="translate(200, 150) scale(0.6)">
      <circle cx="0" cy="0" r="40" fill="#e74c3c"/>
      <path d="M-40 0 A 20 20 0 0 1 0 0 A 20 20 0 0 0 40 0 A 40 40 0 0 1 -40 0" fill="#2980b9"/>
    </g>
    
    <!-- 북 징 (가죽을 고정하는 못) -->
    <!-- 위쪽 절반 -->
    <circle cx="200" cy="65" r="3" fill="#34495e"/>
    <circle cx="170" cy="72" r="3" fill="#34495e"/>
    <circle cx="230" cy="72" r="3" fill="#34495e"/>
    <circle cx="145" cy="95" r="3" fill="#34495e"/>
    <circle cx="255" cy="95" r="3" fill="#34495e"/>
    <!-- 중간 -->
    <circle cx="140" cy="150" r="3" fill="#34495e"/>
    <circle cx="260" cy="150" r="3" fill="#34495e"/>
    <!-- 아래쪽 절반 -->
    <circle cx="200" cy="235" r="3" fill="#34495e"/>
    <circle cx="170" cy="228" r="3" fill="#34495e"/>
    <circle cx="230" cy="228" r="3" fill="#34495e"/>
    <circle cx="145" cy="205" r="3" fill="#34495e"/>
    <circle cx="255" cy="205" r="3" fill="#34495e"/>
    
    <!-- 북채 (나무 막대기) -->
    <path d="M300 230 L350 150" stroke="#cd853f" stroke-width="12" stroke-linecap="round"/>
    <circle cx="350" cy="150" r="10" fill="#8b4513"/>
  </g>
</svg>
