<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="empty_cauldron">
    <!-- 바닥 그림자 -->
    <ellipse cx="200" cy="250" rx="120" ry="20" fill="#2c3e50" opacity="0.3"/>
    
    <!-- 아궁이 (불 꺼진 차가운 돌) -->
    <path d="M120 250 Q160 220 200 250 Q240 220 280 250 L260 280 L140 280 Z" fill="#7f8c8d"/>
    <path d="M130 255 Q160 230 200 255 Q240 230 270 255" fill="none" stroke="#34495e" stroke-width="4"/>
    
    <!-- 장작 (불이 붙지 않은 앙상한 나뭇가지들) -->
    <path d="M160 260 L240 270" stroke="#5c2e0b" stroke-width="8" stroke-linecap="round"/>
    <path d="M170 270 L230 260" stroke="#4a2311" stroke-width="6" stroke-linecap="round"/>
    <path d="M190 255 L210 275" stroke="#3e2723" stroke-width="7" stroke-linecap="round"/>
    
    <!-- 거대한 무쇠 가마솥 (텅 비고 차가운 느낌) -->
    <path d="M80 140 C80 250 320 250 320 140 Z" fill="#2c3e50"/>
    <path d="M90 140 C90 235 310 235 310 140 Z" fill="#34495e"/>
    
    <!-- 가마솥의 두꺼운 테두리 (전) -->
    <ellipse cx="200" cy="140" rx="130" ry="30" fill="#2c3e50"/>
    <ellipse cx="200" cy="140" rx="120" ry="25" fill="#1a252f"/>
    
    <!-- 솥 내부 (아무것도 없는 시커먼 바닥) -->
    <ellipse cx="200" cy="140" rx="110" ry="20" fill="#0d1317"/>
    
    <!-- 솥단지 손잡이 -->
    <path d="M60 140 Q50 160 70 170" fill="none" stroke="#2c3e50" stroke-width="15" stroke-linecap="round"/>
    <path d="M340 140 Q350 160 330 170" fill="none" stroke="#2c3e50" stroke-width="15" stroke-linecap="round"/>
    
    <!-- 거미줄 (오랫동안 밥을 짓지 못함을 상징) -->
    <path d="M110 130 L160 160" stroke="#bdc3c7" stroke-width="1" opacity="0.5"/>
    <path d="M120 120 L150 155" stroke="#bdc3c7" stroke-width="1" opacity="0.5"/>
    <path d="M130 110 L140 150" stroke="#bdc3c7" stroke-width="1" opacity="0.5"/>
    <path d="M115 130 Q130 140 145 135" fill="none" stroke="#bdc3c7" stroke-width="1" opacity="0.5"/>
    <path d="M125 140 Q140 150 155 145" fill="none" stroke="#bdc3c7" stroke-width="1" opacity="0.5"/>
    
    <!-- 바닥에 떨어진 마른 뼈 한 조각 (기근과 죽음 상징) -->
    <path d="M260 260 Q270 250 280 265 Q290 250 285 270 Q280 280 270 270 Q260 280 255 265 Z" fill="#ecf0f1" opacity="0.8" transform="rotate(20 270 260)"/>
  </g>
</svg>
