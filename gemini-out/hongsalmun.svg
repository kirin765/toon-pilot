<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="hongsalmun">
    <!-- 두 개의 둥근 기둥 -->
    <rect x="70" y="80" width="30" height="220" fill="#c0392b"/>
    <rect x="300" y="80" width="30" height="220" fill="#c0392b"/>
    
    <!-- 둥근 기둥의 입체감 (어두운 부분) -->
    <rect x="90" y="80" width="10" height="220" fill="#a93226"/>
    <rect x="320" y="80" width="10" height="220" fill="#a93226"/>
    
    <!-- 아래쪽 가로목 -->
    <rect x="50" y="100" width="300" height="20" fill="#c0392b"/>
    
    <!-- 위쪽 가로목 (두 줄) -->
    <rect x="50" y="70" width="300" height="20" fill="#c0392b"/>
    
    <!-- 세로 살대 (홍살) -->
    <rect x="110" y="20" width="10" height="80" fill="#c0392b"/>
    <polygon points="110,20 115,10 120,20" fill="#c0392b"/>
    
    <rect x="140" y="15" width="10" height="85" fill="#c0392b"/>
    <polygon points="140,15 145,5 150,15" fill="#c0392b"/>
    
    <rect x="170" y="10" width="10" height="90" fill="#c0392b"/>
    <polygon points="170,10 175,0 180,10" fill="#c0392b"/>
    
    <rect x="220" y="10" width="10" height="90" fill="#c0392b"/>
    <polygon points="220,10 225,0 230,10" fill="#c0392b"/>
    
    <rect x="250" y="15" width="10" height="85" fill="#c0392b"/>
    <polygon points="250,15 255,5 260,15" fill="#c0392b"/>
    
    <rect x="280" y="20" width="10" height="80" fill="#c0392b"/>
    <polygon points="280,20 285,10 290,20" fill="#c0392b"/>
    
    <!-- 중앙 태극 문양 -->
    <circle cx="200" cy="85" r="25" fill="#ffffff"/>
    <path d="M 200 60 A 12.5 12.5 0 0 1 200 85 A 12.5 12.5 0 0 0 200 110 A 25 25 0 0 1 200 60 Z" fill="#e74c3c"/>
    <path d="M 200 60 A 25 25 0 0 0 200 110 A 12.5 12.5 0 0 1 200 85 A 12.5 12.5 0 0 0 200 60 Z" fill="#3498db"/>
  </g>
</svg>
