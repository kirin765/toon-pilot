<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="secret_letter_lee_ye">
    <!-- 이예의 포로 구출: 비밀 서찰과 밧줄 -->
    
    <!-- 어두운 일본 왜구 소굴의 바닥 (목재 바닥 텍스처) -->
    <rect width="400" height="300" fill="#2e1a10"/>
    <path d="M0 50 L400 50 M0 100 L400 100 M0 150 L400 150 M0 200 L400 200 M0 250 L400 250" stroke="#1f1008" stroke-width="2"/>
    <path d="M100 0 L100 100 M200 50 L200 150 M300 100 L300 200 M150 150 L150 250 M250 200 L250 300" stroke="#1f1008" stroke-width="2"/>
    
    <!-- 조선인 포로 구출을 위해 끊어낸 굵은 밧줄 -->
    <path d="M-50 250 Q100 280 180 150" fill="none" stroke="#d4ac0d" stroke-width="15" stroke-linecap="round"/>
    <path d="M-50 250 Q100 280 180 150" fill="none" stroke="#9a7d0a" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 4"/> <!-- 밧줄 결 -->
    
    <path d="M220 100 Q300 30 450 50" fill="none" stroke="#d4ac0d" stroke-width="15" stroke-linecap="round"/>
    <path d="M220 100 Q300 30 450 50" fill="none" stroke="#9a7d0a" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 4"/>
    
    <!-- 밧줄이 끊긴 단면 (올이 풀린 모습) -->
    <g transform="translate(180, 150)">
      <path d="M0 0 L20 -10 M0 0 L15 -20 M0 0 L25 -5 M0 0 L5 -25" stroke="#d4ac0d" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(220, 100)">
      <path d="M0 0 L-20 10 M0 0 L-15 20 M0 0 L-25 5 M0 0 L-5 25" stroke="#d4ac0d" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- 바닥에 놓인 조선 임금(세종)의 밀명 서찰 (둘둘 말린 한지가 반쯤 펴짐) -->
    <g transform="translate(200, 180) rotate(-20)">
      <!-- 서찰 본체 -->
      <polygon points="-80,-40 60,-50 80,40 -60,50" fill="#f5eec8" stroke="#a0855b" stroke-width="2"/>
      <!-- 말려있는 끝부분 -->
      <path d="M-60 50 C-80 50 -90 10 -80 -40 C-70 -20 -60 20 -60 50 Z" fill="#eaddbd" stroke="#a0855b" stroke-width="2"/>
      
      <!-- 붉은 왕의 어보(도장) 찍힌 자국 -->
      <rect x="20" y="5" width="25" height="25" fill="#e74c3c" opacity="0.9"/>
      <path d="M25 10 L40 10 M32 10 L32 25 M25 18 L40 18" stroke="#f5eec8" stroke-width="2"/>
      
      <!-- 흘림체로 적힌 비밀 지령 (구출 암호) -->
      <path d="M-30 -20 L-10 -15 M-25 -5 L-5 0 M-20 10 L0 15" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
      <path d="M10 -25 L30 -20 M15 -10 L35 -5" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- 어둠 속에서 빛나는 조선 호위무사의 짧은 은장도(단도) - 밧줄을 자른 칼 -->
    <g transform="translate(100, 100) rotate(45)">
      <polygon points="-60,-10 30,-5 50,0 30,5 -60,10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      <path d="M-60 0 L30 0" stroke="#bdc3c7" stroke-width="2"/> <!-- 칼등 -->
      <!-- 검은 옻칠 손잡이 -->
      <rect x="-100" y="-12" width="40" height="24" rx="3" fill="#111" stroke="#333" stroke-width="2"/>
      <!-- 황동 코등이 -->
      <rect x="-64" y="-16" width="8" height="32" rx="2" fill="#d4ac0d"/>
    </g>
    
  </g>
</svg>
