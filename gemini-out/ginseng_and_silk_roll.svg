<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="ginseng_and_silk_roll">
    <!-- 역관의 팔포무역: 조선의 커다란 인삼(홍삼)과 청나라 비단 두루마리 -->
    
    <!-- 부유함을 상징하는 고급스러운 붉은색/금색 톤 배경 -->
    <rect width="400" height="300" fill="#7b241c"/>
    <circle cx="200" cy="150" r="120" fill="#922b21" opacity="0.5"/>
    
    <!-- 청나라에서 수입한 고급 비단 두루마리 (좌측 뒤편) -->
    <g transform="translate(130, 180) rotate(-20)">
      <!-- 비단 롤의 옆면(둥근 심지 부분) -->
      <ellipse cx="-40" cy="-60" rx="30" ry="15" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2" transform="rotate(30 -40 -60)"/>
      <ellipse cx="-40" cy="-60" rx="10" ry="5" fill="#9a7d0a" transform="rotate(30 -40 -60)"/> <!-- 나무 심지 구멍 -->
      
      <!-- 펼쳐져 흘러내리는 비단 천 (청색 바탕에 금박 무늬) -->
      <path d="M-60 -50 C-100 20 -40 100 20 120 C60 120 100 80 80 0 C60 -80 -20 -100 -60 -50 Z" fill="#2874a6" stroke="#1f618d" stroke-width="4"/>
      <!-- 비단 표면의 금박 당초무늬 (간략화된 패턴) -->
      <path d="M-40 0 Q-20 40 20 20 T60 60" fill="none" stroke="#f1c40f" stroke-width="3" opacity="0.8"/>
      <path d="M-20 -40 Q0 0 40 -20 T80 20" fill="none" stroke="#f1c40f" stroke-width="3" opacity="0.8"/>
      <circle cx="10" cy="20" r="5" fill="#f39c12"/>
      <circle cx="30" cy="-10" r="5" fill="#f39c12"/>
    </g>
    
    <!-- 청나라에서 수입한 붉은 비단 두루마리 하나 더 -->
    <g transform="translate(260, 120) rotate(15)">
      <ellipse cx="0" cy="0" rx="25" ry="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="#641e16"/>
      <path d="M-25 0 L-25 120 C0 140 25 140 25 120 L25 0 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <!-- 무늬 -->
      <line x1="-15" y1="20" x2="15" y2="40" stroke="#f1c40f" stroke-width="4"/>
      <line x1="-15" y1="60" x2="15" y2="80" stroke="#f1c40f" stroke-width="4"/>
      <line x1="-15" y1="100" x2="15" y2="120" stroke="#f1c40f" stroke-width="4"/>
    </g>
    
    <!-- 무역의 핵심 수출품: 거대한 조선 인삼 (홍삼, 우측 앞면) -->
    <g transform="translate(220, 200) rotate(10)">
      <!-- 인삼의 뇌두(머리 부분) -->
      <path d="M-10 -70 Q0 -90 10 -70 L5 -50 Z" fill="#e67e22" stroke="#d35400" stroke-width="3"/>
      <!-- 인삼 몸통 (사람 모양) -->
      <path d="M-15 -50 C-40 -20 -30 40 -40 80 C-10 60 0 30 0 0 C0 30 20 60 40 70 C30 30 30 -20 15 -50 Z" fill="#f39c12" stroke="#d35400" stroke-width="4"/>
      
      <!-- 인삼 뿌리 (잔뿌리들) -->
      <path d="M-40 80 Q-60 100 -50 120" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
      <path d="M-30 70 Q-20 110 -10 130" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
      <path d="M40 70 Q60 100 50 120" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 50 Q30 90 40 110" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
      
      <!-- 인삼 표면의 주름(나이테 무늬) -->
      <path d="M-10 -30 Q0 -20 10 -30 M-15 -10 Q0 0 15 -10 M-20 10 Q-10 20 0 10 M5 15 Q15 25 20 15" fill="none" stroke="#d35400" stroke-width="2"/>
    </g>
    
  </g>
</svg>
