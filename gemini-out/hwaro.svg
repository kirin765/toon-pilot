<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="hwaro">
    <!-- 화로 바닥 그림자 -->
    <ellipse cx="200" cy="260" rx="110" ry="25" fill="#2c3e50" opacity="0.3"/>
    
    <!-- 화로 다리 (무쇠) -->
    <path d="M130 220 L110 260 L140 260 Z" fill="#2c3e50"/>
    <path d="M200 230 L190 270 L210 270 Z" fill="#2c3e50"/>
    <path d="M270 220 L260 260 L290 260 Z" fill="#2c3e50"/>
    
    <!-- 화로 몸통 (팔각형 놋쇠 화로 느낌) -->
    <path d="M100 130 L300 130 L270 230 L130 230 Z" fill="#d35400"/>
    <!-- 명암 / 각진 면 -->
    <polygon points="130,230 180,230 150,130 100,130" fill="#e67e22"/>
    <polygon points="270,230 220,230 250,130 300,130" fill="#a04000"/>
    
    <!-- 화로 위 테두리 (전) -->
    <ellipse cx="200" cy="130" rx="110" ry="30" fill="#e67e22"/>
    <ellipse cx="200" cy="130" rx="90" ry="20" fill="#873600"/> <!-- 안쪽 구멍 -->
    
    <!-- 숯과 불씨 -->
    <ellipse cx="180" cy="130" rx="15" ry="10" fill="#17202a"/>
    <ellipse cx="220" cy="125" rx="20" ry="12" fill="#17202a"/>
    <ellipse cx="200" cy="135" rx="18" ry="10" fill="#17202a"/>
    <ellipse cx="160" cy="125" rx="12" ry="8" fill="#17202a"/>
    
    <!-- 붉은 불빛 (숯이 달아오른 모습) -->
    <circle cx="180" cy="130" r="6" fill="#e74c3c"/>
    <circle cx="215" cy="125" r="8" fill="#f39c12"/>
    <circle cx="200" cy="135" r="7" fill="#e74c3c"/>
    <circle cx="165" cy="125" r="4" fill="#f1c40f"/>
    
    <!-- 부지깽이 (재 젓는 막대) -->
    <path d="M280 60 L220 130" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round"/>
    <path d="M290 50 L280 60" stroke="#8b4513" stroke-width="12" stroke-linecap="round"/> <!-- 손잡이 -->
  </g>
</svg>
