<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="shovel_and_mud">
    <!-- 영조 청계천 준천 공사: 커다란 나무 삽, 흙더미, 그리고 준천 푯말 -->
    
    <!-- 맑은 하늘과 진흙빛 땅 (치수 사업의 현장) -->
    <rect width="400" height="300" fill="#85c1e9"/>
    <!-- 물이 말라 드러난 청계천 바닥 -->
    <path d="M0 150 Q200 120 400 160 L400 300 L0 300 Z" fill="#d35400"/>
    <path d="M0 180 Q200 150 400 190 L400 300 L0 300 Z" fill="#a04000"/>
    
    <!-- 파낸 막대한 양의 흙더미 (수십 년간 쌓였던 토사) -->
    <path d="M150 300 C150 200 250 150 350 200 C380 220 400 260 400 300 Z" fill="#873600"/>
    <path d="M50 300 C50 240 120 200 200 250 C230 270 250 300 250 300 Z" fill="#6e2c00"/>
    
    <!-- 흙더미에 꽂혀 있는 커다란 조선 시대 삽 (가래/나무 삽) -->
    <g transform="translate(280, 200) rotate(20)">
      <!-- 나무 자루 -->
      <rect x="-8" y="-120" width="16" height="150" fill="#f39c12" stroke="#b9770e" stroke-width="2"/>
      <!-- 손잡이 부분 (T자형) -->
      <rect x="-25" y="-120" width="50" height="12" rx="4" fill="#f39c12" stroke="#b9770e" stroke-width="2"/>
      <!-- 삽날 (철로 덧댄 넓은 나무판) -->
      <path d="M-25 30 L25 30 L20 80 C10 90 -10 90 -20 80 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="3"/>
      <!-- 삽날과 자루 고정 끈 -->
      <path d="M-15 35 L15 45 M-15 45 L15 55" stroke="#333" stroke-width="3"/>
    </g>
    
    <!-- 영조의 국가 프로젝트를 알리는 '준천(濬川)' 푯말 -->
    <g transform="translate(100, 200)">
      <!-- 나무 기둥 -->
      <rect x="-10" y="-80" width="20" height="100" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="2"/>
      <!-- 나무판 -->
      <rect x="-50" y="-120" width="100" height="50" fill="#f5b041" stroke="#b9770e" stroke-width="3"/>
      <!-- 푯말 박은 못 -->
      <circle cx="-40" cy="-110" r="2" fill="#111"/>
      <circle cx="40" cy="-110" r="2" fill="#111"/>
      <circle cx="-40" cy="-80" r="2" fill="#111"/>
      <circle cx="40" cy="-80" r="2" fill="#111"/>
      
      <!-- 붓글씨 '준천' (한자 濬川 간략화 묘사) -->
      <!-- 준(濬) - 물 수 변에 깊을 준 -->
      <path d="M-35 -110 L-25 -110 M-35 -100 L-25 -100 M-35 -90 L-20 -100" stroke="#111" stroke-width="2" stroke-linecap="round"/>
      <path d="M-15 -110 L5 -110 L-5 -95 L10 -95 L-5 -80" stroke="#111" stroke-width="2" stroke-linecap="round"/>
      
      <!-- 천(川) - 내 천 -->
      <path d="M20 -110 L15 -80 M30 -110 L30 -80 M40 -110 L45 -80" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- 땀 흘려 공사한 인부들의 흔적: 버려진 밀짚 삿갓 -->
    <g transform="translate(150, 270) rotate(-15)">
      <path d="M-30 0 Q0 -30 30 0 Z" fill="#f5cba7" stroke="#e67e22" stroke-width="2"/>
      <path d="M-20 -5 Q0 -20 20 -5" fill="none" stroke="#e67e22" stroke-width="1"/>
      <path d="M-10 -10 Q0 -25 10 -10" fill="none" stroke="#e67e22" stroke-width="1"/>
    </g>
    
  </g>
</svg>
