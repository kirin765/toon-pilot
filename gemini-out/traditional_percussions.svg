<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="traditional_percussions">
    <!-- 한국 전통 풍물놀이 타악기: 장구와 꽹과리 -->
    
    <!-- 따뜻한 나무 마루 바닥 배경 -->
    <rect width="400" height="300" fill="#d35400"/>
    <path d="M0 100 L400 100 M0 200 L400 200" stroke="#a04000" stroke-width="4"/>
    
    <!-- 장구 (Janggu - 모래시계 모양의 북) -->
    <g transform="translate(150, 150) rotate(-15)">
      <!-- 장구의 붉은색 오동나무 울림통 (통) -->
      <!-- 왼쪽 조롱목 -->
      <path d="M-80 -40 C-20 -40 0 -20 0 0 C0 20 -20 40 -80 40 Z" fill="#c0392b" stroke="#78281f" stroke-width="2"/>
      <!-- 오른쪽 조롱목 -->
      <path d="M80 -40 C20 -40 0 -20 0 0 C0 20 20 40 80 40 Z" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
      
      <!-- 가운데 잘록한 허리 (조롱목) 명암 -->
      <ellipse cx="0" cy="0" rx="15" ry="30" fill="#922b21" opacity="0.6"/>
      
      <!-- 왼쪽 가죽 (궁편 - 소가죽, 크고 두꺼움) -->
      <ellipse cx="-80" cy="0" rx="15" ry="55" fill="#f5cba7" stroke="#dc7633" stroke-width="3"/>
      <!-- 가죽을 고정하는 테두리 (철사 띠) -->
      <ellipse cx="-80" cy="0" rx="18" ry="58" fill="none" stroke="#2c3e50" stroke-width="4"/>
      
      <!-- 오른쪽 가죽 (채편 - 말가죽, 얇고 날카로운 소리) -->
      <ellipse cx="80" cy="0" rx="12" ry="50" fill="#fdfefe" stroke="#d0d3d4" stroke-width="3"/>
      <!-- 가죽 고정 테두리 -->
      <ellipse cx="80" cy="0" rx="15" ry="53" fill="none" stroke="#2c3e50" stroke-width="4"/>
      
      <!-- 죔줄 (가죽을 당겨 음정을 맞추는 흰색 줄)과 부전(가죽 쪼가리) -->
      <!-- 지그재그 줄 -->
      <path d="M-80 -55 L80 -50 L-80 -35 L80 -30 L-80 -15 L80 -10 L-80 5 L80 10 L-80 25 L80 30 L-80 45 L80 50" fill="none" stroke="#fdfefe" stroke-width="3" stroke-linejoin="round"/>
      <!-- 죔줄을 조이는 부전 (가죽 장식) -->
      <rect x="-10" y="-45" width="8" height="12" rx="2" fill="#d4ac0d" transform="rotate(10)"/>
      <rect x="0" y="-20" width="8" height="12" rx="2" fill="#d4ac0d" transform="rotate(-5)"/>
      <rect x="10" y="5" width="8" height="12" rx="2" fill="#d4ac0d" transform="rotate(15)"/>
      <rect x="-5" y="30" width="8" height="12" rx="2" fill="#d4ac0d" transform="rotate(-10)"/>
      
      <!-- 장구채 (열채 - 대나무로 만든 얇은 채) -->
      <path d="M70 -80 C90 -40 100 20 120 70" fill="none" stroke="#f1c40f" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- 궁굴채 (궁편을 치는 대나무 끝에 둥근 나무알이 달린 채) -->
    <g transform="translate(60, 220)">
      <path d="M-30 40 L30 -40" stroke="#f1c40f" stroke-width="5" stroke-linecap="round"/>
      <circle cx="30" cy="-40" r="10" fill="#a04000"/>
    </g>
    
    <!-- 꽹과리 (Kkwaenggwari - 놋쇠로 만든 작은 징) -->
    <g transform="translate(280, 210)">
      <!-- 꽹과리 본체 (황동빛 둥근 금속 쟁반 모양) -->
      <ellipse cx="0" cy="0" rx="50" ry="40" fill="#f1c40f" stroke="#b9770e" stroke-width="4"/>
      <!-- 안쪽 음각 형태와 금속 질감 -->
      <ellipse cx="0" cy="0" rx="35" ry="28" fill="none" stroke="#f5b041" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="20" ry="15" fill="#f4d03f" stroke="#d4ac0d" stroke-width="2"/>
      <path d="M-20 -15 C-10 -30 20 -30 30 -10" fill="none" stroke="#fcf3cf" stroke-width="4" opacity="0.6" stroke-linecap="round"/> <!-- 광택 -->
      
      <!-- 꽹과리를 손에 쥐기 위한 붉은 끈 -->
      <path d="M-40 -20 Q-60 -50 -30 -70 Q0 -90 20 -60" fill="none" stroke="#c0392b" stroke-width="4"/>
      <circle cx="-40" cy="-20" r="3" fill="#111"/> <!-- 끈 구멍 -->
      
      <!-- 꽹과리 채 (끝이 나무로 된 짧은 막대) -->
      <path d="M-30 40 L20 10" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="20" cy="10" rx="8" ry="4" fill="#f5cba7" transform="rotate(30 20 10)"/> <!-- 나무 머리 -->
    </g>
    
  </g>
</svg>
