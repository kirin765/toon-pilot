<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="old_slave_document">
    <!-- 재산으로 취급된 노비: 낡고 구겨진 노비 매매 문서 (노비문기) -->
    
    <!-- 어둡고 거친 나무 테이블 배경 -->
    <rect width="400" height="300" fill="#3e2723"/>
    <path d="M0 50 L400 50 M0 150 L400 150 M0 250 L400 250" stroke="#2c1e16" stroke-width="4" opacity="0.5"/> <!-- 나무 결 -->
    
    <!-- 빛 바랜 한지 문서 (노비 문서) - 약간 비스듬하게 놓임 -->
    <g transform="translate(200, 150) rotate(5)">
      <!-- 문서 바탕 -->
      <path d="M-120 -100 L120 -110 L130 90 L-110 110 Z" fill="#fdf2e9" stroke="#d5c8a0" stroke-width="3"/>
      <!-- 문서의 구겨진 주름 효과 -->
      <path d="M-80 -100 L-70 100 M20 -105 L10 100" stroke="#e5e7e9" stroke-width="2"/>
      
      <!-- 오른쪽 위 붉은색 관인 (도장) -->
      <rect x="70" y="-80" width="30" height="30" fill="#c0392b" opacity="0.8"/>
      <path d="M75 -75 L95 -55 M95 -75 L75 -55" stroke="#fff" stroke-width="2"/>
      
      <!-- 세로쓰기 한자 문구 (노비 매매를 뜻하는 간략한 붓글씨) -->
      <!-- '노비(奴婢)', '매매(賣買)' 등을 흉내 낸 검은색 획 -->
      <g fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round">
        <!-- 첫 번째 줄 (오른쪽) -->
        <path d="M50 -60 L50 -40 L40 -40 M50 -50 L60 -50"/>
        <path d="M45 -20 L55 -20 L50 -20 L50 10 M40 0 L60 0"/>
        <path d="M50 30 Q60 50 40 70 M55 40 L65 50"/>
        
        <!-- 두 번째 줄 (가운데) -->
        <path d="M10 -70 L20 -70 L15 -70 L15 -40"/>
        <circle cx="15" cy="-20" r="5"/>
        <path d="M5 0 L25 0 M15 0 L15 30"/>
        <path d="M5 50 L25 50 M5 60 L25 60 L25 80 L5 80 Z"/>
        
        <!-- 세 번째 줄 (왼쪽 - 노비의 수결이나 지장) -->
        <path d="M-30 -50 L-10 -50 M-20 -50 L-20 -20 M-30 -20 L-10 -20"/>
        <path d="M-20 0 Q-10 20 -30 40"/>
      </g>
      
      <!-- 노비가 강제로 찍은 붉은 지장 (손도장) - 왼쪽 아래 -->
      <circle cx="-50" cy="60" r="15" fill="#e74c3c" opacity="0.6"/>
      <path d="M-55 55 Q-50 70 -45 55" fill="none" stroke="#c0392b" stroke-width="2"/>
      <circle cx="-20" cy="50" r="12" fill="#e74c3c" opacity="0.5"/> <!-- 지장 하나 더 -->
      
      <!-- 문서 귀퉁이가 찢어지거나 불에 그을린 자국 -->
      <path d="M-110 110 L-90 90 L-110 70 Z" fill="#3e2723"/> <!-- 찢어진 곳 배경 노출 -->
      <path d="M120 -110 Q100 -100 130 -80 Z" fill="#d35400" opacity="0.6"/> <!-- 탄 자국 -->
    </g>
    
    <!-- 문서 위에 놓인 엽전 꾸러미 (매매 대금) -->
    <g transform="translate(100, 220)">
      <!-- 엽전 끈 -->
      <path d="M0 -30 L-20 20" stroke="#795548" stroke-width="4"/>
      <!-- 엽전 1 -->
      <circle cx="-10" cy="-10" r="18" fill="#f1c40f" stroke="#b9770e" stroke-width="3"/>
      <rect x="-16" y="-16" width="12" height="12" fill="#3e2723"/>
      <!-- 엽전 2 -->
      <circle cx="10" cy="10" r="18" fill="#f1c40f" stroke="#b9770e" stroke-width="3"/>
      <rect x="4" y="4" width="12" height="12" fill="#3e2723"/>
    </g>
    
  </g>
</svg>
