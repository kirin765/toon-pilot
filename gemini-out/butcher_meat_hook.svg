<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="butcher_meat_hook">
    <!-- 배경 거치대 (나무 기둥) -->
    <rect x="50" y="40" width="300" height="20" fill="#5c2e0b"/>
    <rect x="50" y="40" width="300" height="5" fill="#3e2723" opacity="0.5"/>
    <rect x="80" y="40" width="20" height="50" fill="#5c2e0b"/>
    <rect x="300" y="40" width="20" height="50" fill="#5c2e0b"/>
    
    <!-- 쇠갈고리 1 -->
    <path d="M120 60 L120 120" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 120 Q120 150 140 140" fill="none" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
    <!-- 쇠갈고리 끝부분 뾰족하게 -->
    <path d="M138 141 L145 135 L143 145 Z" fill="#7f8c8d"/>
    
    <!-- 쇠갈고리 2 (고기가 걸린 메인 훅) -->
    <path d="M250 60 L250 100" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
    <path d="M250 100 Q250 130 230 120" fill="none" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
    <path d="M232 121 L225 115 L227 125 Z" fill="#7f8c8d"/>
    
    <!-- 걸려있는 소고기 덩어리 (도축된 적색육) -->
    <!-- 덩어리 1 (왼쪽, 빈 갈고리 아래 바닥에 있는 것처럼 묘사할 수도 있지만 여기서는 훅 하나에만 큰 고기를 검) -->
    <g transform="translate(160, 110)">
      <!-- 큰 고기 덩어리 -->
      <path d="M70 0 C90 20 110 50 100 120 C90 170 30 170 10 130 C-10 90 20 40 40 10 C50 -5 60 -10 70 0 Z" fill="#c0392b"/>
      <path d="M70 0 C90 20 110 50 100 120 C90 170 30 170 10 130 C-10 90 20 40 40 10 C50 -5 60 -10 70 0 Z" fill="none" stroke="#922b21" stroke-width="4"/>
      
      <!-- 마블링 및 지방 묘사 (흰색/베이지 선) -->
      <path d="M30 30 Q50 20 70 40" fill="none" stroke="#fdf5e6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M20 70 Q50 90 80 60" fill="none" stroke="#fdf5e6" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M25 110 Q50 130 75 110" fill="none" stroke="#fdf5e6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M85 80 Q95 100 85 130" fill="none" stroke="#fdf5e6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      
      <!-- 갈고리가 살을 파고든 구멍 표현 -->
      <circle cx="70" cy="15" r="6" fill="#7b241c"/>
    </g>
    
    <!-- 피가 뚝뚝 떨어지는 묘사 -->
    <path d="M190 280 Q190 290 195 295" fill="none" stroke="#922b21" stroke-width="3" stroke-linecap="round"/>
    <circle cx="195" cy="300" r="2" fill="#922b21"/>
    <path d="M230 270 Q230 280 225 285" fill="none" stroke="#922b21" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 백정/반인의 칼 (배경에 도마에 박힌 형태로) -->
    <rect x="70" y="240" width="100" height="40" rx="5" fill="#d35400"/>
    <rect x="70" y="240" width="100" height="10" rx="5" fill="#a04000"/>
    
    <path d="M100 240 L120 180 L160 170 L140 240 Z" fill="#bdc3c7"/>
    <path d="M120 180 L160 170 L155 180 L125 190 Z" fill="#ecf0f1"/> <!-- 칼날 -->
    <!-- 칼잡이 (자루) -->
    <rect x="140" y="150" width="25" height="15" fill="#34495e" transform="rotate(30 150 160)"/>
  </g>
</svg>
