<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="traditional_scale">
    <!-- 장터에서 상인들이 물건의 무게를 달던 전통 대저울 (저울대와 추) -->
    
    <!-- 따뜻한 햇살이 비치는 주막 평상 배경 -->
    <rect width="400" height="300" fill="#f0b27a"/>
    <!-- 돗자리 결 무늬 -->
    <line x1="0" y1="50" x2="400" y2="50" stroke="#dc7633" stroke-width="1"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#dc7633" stroke-width="1"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="#dc7633" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#dc7633" stroke-width="1"/>
    <line x1="0" y1="250" x2="400" y2="250" stroke="#dc7633" stroke-width="1"/>
    
    <!-- 평상 위 그림자 -->
    <ellipse cx="200" cy="220" rx="140" ry="20" fill="#ba4a00" opacity="0.6"/>
    
    <!-- 전통 대저울 전체 그룹 -->
    <g transform="translate(200, 150)">
      
      <!-- 눈금이 새겨진 길고 곧은 나무 저울대 (저울대 줏대) -->
      <!-- 약간 비스듬하게 평상 위에 내려놓은 모습 -->
      <g transform="rotate(-15)">
        <rect x="-140" y="-5" width="280" height="10" rx="5" fill="#8b5a2b" stroke="#5c3a21" stroke-width="2"/>
        
        <!-- 저울대의 무게를 읽는 촘촘한 눈금들 (은점, 금점) -->
        <g stroke="#f1c40f" stroke-width="1.5">
          <line x1="-100" y1="-5" x2="-100" y2="0"/>
          <line x1="-80" y1="-5" x2="-80" y2="5"/> <!-- 큰 눈금 -->
          <line x1="-60" y1="-5" x2="-60" y2="0"/>
          <line x1="-40" y1="-5" x2="-40" y2="5"/>
          <line x1="-20" y1="-5" x2="-20" y2="0"/>
          <line x1="0" y1="-5" x2="0" y2="5"/>
          <line x1="20" y1="-5" x2="20" y2="0"/>
          <line x1="40" y1="-5" x2="40" y2="5"/>
          <line x1="60" y1="-5" x2="60" y2="0"/>
          <line x1="80" y1="-5" x2="80" y2="5"/>
          <line x1="100" y1="-5" x2="100" y2="0"/>
          <line x1="120" y1="-5" x2="120" y2="5"/>
        </g>
        
        <!-- 저울을 손으로 들어 올리는 끈 (손잡이 줄) - 중앙 약간 왼쪽에 위치 -->
        <path d="M-50 -5 C-60 -30 -40 -30 -50 -5" fill="none" stroke="#c0392b" stroke-width="3"/>
        <circle cx="-50" cy="-5" r="3" fill="#d4ac0d"/>
        
        <!-- 물건을 올려놓는 저울판 (오른쪽 끄트머리에 매달림) -->
        <!-- 줄 3개로 매달린 놋쇠 접시 -->
        <g transform="translate(130, 5)">
          <path d="M0 0 L-20 60 M0 0 L0 60 M0 0 L20 60" stroke="#7f8c8d" stroke-width="2"/>
          <circle cx="0" cy="0" r="3" fill="#d4ac0d"/>
          
          <!-- 놋쇠(황동)로 된 저울 접시 -->
          <ellipse cx="0" cy="60" rx="30" ry="8" fill="#f1c40f" stroke="#b9770e" stroke-width="2"/>
          <!-- 접시의 두께와 바닥 -->
          <path d="M-30 60 C-30 70 30 70 30 60 Z" fill="#d4ac0d" stroke="#b9770e" stroke-width="2"/>
          
          <!-- 저울에 달기 위해 올려놓은 묵직한 곡물 꾸러미 (종이 봉투 또는 삼베 주머니) -->
          <path d="M-15 55 C-20 40 20 40 15 55 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
          <path d="M-5 40 L0 30 L5 40 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
        </g>
        
        <!-- 저울 눈금을 맞춰 무게를 재는 무거운 추 (저울추) -->
        <!-- 왼쪽 끝부분 눈금에 걸쳐진 쇳덩어리 -->
        <g transform="translate(-100, 5)">
          <!-- 추를 거는 고리와 끈 -->
          <line x1="0" y1="0" x2="0" y2="20" stroke="#7f8c8d" stroke-width="2"/>
          <circle cx="0" cy="0" r="3" fill="#d4ac0d"/>
          
          <!-- 종 모양 또는 조롱박 모양의 무쇠 저울추 -->
          <path d="M-5 20 C-10 25 -15 40 0 45 C15 40 10 25 5 20 Z" fill="#2c3e50" stroke="#17202a" stroke-width="2"/>
          <!-- 무쇠의 반짝임 (하이라이트) -->
          <path d="M-5 30 Q-5 40 0 42" fill="none" stroke="#7f8c8d" stroke-width="2"/>
        </g>
        
      </g>
    </g>
  </g>
</svg>
