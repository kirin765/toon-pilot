<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="surasang">
    <!-- 뒷다리 (Back Legs) -->
    <polygon points="100,200 90,250 110,250 120,200" fill="#6A0D0D" />
    <polygon points="300,200 310,250 290,250 280,200" fill="#6A0D0D" />
    
    <!-- 상 측면/두께 (Table Side/Thickness) -->
    <path d="M 40 160 Q 200 260 360 160 L 360 175 Q 200 275 40 175 Z" fill="#801515" />
    
    <!-- 상판 원반 (Table Top) -->
    <ellipse cx="200" cy="160" rx="160" ry="75" fill="#9C2020" />
    
    <!-- 앞다리 (Front Legs) -->
    <polygon points="80,190 70,260 90,260 100,190" fill="#500A0A" />
    <polygon points="320,190 330,260 310,260 300,190" fill="#500A0A" />

    <!-- ==============================================
         놋그릇 & 백자 11첩 부챗살 배치 (11-Bowl Fan Array)
         ============================================== -->
    
    <!-- 1. 뒷줄 (Back Row) -->
    <g id="bowl-back-1" transform="translate(120, 125)">
      <path d="M -18 5 Q 0 20 18 5 Z" fill="#EAEAEA" /> <!-- 백자 밑 (Porcelain Base) -->
      <path d="M -18 5 Q 0 -10 18 5 Z" fill="#FFFFFF" /> <!-- 백자 뚜껑 (Porcelain Lid) -->
      <path d="M -4 -6 Q 0 -12 4 -6 Z" fill="#EAEAEA" /> <!-- 뚜껑 꼭지 (Lid Knob) -->
    </g>
    <g id="bowl-back-2" transform="translate(170, 115)">
      <path d="M -18 5 Q 0 20 18 5 Z" fill="#C59B27" /> <!-- 놋그릇 밑 (Brass Base) -->
      <path d="M -18 5 Q 0 -10 18 5 Z" fill="#E6C24A" /> <!-- 놋그릇 뚜껑 (Brass Lid) -->
      <path d="M -4 -6 Q 0 -12 4 -6 Z" fill="#F4D03F" /> <!-- 꼭지 -->
    </g>
    <g id="bowl-back-3" transform="translate(230, 115)">
      <path d="M -18 5 Q 0 20 18 5 Z" fill="#EAEAEA" />
      <path d="M -18 5 Q 0 -10 18 5 Z" fill="#FFFFFF" />
      <path d="M -4 -6 Q 0 -12 4 -6 Z" fill="#EAEAEA" />
    </g>
    <g id="bowl-back-4" transform="translate(280, 125)">
      <path d="M -18 5 Q 0 20 18 5 Z" fill="#C59B27" />
      <path d="M -18 5 Q 0 -10 18 5 Z" fill="#E6C24A" />
      <path d="M -4 -6 Q 0 -12 4 -6 Z" fill="#F4D03F" />
    </g>

    <!-- 2. 중간줄 (Middle Row) -->
    <g id="bowl-mid-1" transform="translate(80, 150)">
      <path d="M -20 8 Q 0 25 20 8 Z" fill="#C59B27" />
      <path d="M -20 8 Q 0 -10 20 8 Z" fill="#E6C24A" />
      <path d="M -5 -6 Q 0 -12 5 -6 Z" fill="#F4D03F" />
    </g>
    <g id="bowl-mid-2" transform="translate(140, 145)">
      <path d="M -22 10 Q 0 28 22 10 Z" fill="#C59B27" />
      <path d="M -22 10 Q 0 -12 22 10 Z" fill="#E6C24A" />
      <path d="M -5 -8 Q 0 -15 5 -8 Z" fill="#F4D03F" />
    </g>
    <g id="bowl-mid-3" transform="translate(260, 145)">
      <path d="M -22 10 Q 0 28 22 10 Z" fill="#EAEAEA" />
      <path d="M -22 10 Q 0 -12 22 10 Z" fill="#FFFFFF" />
      <path d="M -5 -8 Q 0 -15 5 -8 Z" fill="#EAEAEA" />
    </g>
    <g id="bowl-mid-4" transform="translate(320, 150)">
      <path d="M -20 8 Q 0 25 20 8 Z" fill="#C59B27" />
      <path d="M -20 8 Q 0 -10 20 8 Z" fill="#E6C24A" />
      <path d="M -5 -6 Q 0 -12 5 -6 Z" fill="#F4D03F" />
    </g>

    <!-- 3. 앞줄 대형 식기 (Front Row Large Bowls) -->
    <g id="bowl-front-1" transform="translate(110, 180)">
      <path d="M -22 10 Q 0 28 22 10 Z" fill="#EAEAEA" />
      <path d="M -22 10 Q 0 -12 22 10 Z" fill="#FFFFFF" />
      <path d="M -5 -8 Q 0 -15 5 -8 Z" fill="#EAEAEA" />
    </g>
    <g id="bowl-center-main" transform="translate(200, 175)">
      <path d="M -28 12 Q 0 35 28 12 Z" fill="#C59B27" />
      <path d="M -28 12 Q 0 -15 28 12 Z" fill="#E6C24A" />
      <path d="M -6 -10 Q 0 -18 6 -10 Z" fill="#F4D03F" />
    </g>
    <g id="bowl-front-2" transform="translate(290, 180)">
      <path d="M -22 10 Q 0 28 22 10 Z" fill="#C59B27" />
      <path d="M -22 10 Q 0 -12 22 10 Z" fill="#E6C24A" />
      <path d="M -5 -8 Q 0 -15 5 -8 Z" fill="#F4D03F" />
    </g>

    <!-- 수저 (Spoon & Chopsticks) -->
    <g id="sujeo" transform="translate(340, 170) rotate(45)">
      <rect x="-2" y="-20" width="4" height="40" fill="#C59B27" /> <!-- 젓가락 1 (Chopstick 1) -->
      <rect x="4" y="-20" width="4" height="40" fill="#C59B27" /> <!-- 젓가락 2 (Chopstick 2) -->
      <path d="M -15 15 Q -10 25 -5 15 L -8 -20 L -12 -20 Z" fill="#C59B27" /> <!-- 숟가락 (Spoon) -->
    </g>
  </g>
</svg>
