<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g id="mourner">
    <!-- ==============================================
         지팡이 (Wooden Cane) 
         ============================================== -->
    <polygon points="120,80 128,80 125,280 117,280" fill="#654321" />
    
    <!-- ==============================================
         몸통: 거친 삼베 도포 (Rough Hemp Coat) 
         ============================================== -->
    <polygon points="170,100 230,100 260,180 250,280 150,280 140,180" fill="#D2C5A5" />
    
    <!-- 팔 (Arms) -->
    <polygon points="170,100 130,150 120,150 120,165 145,155 170,120" fill="#C3B491" /> <!-- 왼팔 -->
    <polygon points="230,100 270,160 285,220 270,220 260,160 230,120" fill="#C3B491" /> <!-- 오른팔 -->

    <!-- 다리와 신발/짚신 (Legs and Shoes) -->
    <polygon points="170,280 185,280 185,295 170,295" fill="#E8C396" /> <!-- 왼발 -->
    <polygon points="215,280 230,280 230,295 215,295" fill="#E8C396" /> <!-- 오른발 -->

    <!-- 손 (Hands) -->
    <circle cx="124" cy="155" r="8" fill="#FAD6B1" /> <!-- 왼쪽 손 -->
    <circle cx="278" cy="225" r="8" fill="#FAD6B1" /> <!-- 오른쪽 손 -->

    <!-- ==============================================
         허리 새끼줄 띠 (Straw Rope Belt)
         ============================================== -->
    <polygon points="153,176 247,176 247,184 153,184" fill="#C4A56A" /> <!-- 띠 기본 베이스 -->
    <!-- 밧줄 꼬임 무늬 (컷아웃 텍스처) -->
    <polygon points="160,176 165,184 170,184 165,176" fill="#A88B52" />
    <polygon points="180,176 185,184 190,184 185,176" fill="#A88B52" />
    <polygon points="200,176 205,184 210,184 205,176" fill="#A88B52" />
    <polygon points="220,176 225,184 230,184 225,176" fill="#A88B52" />
    <polygon points="240,176 245,184 250,184 245,176" fill="#A88B52" />
    <!-- 매듭과 늘어진 줄 (Knot and Hanging Rope) -->
    <polygon points="196,184 204,184 204,230 196,230" fill="#C4A56A" />

    <!-- ==============================================
         머리 (Head) & 굴건 (Gulgeon Headgear)
         ============================================== -->
         
    <!-- 굴건 뒷배경 천 (Back part of headgear) -->
    <polygon points="165,70 180,30 200,20 220,30 235,70" fill="#E3D5B5" />
    <!-- 양옆으로 늘어진 굴건 천 (Side flaps) -->
    <polygon points="165,65 155,110 170,110 175,80" fill="#D2C5A5" />
    <polygon points="235,65 245,110 230,110 225,80" fill="#D2C5A5" />
    <!-- 굴건 윗부분 뾰족한 장식 (Top decoration) -->
    <polygon points="190,20 200,5 210,20" fill="#C3B491" />

    <!-- 얼굴 베이스 (Face Base) -->
    <circle cx="200" cy="80" r="30" fill="#FAD6B1" />
    
    <!-- 눈 (Eyes) -->
    <ellipse cx="190" cy="75" rx="6" ry="8" fill="#FFFFFF" />
    <ellipse cx="210" cy="75" rx="6" ry="8" fill="#FFFFFF" />
    <circle cx="192" cy="75" r="2" fill="#000000" />
    <circle cx="208" cy="75" r="2" fill="#000000" />
    
    <!-- 입 (Mouth) - 단색 폴리곤 -->
    <polygon points="190,95 200,98 210,95 210,97 200,100 190,97" fill="#000000" />

    <!-- 앞쪽 이마 띠 (Front Headband of Gulgeon) -->
    <polygon points="168,65 232,65 230,55 170,55" fill="#C3B491" /> 
    <polygon points="175,55 225,55 210,40 190,40" fill="#E3D5B5" /> 
  </g>
</svg>
